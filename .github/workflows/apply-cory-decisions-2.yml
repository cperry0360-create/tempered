name: Apply Cory decisions 2

on:
  push:
    branches:
      - chatgpt/cory-decisions-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved platform, Train and protein decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Protein catalogue: numeric grams with a body-weight-derived finish line.
          path = Path('data/activities.json')
          data = json.loads(path.read_text())
          protein = next(a for a in data['activities'] if a['id'] == 'protein_target')
          protein['name'] = 'Protein'
          protein['short'] = 'Protein'
          protein['kind'] = 'derived'
          protein['unit'] = 'g'
          protein['goalPerLb'] = 0.8
          protein['help'] = 'Daily goal is at least 0.8 grams per pound of your latest recorded body weight.'
          path.write_text(json.dumps(data, indent=2) + '\n')

          # Activity storage changes from one-tap mark to a numeric daily total.
          path = Path('src/domain/activities.js')
          text = path.read_text()
          old = "  protein_target: { field: 'proteinTargetMet', entry: 'mark' },"
          new = "  protein_target: { field: 'proteinGrams', entry: 'number', mode: 'replace' },"
          if old not in text and new not in text:
              raise SystemExit('protein activity mapping not found')
          path.write_text(text.replace(old, new))

          # Daily service derives the target from the latest body weight and stores
          # the met/not-met boolean that the pure XP engine already consumes.
          path = Path('src/app/daily.js')
          text = path.read_text()
          imp = "import { proteinGoalGrams, proteinGoalMet } from '../domain/protein.js'\n"
          anchor = "import { rankFromLevels } from '../domain/rank.js'\n"
          if imp not in text:
              if anchor not in text: raise SystemExit('daily import anchor not found')
              text = text.replace(anchor, anchor + imp)

          helper_anchor = "  async function dayLog(date) {\n    return (await storage.get('dayLogs', date)) ?? { date }\n  }\n"
          helper = helper_anchor + "\n  async function proteinGoalFor(date, candidateDay = null) {\n    const profile = await storage.get('profile', 'profile')\n    let weight = candidateDay?.bodyMetrics?.weight\n    if (!(typeof weight === 'number' && Number.isFinite(weight) && weight > 0)) {\n      const latest = (await storage.getAll('dayLogs'))\n        .filter((row) => row.date <= date\n          && typeof row.bodyMetrics?.weight === 'number'\n          && Number.isFinite(row.bodyMetrics.weight)\n          && row.bodyMetrics.weight > 0)\n        .sort((a, b) => b.date.localeCompare(a.date))[0]\n      weight = latest?.bodyMetrics?.weight ?? null\n    }\n    return proteinGoalGrams(weight, profile?.units ?? 'imperial')\n  }\n\n  async function resolveProteinDay(day) {\n    const goal = await proteinGoalFor(day.date, day)\n    if (goal === null) return day\n    if (typeof day.proteinGrams !== 'number') return { ...day, proteinGoalGrams: goal }\n    return {\n      ...day,\n      proteinGoalGrams: goal,\n      proteinTargetMet: proteinGoalMet(day.proteinGrams, goal),\n    }\n  }\n"
          if 'async function proteinGoalFor' not in text:
              if helper_anchor not in text: raise SystemExit('dayLog helper anchor not found')
              text = text.replace(helper_anchor, helper)

          settle_old = "  async function settleDay(day) {\n    const profile = await storage.get('profile', 'profile')"
          settle_new = "  async function settleDay(day) {\n    day = await resolveProteinDay(day)\n    const profile = await storage.get('profile', 'profile')"
          if settle_new not in text:
              if settle_old not in text: raise SystemExit('settleDay anchor not found')
              text = text.replace(settle_old, settle_new)

          old_decorate = """  function decorate(activity, day, schedule) {
    const cadence = schedule[activity.id]?.cadence ?? 'off'
    return {
      ...activity,
      daily: cadence === 'daily',
      cadence,
      weeklyTarget: cadence === 'weekly' ? schedule[activity.id].target : null,
      spec: ACTIVITY_FIELDS[activity.id],
      value: ACTIVITY_FIELDS[activity.id]?.stores === 'bodyMetrics'
        ? day.bodyMetrics?.weight ?? null
        : activityValue(activity, day),
      logged: isLogged(activity, day),
    }
  }
"""
          new_decorate = """  function decorate(activity, day, schedule, dynamicProteinGoal = null) {
    const cadence = schedule[activity.id]?.cadence ?? 'off'
    const decorated = {
      ...activity,
      daily: cadence === 'daily',
      cadence,
      weeklyTarget: cadence === 'weekly' ? schedule[activity.id].target : null,
      spec: ACTIVITY_FIELDS[activity.id],
      value: ACTIVITY_FIELDS[activity.id]?.stores === 'bodyMetrics'
        ? day.bodyMetrics?.weight ?? null
        : activityValue(activity, day),
      logged: isLogged(activity, day),
    }
    if (activity.id === 'protein_target') {
      return { ...decorated, dailyCap: day.proteinGoalGrams ?? dynamicProteinGoal ?? null }
    }
    return decorated
  }
"""
          if new_decorate not in text:
              if old_decorate not in text: raise SystemExit('decorate block not found')
              text = text.replace(old_decorate, new_decorate)

          today_anchor = "    const schedule = await activitySchedule()\n    const { outstanding, logged } = splitActivities(activities, day)"
          today_new = "    const schedule = await activitySchedule()\n    const proteinGoal = await proteinGoalFor(date, day)\n    const { outstanding, logged } = splitActivities(activities, day)"
          if today_new not in text:
              if today_anchor not in text: raise SystemExit('today goal anchor not found')
              text = text.replace(today_anchor, today_new)
          text = text.replace("outstanding: outstanding.map((activity) => decorate(activity, day, schedule)),", "outstanding: outstanding.map((activity) => decorate(activity, day, schedule, proteinGoal)),")
          text = text.replace("logged: logged.map((activity) => decorate(activity, day, schedule)),", "logged: logged.map((activity) => decorate(activity, day, schedule, proteinGoal)),")

          week_anchor = "    const todayDay = days.find((day) => day.date === todayDate) ?? { date: todayDate }\n\n    const weekly = activities"
          week_new = "    const todayDay = days.find((day) => day.date === todayDate) ?? { date: todayDate }\n    const proteinGoal = await proteinGoalFor(todayDate, todayDay)\n    const completedOnDay = (activity, row) => activity.id === 'protein_target'\n      ? row.proteinTargetMet === true\n      : isLogged(activity, row)\n\n    const weekly = activities"
          if week_new not in text:
              if week_anchor not in text: raise SystemExit('week goal anchor not found')
              text = text.replace(week_anchor, week_new)
          text = text.replace("const done = days.filter((day) => isLogged(activity, day)).length", "const done = days.filter((day) => completedOnDay(activity, day)).length")
          text = text.replace("...decorate(activity, todayDay, schedule),", "...decorate(activity, todayDay, schedule, proteinGoal),")
          text = text.replace("loggedToday: isLogged(activity, todayDay),", "loggedToday: completedOnDay(activity, todayDay),")
          path.write_text(text)

          # Today: gram labels + a goal row remains outstanding even before body
          # weight exists, with an explicit prompt instead of pretending it is done.
          path = Path('src/ui/screens/today.js')
          text = path.read_text()
          text = text.replace("return { hours: 'h', min: 'min', oz: 'oz', steps: 'steps' }[activity.unit] ?? ''", "return { hours: 'h', min: 'min', oz: 'oz', steps: 'steps', g: 'g' }[activity.unit] ?? ''")
          text = text.replace(": activity.unit === 'steps' ? 'steps'\n          : activity.id === 'body_metrics' ? 'lb' : ''", ": activity.unit === 'steps' ? 'steps'\n          : activity.unit === 'g' ? 'g'\n            : activity.id === 'body_metrics' ? 'lb' : ''")
          old = "export function hasDailyGoal(activity) {\n  return Number.isFinite(activity?.dailyCap) && activity.dailyCap > 0\n}"
          new = "export function hasDailyGoal(activity) {\n  return (Number.isFinite(activity?.dailyCap) && activity.dailyCap > 0)\n    || (Number.isFinite(activity?.goalPerLb) && activity.goalPerLb > 0)\n}"
          if new not in text:
              if old not in text: raise SystemExit('hasDailyGoal block not found')
              text = text.replace(old, new)
          old = "export function dailyGoalComplete(activity) {\n  if (!hasDailyGoal(activity)) return activity?.logged === true\n  return typeof activity.value === 'number' && activity.value >= activity.dailyCap\n}"
          new = "export function dailyGoalComplete(activity) {\n  if (!hasDailyGoal(activity)) return activity?.logged === true\n  if (!(Number.isFinite(activity?.dailyCap) && activity.dailyCap > 0)) return false\n  return typeof activity.value === 'number' && activity.value >= activity.dailyCap\n}"
          if new not in text:
              if old not in text: raise SystemExit('dailyGoalComplete block not found')
              text = text.replace(old, new)
          old = "function dailyGoalLabel(activity) {\n  if (!hasDailyGoal(activity)) return null\n  const value = typeof activity.value === 'number' ? activity.value : 0"
          new = "function dailyGoalLabel(activity) {\n  if (!hasDailyGoal(activity)) return null\n  if (!(Number.isFinite(activity?.dailyCap) && activity.dailyCap > 0)) return 'log body weight to set goal'\n  const value = typeof activity.value === 'number' ? activity.value : 0"
          if new not in text:
              if old not in text: raise SystemExit('dailyGoalLabel block not found')
              text = text.replace(old, new)
          path.write_text(text)

          # Types describe the new stored values.
          path = Path('src/domain/types.js')
          text = path.read_text()
          anchor = " * @property {boolean} [proteinTargetMet]\n"
          addition = " * @property {number|null} [proteinGrams]\n * @property {number|null} [proteinGoalGrams]\n" + anchor
          if ' * @property {number|null} [proteinGrams]' not in text:
              if anchor not in text: raise SystemExit('types protein anchor not found')
              text = text.replace(anchor, addition)
          path.write_text(text)

          # Platform decision: keep the modern module-worker implementation and
          # state the supported target plainly instead of implying legacy support.
          path = Path('src/pwa/register.js')
          text = path.read_text()
          old = "        // Module workers need a modern browser (iOS 16.4+). On anything older\n        // the app still runs — it just runs online-only, which is a better\n        // outcome than a hard failure at startup."
          new = "        // Tempered's supported iOS PWA target is 16.4+. Older iOS versions\n        // are not a compatibility target; registration failure still must not\n        // hard-fail the foreground app."
          if new not in text:
              if old not in text: raise SystemExit('service-worker compatibility comment not found')
              text = text.replace(old, new)
          path.write_text(text)

          # Record the three resolved Cory decisions without reopening them later.
          path = Path('DECISIONS.md')
          text = path.read_text()
          marker = '## 2026-09-05 — Cory decisions: modern iOS, today FAB, body-weight protein goal'
          if marker not in text:
              text += f"\n\n{marker}\n\n**Decision:** Tempered targets modern iOS PWA support (iOS 16.4+); iOS 16.3 and older are not a compatibility target. The Train primary FAB starts the program day prescribed for today. Protein is tracked as grams with a daily finish line of at least 0.8 g per pound of the latest recorded body weight; metric weights are converted to pounds before calculating the target.\n\n**Needs Cory:** no\n"
              path.write_text(text)
          PY

          git config user.name "Tempered CI"
          git config user.email "actions@github.com"
          git add data/activities.json src/domain/activities.js src/app/daily.js src/ui/screens/today.js src/domain/types.js src/pwa/register.js DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply Cory-approved protein and platform decisions"
            git push origin HEAD:chatgpt/cory-decisions-2
          fi
