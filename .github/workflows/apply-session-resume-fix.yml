name: Apply session resume fix

on:
  push:
    branches:
      - chatgpt/session-resume-fix
    paths:
      - tools/apply-session-resume-fix.py
      - .github/workflows/apply-session-resume-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/session-resume-fix
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply-session-resume-fix.py
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src sw.js docs test
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Persist and resume active workouts"
          git push origin HEAD:chatgpt/session-resume-fix
