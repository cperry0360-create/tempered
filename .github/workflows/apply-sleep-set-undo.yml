name: Apply sleep and set undo patch

on:
  push:
    branches:
      - chatgpt/sleep-set-undo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sleep-set-undo
      - name: Apply patch
        run: python3 tools/apply-sleep-undo-patch.py
      - name: Remove one-shot patch machinery
        run: rm tools/apply-sleep-undo-patch.py .github/workflows/apply-sleep-set-undo.yml
      - name: Commit patched product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve decimal sleep entry and allow set undo"
          git push origin HEAD:chatgpt/sleep-set-undo
