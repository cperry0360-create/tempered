name: Fix decisions 3

on:
  push:
    branches:
      - chatgpt/cory-decisions-3

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cory-decisions-3
      - name: Fix integration semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/app/cadence.test.js',
              "  const calories = await daily.log('calories_logged')",
              "  const calories = await daily.log('calories_logged', 500)")

          replace('src/domain/activities.test.js',
              "    const scoredField = spec.scoredField ?? spec.field",
              "    const scoredField = spec.scoredField ?? spec.trackedField ?? spec.field")

          replace('src/app/workout.js',
              "    return { active, logs }\n  }\n\n  /** Today's prescribed slots, as tasks. */",
              "    return { active, logs, sessions }\n  }\n\n  /** Today's prescribed slots, as tasks. */")

          replace('src/app/workout.js',
              "    const { active, logs } = await currentWeekLogs()\n    if (!active) return null\n    const targets = await exerciseFrequencyTargets()\n    const sessionsByExercise = new Map()\n    for (const log of logs) {\n      if (log.isWarmup) continue\n      if (!sessionsByExercise.has(log.exerciseId)) sessionsByExercise.set(log.exerciseId, new Set())\n      sessionsByExercise.get(log.exerciseId).add(log.sessionId)\n    }\n    return {\n      ...active,\n      week: weekTasks(active.program, logs),\n      hardSets: weeklyHardSetsCompleted(logs, await exerciseMap(), active.program.weeklyTargets ?? {}),\n      exerciseFrequencyTargets: targets,\n      exerciseFrequencyDone: Object.fromEntries([...sessionsByExercise].map(([id, sessions]) => [id, sessions.size])),\n    }",
              "    const { active, logs, sessions } = await currentWeekLogs()\n    if (!active) return null\n    const targets = await exerciseFrequencyTargets()\n    const daysByExercise = new Map()\n    for (const log of logs) {\n      if (log.isWarmup) continue\n      const date = sessions.get(log.sessionId)?.date\n      if (!date) continue\n      if (!daysByExercise.has(log.exerciseId)) daysByExercise.set(log.exerciseId, new Set())\n      daysByExercise.get(log.exerciseId).add(date)\n    }\n    return {\n      ...active,\n      week: weekTasks(active.program, logs),\n      hardSets: weeklyHardSetsCompleted(logs, await exerciseMap(), active.program.weeklyTargets ?? {}),\n      exerciseFrequencyTargets: targets,\n      exerciseFrequencyDone: Object.fromEntries([...daysByExercise].map(([id, days]) => [id, days.size])),\n    }")

          replace('src/app/workout.test.js',
              "test('exercise frequency can override the program and counts extra workout occurrences', async () => {\n  const { workout } = await freshApp()",
              "test('exercise frequency can override the program and counts distinct training days', async () => {\n  const { workout, clock } = await freshApp()")

          replace('src/app/workout.test.js',
              "  await workout.finishSession(first, { durationMinutes: 10 })\n  const second = await workout.startSession(null)",
              "  await workout.finishSession(first, { durationMinutes: 10 })\n  clock.advanceDays(1)\n  const second = await workout.startSession(null)")
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Tempered CI"
          git config user.email "actions@github.com"
          git add src
          git commit -m "Align calories guard and weekly exercise frequency semantics"
          git push origin HEAD:chatgpt/cory-decisions-3
