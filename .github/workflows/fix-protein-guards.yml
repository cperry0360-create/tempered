name: Fix protein guards

on:
  push:
    branches:
      - chatgpt/cory-decisions-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix-protein-guards.py
      - run: |
          rm .github/workflows/fix-protein-guards.yml tools/fix-protein-guards.py
          git config user.name "Tempered CI"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile protein guards and offline cache"
            git push origin HEAD:chatgpt/cory-decisions-2
          fi
