name: Nutrition visual fidelity frames
on:
  push:
    branches: [main]
    paths:
      - 'reference/forged-nutrition.html'
      - 'reference/tempered-fuel-study.html'
      - 'reference/tempered-journal-study.html'
      - 'reference/capture.mjs'
      - '.github/workflows/reference-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture Forged + Tempered Fuel and Journal frames with Chromium CDP
        timeout-minutes: 2
        run: |
          # Chromium occasionally stalls during a cold start on the hosted runner.
          # Retry a capture launch, but fail on repeated errors.
          node reference/capture.mjs || node reference/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-fidelity-screenshots
          path: reference/visual-evidence/*.png
          retention-days: 14
