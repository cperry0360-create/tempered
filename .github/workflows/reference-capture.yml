name: Forged visual fidelity frames
on:
  push:
    branches: [main]
    paths:
      - 'reference/forged-nutrition.html'
      - 'reference/capture.mjs'
      - '.github/workflows/reference-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture dashboard, journal, and quick log with Chromium CDP
        timeout-minutes: 2
        run: node reference/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: forged-reference-screenshots
          path: reference/visual-evidence/*.png
          retention-days: 14
