name: Tempered tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }} full regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every JavaScript module
        run: find src test tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full test suite
        run: node --test
      - name: Battle art contract
        run: node tools/verify-battle-art.js

  browser:
    runs-on: ubuntu-latest
    name: All browser acceptance harnesses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every browser harness
        shell: bash
        run: set -o pipefail; node tools/verify-browser-harnesses.js | tee browser-harness.log
      - name: Upload browser harness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-harness-log
          path: browser-harness.log
