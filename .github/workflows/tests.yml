name: Tempered tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }} full regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every JavaScript module
        run: find src test tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full test suite
        run: node --test

  browser:
    runs-on: ubuntu-latest
    name: All browser acceptance harnesses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every browser harness
        run: node tools/verify-browser-harnesses.js

  delete-merged-pr-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/harness-doc-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete exactly the eight stale merged PR heads
        shell: bash
        run: |
          branches=(
            'claude/exercise-art-open-source-qgb09y'
            'chatgpt/phase-7-setup'
            'chatgpt/session-cancel-fix'
            'chatgpt/persistent-settings'
            'chatgpt/daily-weekly-cadence'
            'chatgpt/phase-8-polish'
            'chatgpt/ui-fixes-additive-goals'
            'chatgpt/ui-viewport-spacing'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done
