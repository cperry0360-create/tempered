name: Tempered tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }} full regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every JavaScript module
        run: find src test tools -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: R1 redesign foundation invariants
        shell: bash
        run: |
          echo '$ grep -rE "#[0-9a-fA-F]{3,8}\\b" src/*.css'
          HEX_OUTPUT="$(grep -rE '#[0-9a-fA-F]{3,8}\b' src/*.css || true)"
          printf '%s\n' "$HEX_OUTPUT"
          if printf '%s\n' "$HEX_OUTPUT" | grep -v '^src/tokens.css:' | grep -q .; then
            echo 'Unexpected literal colour outside src/tokens.css'
            exit 1
          fi

          echo '$ grep -r "uppercase" src/'
          if grep -r "uppercase" src/; then
            echo 'Unexpected uppercase marker remains under src/'
            exit 1
          fi
          echo '(no output)'

          echo '$ compare !important count to parent'
          BEFORE_IMPORTANT="$(git grep -h -o '!important' HEAD^ -- 'src/*.css' | wc -l | tr -d ' ')"
          AFTER_IMPORTANT="$(git grep -h -o '!important' HEAD -- 'src/*.css' | wc -l | tr -d ' ')"
          echo "parent=$BEFORE_IMPORTANT current=$AFTER_IMPORTANT"
          if [ "$AFTER_IMPORTANT" -gt "$BEFORE_IMPORTANT" ]; then
            echo 'R1 increased !important usage'
            exit 1
          fi
      - name: Full test suite
        run: node --test
      - name: Battle art contract
        run: node tools/verify-battle-art.js

  browser:
    runs-on: ubuntu-latest
    name: All browser acceptance harnesses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every browser harness
        run: node tools/verify-browser-harnesses.js
      - name: Verify active-workout logging speed
        run: node tools/verify-logging-speed.js

  visual-evidence:
    runs-on: ubuntu-latest
    name: Mobile visual release evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture required release surfaces
        run: node tools/capture-release-screens.js
      - name: Preserve visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: tempered-mobile-visuals
          path: |
            artifacts/release-visuals
            docs/mockups/redesign-v1.png
          retention-days: 14

  ios-native:
    runs-on: macos-latest
    name: Native iOS wrapper build
    steps:
      - uses: actions/checkout@v4
      - name: Build Tempered for iOS Simulator
        run: >-
          xcodebuild
          -project native/ios/Tempered.xcodeproj
          -scheme Tempered
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
