<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered</title>
    <meta name="description" content="Training tracker with an RPG progression layer." />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark" />

    <!-- Every path here is relative, so the app runs unchanged from the repo
         root, from a /tempered/ project page, or from a custom domain. -->
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />

    <!-- iOS ignores the manifest for home-screen installs; these drive it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempered" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="shell__wordmark">TEMPERED</p>
    </div>
  </body>
</html>
