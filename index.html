<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tempered</title>
    <meta name="description" content="Training tracker with an RPG progression layer." />
    <meta name="theme-color" content="#0b1e31" />
    <meta name="color-scheme" content="dark" />

    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/setup.css" />
    <link rel="stylesheet" href="./src/cadence.css" />
    <link rel="stylesheet" href="./src/polish.css" />
    <link rel="stylesheet" href="./src/battle.css" />

    <style>
      body::before {
        background-position: center center;
        opacity: 0.48;
        filter: none;
        transform: none;
      }

      /* This is an installed app surface, not a document canvas. Keep touch
         scrolling, but do not let a pinch gesture leave the viewport scaled or
         visually shifted off centre. */
      html,
      body,
      .app {
        touch-action: pan-x pan-y;
        overscroll-behavior-x: none;
      }

      .screen__title {
        position: relative;
        z-index: 1;
        opacity: 1 !important;
        filter: none !important;
        -webkit-filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        text-shadow: none !important;
        transform: none !important;
      }

      /* Deliberate air below the iPhone status area. The previous 12px addition
         was too subtle in the installed PWA; 32px is visibly intentional. */
      .app__body {
        padding-top: calc(max(var(--s4), env(safe-area-inset-top)) + var(--s5));
      }

      .settings-access {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 20px);
        right: 14px;
        z-index: 40;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: rgba(11, 30, 49, 0.78);
        color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .settings-access .icon { width: 22px; height: 22px; }
      .settings-access[data-active="true"] { color: #efff5a; border-color: rgba(239, 255, 90, 0.38); }
      .settings-access[hidden] { display: none !important; }

      /* Goal-based daily trackers keep their running total visible beneath the
         name without stealing horizontal room from quick-add controls. */
      .row.entry[data-goal="true"] .entry__label {
        flex: 1 1 auto;
        min-width: 0;
        display: grid;
        gap: 1px;
      }
      .row.entry[data-goal="true"] .entry__label .row__name {
        flex: none;
        min-width: 0;
      }
      .entry__progress {
        color: var(--blue);
        font-size: var(--text-xs);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* Tempered-owned confirmation sheet. No browser-native alert chrome. */
      .confirm-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        align-items: end;
        justify-items: center;
        padding: var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));
        background: rgba(7, 21, 36, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .confirm-sheet {
        width: min(100%, 520px);
        display: grid;
        gap: var(--s3);
        padding: var(--s4);
        border: 1px solid var(--edge-strong);
        border-radius: var(--r-xl);
        background: color-mix(in srgb, var(--surface) 94%, var(--canopy));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.56);
      }
      .confirm-sheet__eyebrow {
        margin: 0;
        color: var(--text-3);
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .confirm-sheet__title {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--text-xl);
        font-weight: 800;
        line-height: 1.05;
      }
      .confirm-sheet__copy {
        margin: 0;
        color: var(--text-2);
        font-size: var(--text-md);
      }
      .confirm-sheet__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s2);
        padding-top: var(--s1);
      }
      .confirm-sheet__discard {
        background: var(--well);
        box-shadow: inset 0 0 0 1px var(--edge-strong);
      }

      @media (prefers-reduced-transparency: reduce) {
        body::before { opacity: 0.28; }
        .settings-access,
        .confirm-overlay { backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
    </style>

    <link rel="stylesheet" href="./src/calm.css" />
    <link rel="stylesheet" href="./src/battle-fidelity.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempered" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="shell__wordmark">TEMPERED</p>
    </div>
  </body>
</html>
