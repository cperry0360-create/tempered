<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered</title>
    <meta name="description" content="Training tracker with an RPG progression layer." />
    <meta name="theme-color" content="#0b1e31" />
    <meta name="color-scheme" content="dark" />

    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/setup.css" />
    <link rel="stylesheet" href="./src/cadence.css" />
    <link rel="stylesheet" href="./src/polish.css" />

    <style>
      body::before {
        background-position: center center;
        opacity: 0.48;
        filter: none;
        transform: none;
      }

      .screen__title {
        position: relative;
        z-index: 1;
        opacity: 1 !important;
        filter: none !important;
        -webkit-filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        text-shadow: none !important;
        transform: none !important;
      }

      .settings-access {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        right: 14px;
        z-index: 40;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: rgba(11, 30, 49, 0.78);
        color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .settings-access .icon { width: 22px; height: 22px; }
      .settings-access[data-active="true"] { color: #efff5a; border-color: rgba(239, 255, 90, 0.38); }
      .settings-access[hidden] { display: none !important; }

      @media (prefers-reduced-transparency: reduce) {
        body::before { opacity: 0.28; }
        .settings-access { backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
    </style>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempered" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="shell__wordmark">TEMPERED</p>
    </div>
  </body>
</html>
