<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered</title>
    <meta name="description" content="Training tracker with an RPG progression layer." />
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="color-scheme" content="dark" />

    <!-- Every path here is relative, so the app runs unchanged from the repo
         root, from a /tempered/ project page, or from a custom domain. -->
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/setup.css" />

    <!-- Keep Cory's background artwork recognizable. The base stylesheet's
         original 15% + blur treatment made the signpost read like a cross and
         erased the moon, owl, lanterns and path. This override preserves the
         artwork itself while leaving the existing UI surfaces untouched. -->
    <style>
      body::before {
        background-position: center center;
        opacity: 0.48;
        filter: none;
        transform: none;
      }

      /* Page titles must stay razor-sharp. A blurred section label looks like a
         loading or rendering failure, especially against the detailed art. */
      .screen__title {
        position: relative;
        z-index: 1;
        opacity: 1 !important;
        filter: none !important;
        -webkit-filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        text-shadow: none !important;
        transform: none !important;
      }

      @media (prefers-reduced-transparency: reduce) {
        body::before { opacity: 0.28; }
      }
    </style>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />

    <!-- iOS ignores the manifest for home-screen installs; these drive it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempered" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="shell__wordmark">TEMPERED</p>
    </div>
  </body>
</html>
