    <link id="tempered-manifest" rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Render the saved preference before first paint. No device sniffing:
      // ordinary users keep the standard layout until they turn it on.
      let saved = null
      try { saved = localStorage.getItem('tempered:duo-layout') } catch {}
      const duoInstall = new URLSearchParams(location.search).get('layout') === 'duo'
      if (saved === 'enabled' || (saved !== 'disabled' && duoInstall)) {
        document.documentElement.dataset.layout = 'duo'
      }
      // Only a fresh install opened via the Duo URL requests a manifest
      // that permits unfolding/rotation; toggling CSS cannot change the
      // orientation contract of an already installed Home Screen PWA.
      if (duoInstall) {
        document.getElementById('tempered-manifest').href = './manifest-duo.webmanifest'
      }
    </script>
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="LFMS" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

  </head>
  <body>
    <!-- A real fixed element on the top edge: iOS 26 skips its Liquid Glass edge blur for it. -->
    <div class="status-bar-cover" aria-hidden="true"></div>
    <div class="portrait-lock" role="status" aria-live="polite">
      <span class="portrait-lock__phone" aria-hidden="true">▯</span>
      <strong>Rotate to portrait</strong>
      <span>Less Fat More Strong is designed for portrait mode.</span>
    </div>
    <div class="lfms-launch" data-lfms-launch aria-hidden="true">
      <div class="lfms-launch__glow"></div>
      <div class="lfms-launch__identity">
        <div class="lfms-launch__mark-stage">
          <img class="lfms-launch__mark" src="./branding/lfms/logo-mark.svg" alt="" width="675" height="387" />
          <div class="lfms-launch__impact-flash" aria-hidden="true"></div>
          <!-- Three neutral, hairline layers: a new fracture emerges on each impact.
               Fixed to the landing spot rather than moving with the bouncing mark. -->
          <svg class="lfms-launch__cracks" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
            <g class="lfms-launch__glass-phase lfms-launch__glass-phase--first"
               fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="miter">
              <!-- Uneven radial faults emanating from the emblem's contact point. -->
              <path d="M300 208l-24-17-34-10-20-26-37-11-16-33-36-13"/>
              <path d="M300 208l-28 9-32 2-20 24-38 5-29 34-37 9"/>
              <path d="M300 208l-12 27-25 28-5 34-26 27-11 39-24 11"/>
              <path d="M300 208l21 20 9 32 22 25 3 43 28 21 16 49"/>
              <path d="M300 208l34-7 25 15 39-7 34 14 35-19 42 10"/>
              <path d="M300 208l10-32 29-17 14-30 39-9 13-43 34-18"/>
              <path d="M300 208l-4-39 17-33-6-41 12-24-15-38"/>
              <path d="M300 208l-38-14-18-24-28-12-9-32-40-18"/>
              <!-- Broken, irregular interior rings, not a drawn circular shockwave. -->
              <path d="M285 184l-14 20 9 24 25 9 27-16-3-27-25-16-19 6"/>
              <path d="M273 164l-24 20-9 39 21 34 38 17 46-17 23-35-10-43-38-27-47 12"/>
            </g>
            <g class="lfms-launch__glass-phase lfms-launch__glass-phase--second"
               fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="miter">
              <!-- The second contact drives branching faults into a wider ring. -->
              <path d="M240 223l-37-20-37 7-22-14-29 9 M261 257l-14 45-45 8-20 31-38 6"/>
              <path d="M329 260l42 7 22 30 47 7 30 29 M345 257l9-52 46-25 42-1 30-34"/>
              <path d="M249 184l-26-28-8-37-35-21 M320 152l-14-31 11-33-20-38"/>
              <path d="M241 177l-34 33 3 46 36 41 51 12 52-17 46-43-1-54-31-47"/>
              <path d="M225 267l-25 28 5 48 M392 249l34 10 21 31 M352 292l16 33-8 36"/>
              <path d="M263 309l-23 42-28 13 M343 291l42 37 7 31"/>
            </g>
            <g class="lfms-launch__glass-phase lfms-launch__glass-phase--third"
               fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="miter">
              <!-- Final tiny contact splinters existing seams instead of exploding. -->
              <path d="M271 204l-24-7-15 9 M318 228l29 14 11-4"/>
              <path d="M288 235l-4 25-15 8 M336 201l24-14 15 4"/>
              <path d="M207 210l-20-7-12-15 M371 267l20 14 23-3"/>
              <path d="M298 273l-8 22-16 13 M350 176l24-8 16-19"/>
              <path d="M300 208l5-12-7-13 M300 208l-10 8-4 13"/>
            </g>
          </svg>
        </div>
        <span class="lfms-launch__rule"></span>
        <div class="lfms-launch__wordmark-stage">
          <img class="lfms-launch__wordmark lfms-launch__wordmark--less" src="./branding/lfms/logo-wordmark.svg" alt="" width="1125" height="235" />
          <img class="lfms-launch__wordmark lfms-launch__wordmark--strong" src="./branding/lfms/logo-wordmark.svg" alt="" width="1125" height="235" />
        </div>
        <p class="lfms-launch__tagline">TRAIN · FUEL · RECOVER</p>
      </div>
    </div>
    <div id="app" class="app">
      <img class="lfms__loading-logo" src="./branding/lfms/logo-full.svg" alt="Less Fat More Strong" />
    </div>
  </body>
</html>
