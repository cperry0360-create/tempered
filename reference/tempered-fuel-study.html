:root { --t-deep:#061424;--t-deeper:#04101E;--t-panel:#102A43;--t-raised:#183752;--t-rail:#0D253C;--t-line:#294966;--t-blue:#359DF3;--t-blue2:#76C3FF;--t-text:#F5F9FF;--t-muted:#9DB9D0;}
html,body {background:var(--t-deep);color:var(--t-text);}
.screen {background: radial-gradient(ellipse 460px 230px at 45% -90px,#183753 0%, transparent 95%),var(--t-deep);}
.mark .logo:before,.mark .logo:after,.mark .logo i {background:var(--t-blue);}
.mark strong {font-size:16px;letter-spacing:-.55px;font-weight:770;white-space:nowrap;}
.mark .slash{color:var(--t-muted);font-weight:400;}
.blue-text{color:var(--t-blue);}
.pill{background:linear-gradient(#193650,#102840);border-color:#2A465E;color:var(--t-text);}
.pill svg{stroke:var(--t-text);}
.week{color:#7896B0;}.day.active{color:var(--t-text);}
.check{background:var(--t-blue);color:var(--t-deeper);}
.kpi{border-left-color:var(--t-text);color:var(--t-text);}
.kpi.protein{border-color:var(--t-blue);}
.pct,.kpi .label{color:var(--t-muted);}
.kpi .value{color:var(--t-text);}
.cross{color:#7893A9;}
.donut .ticks{stroke:#23415A;}
.donut .outertrack{stroke:#294359;}
.donut .outerprogress{stroke:#F5F9FF;}
.donut .innertrack{stroke:#123A58;}
.donut .innerprogress{stroke:var(--t-blue);}
.donut .needle{stroke:var(--t-blue2);}
.macro .cross,.macro:nth-child(3) .cross{color:var(--t-blue);}
.macro .name{color:var(--t-text);}
.macro .bar{background:#163A53;}
.macro .bar:before{background:var(--t-blue);}
.macro .bar:after{background:#668DA9;}
.macro .amount{color:var(--t-muted);}
.track-other{color:var(--t-blue2);text-shadow:none;}
.stat{background:linear-gradient(151deg,#16344F,#0D243B);border:1px solid #203A54;color:var(--t-text);}
.stat .stat-head svg{stroke:var(--t-text);}
.stat .plus{background:#294965;color:var(--t-text);}
.stat .stat-extra{color:var(--t-blue2);}
.spark{stroke:var(--t-blue);filter:drop-shadow(0 0 3px #359df366);}
.ruler{border-left-color:#2D5068;}
.ruler:before{background:repeating-linear-gradient(to bottom,#35576C 0px,#35576C 1px,transparent 1px,transparent 6px);}
.ruler:after{background:repeating-linear-gradient(to bottom,var(--t-blue) 0px,var(--t-blue) 1px,transparent 1px,transparent 5px);}
.ruler span,.ruler b{color:#8DA8BF;}
.toast{background:linear-gradient(130deg,#1D3852F0,#122A43F2);border-color:#50738D;box-shadow:0 2px 22px #0006;}
.toast .cart{color:var(--t-deep);background:var(--t-text);}
.toast button{border-color:var(--t-text);color:var(--t-text);}
.float-add{background:linear-gradient(#2D5977,#1A3E5D);border-color:#527F9F;color:#F5F9FF;}
.rail{top:315px;height:179px;background:linear-gradient(#17344D,#0A2036);border-color:#2B506D;}
.rail button{width:30px;height:39px;}
.rail svg,.rail button:nth-child(2) svg,.rail button:nth-child(3) svg,.rail button:nth-child(4) svg{width:20px;height:20px;fill:none;stroke:#B4CBDD;stroke-width:1.75;}
.rail button.active{background:#183D5B;border-radius:13px;}
.rail button.active svg{stroke:var(--t-blue2);}
.rail button .dot{width:5px;height:5px;background:var(--t-blue);top:3px;right:2px;}
.status{display:none;}
.preview-hint{position:absolute;inset:auto 130px 76px 130px;text-align:center;color:var(--t-text);font-size:11px;font-weight:750;border-radius:11px;padding:10px;background:#173C59;box-shadow:0 3px 15px #0008;display:none;z-index:15;pointer-events:none;}
.preview-hint.show{display:block;}
</style></head><body><main class="screen" id="screen">

    <section class="stat steps"><div class="stat-head"><svg viewBox="0 0 24 24"><ellipse cx="8" cy="7" rx="3" ry="5"/><ellipse cx="16" cy="16" rx="3" ry="5"/></svg>Steps</div><div class="stat-value">5,039</div><div class="stat-extra">↗ 2,138</div><div class="ruler"><span>10K</span><b>6K</b></div></section></div>

<div id="preview-hint" class="preview-hint" role="status" aria-live="polite"></div></main><script>
(()=>{
const stage=document.querySelector('#screen');
function fit(){
  const scale=Math.min(window.innerWidth/726,window.innerHeight/512);
  stage.style.transform=`translate(${Math.max(0,(window.innerWidth-726*scale)/2)}px,${Math.max(0,(window.innerHeight-512*scale)/2)}px) scale(${scale})`;
}
window.addEventListener('resize',fit);fit();
const hint=document.getElementById('preview-hint');let timer;
// Visual reference workflow: History opens the approved Food Journal translation.
document.getElementById('history')?.addEventListener('click',e=>{e.stopImmediatePropagation();location.href='./tempered-journal-study.html';},{capture:true});
function notify(msg){hint.textContent=msg;hint.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>hint.classList.remove('show'),1900);}
document.querySelectorAll('button').forEach(button=>{
 button.addEventListener('click',()=>{
   const message=button.getAttribute('aria-label')||button.textContent.trim().replace(/\\s+/g,' ');
   notify(message+' · visual prototype only');
 });
});
})();
</script></body></html>
