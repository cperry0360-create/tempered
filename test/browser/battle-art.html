<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tempered — battle art harness</title>
    <style>
      body { font: 14px system-ui; background: #0a0c10; color: #e6eaf2; padding: 20px; }
      .check[data-ok="true"]::before { content: "PASS  "; color: #4fc9a0; }
      .check[data-ok="false"]::before { content: "FAIL  "; color: #e05a6a; }
    </style>
  </head>
  <body>
    <h1>battle art</h1>
    <div id="results"></div>
    <script type="module">
      import { heroSpriteUrl, enemySpriteUrl, itemSpriteUrl } from '../../src/ui/battle-art.js'

      const results = document.getElementById('results')
      const checks = []
      function check(name, ok, detail = '') {
        const row = document.createElement('div')
        row.className = 'check'
        row.dataset.ok = String(Boolean(ok))
        row.textContent = `${name}${detail ? ` — ${detail}` : ''}`
        results.append(row)
        checks.push({ name, ok: Boolean(ok), detail })
      }

      check('hero uses canonical battle art slot', /\/art\/battle\/hero\.png$/.test(heroSpriteUrl()))
      check('enemy id maps to canonical sprite slot', /\/art\/battle\/enemies\/slime\.png$/.test(enemySpriteUrl('slime')))
      check('item id maps to canonical icon slot', /\/art\/battle\/items\/ember_token\.png$/.test(itemSpriteUrl('ember_token')))
      check('path-shaped enemy id is refused', enemySpriteUrl('../slime') === null)

      const fxFiles = [
        'sword-slash.png.b64',
        'impact-spark.png.b64',
        'guard-shield.png.b64',
        'magic-burst.png.b64',
        'critical-hit.png.b64',
        'dust-impact.png.b64',
      ]

      const [shellResponse, mainResponse, cssResponse, fxRuntimeResponse, ...fxResponses] = await Promise.all([
        fetch('../../index.html'),
        fetch('../../src/main.js'),
        fetch('../../src/battle.css'),
        fetch('../../src/ui/battle-fx-runtime.js'),
        ...fxFiles.map((file) => fetch(`../../art/battle/fx/${file}`)),
      ])
      const shell = await shellResponse.text()
      const main = await mainResponse.text()
      const fxRuntime = await fxRuntimeResponse.text()
      check('shell links battle-only stylesheet', shellResponse.ok && shell.includes('./src/battle.css'))
      check('battle-only stylesheet is served', cssResponse.ok)
      check('main imports combat FX runtime', mainResponse.ok && main.includes("from './ui/battle-fx-runtime.js'"))
      check('combat FX runtime is served', fxRuntimeResponse.ok && fxRuntime.includes('battle-fx__sprite'))

      for (let index = 0; index < fxFiles.length; index += 1) {
        const response = fxResponses[index]
        const payload = response.ok ? (await response.text()).trim() : ''
        check(`combat FX asset ${fxFiles[index]} is present`, response.ok && payload.startsWith('iVBORw0KGgo'))
      }

      const passed = checks.every((entry) => entry.ok)
      results.dataset.status = passed ? 'pass' : 'fail'
      await fetch('/__report', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'battle-art', passed, checks }),
      })
    </script>
  </body>
</html>
