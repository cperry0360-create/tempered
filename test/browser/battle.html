<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — daily expedition</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/battle.css" />
    <link rel="stylesheet" href="../../src/expedition.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }) }
      const q = (s) => document.querySelector(s)
      const qa = (s) => [...document.querySelectorAll(s)]
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await wait(10)
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      try {
        const tempered = await bootstrap({ storage: createMemoryStorage() })
        await tempered.storage.putAll('attributeState',
          ['might', 'wind', 'grit', 'vitality', 'mind'].map((attribute) =>
            ({ attribute, xp: 4000, level: 6, lifetimeSources: {} })))

        await tempered.app.show('character')
        const open = await waitFor('[data-open="battle"]')
        open.click()
        await waitFor('.screen--battle')

        const initial = await tempered.battle.stateForDate()
        check('daily play is now a three-encounter Expedition', initial.expedition?.encounterCount === 3, initial.expedition?.encounterCount)
        check('Expedition starts with no temporary upgrades', initial.expedition?.upgrades?.length === 0)
        check('screen identifies Daily Expedition', /Daily Expedition/i.test(q('.battle__daily-title')?.textContent ?? ''))
        check('first encounter is visible', /ENCOUNTER 1 \/ 3/.test(q('.fight__vs')?.textContent ?? ''))
        check('ATTACK is available', q('[data-action="attack"]') !== null)
        check('GUARD is available', q('[data-action="guard"]') !== null)
        check('SKILL is available', q('[data-action="skill"]') !== null)
        check('AUTO is available', q('[data-action="auto"]') !== null)
        check('SKIP is available immediately', q('[data-action="skip"]') !== null)
        check('Focus is visible', /FOCUS/.test(q('.battle__focus')?.textContent ?? ''))

        q('[data-action="attack"]').click()
        await wait(40)
        const afterAttack = await tempered.battle.stateForDate()
        check('ATTACK advances exactly one stored turn',
          afterAttack.turnState.turn === initial.turnState.turn + 1,
          `${initial.turnState.turn} -> ${afterAttack.turnState.turn}`)

        // Leaving and reopening must resume the same encounter and build.
        q('[data-battle="close"]').click()
        await waitFor('.screen--character, .screen--today, .screen--train')
        await tempered.app.show('character')
        ;(await waitFor('[data-open="battle"]')).click()
        await waitFor('.screen--battle')
        const resumed = await tempered.battle.stateForDate()
        check('Expedition resumes after leaving the screen', resumed.turnState.turn === afterAttack.turnState.turn)

        // Make the current foe one hit from defeat so the acceptance harness can
        // deterministically exercise the between-encounter choice UI.
        await tempered.storage.put('battles', {
          ...resumed,
          turnState: { ...resumed.turnState, enemyHp: 1 },
        })
        q('[data-action="attack"]').click()
        await waitFor('.upgrade-choice')
        const choiceState = await tempered.battle.stateForDate()
        check('winning encounter 1 pauses for a build choice', choiceState.expedition?.phase === 'choice')
        check('exactly three upgrades are offered', qa('.upgrade-card').length === 3, qa('.upgrade-card').length)
        check('upgrade copy says choices are run-only', /this expedition only/i.test(q('.upgrade-choice')?.textContent ?? ''))
        check('all upgrade cards are real thumb targets', qa('.upgrade-card').every((card) => card.getBoundingClientRect().height >= 44))

        const firstChoice = choiceState.expedition.choices[0]
        q(`[data-upgrade="${firstChoice.id}"]`).click()
        await waitFor('[data-action="attack"]')
        await wait(40)
        const second = await tempered.battle.stateForDate()
        check('choosing an upgrade advances to encounter 2',
          second.expedition?.encounterIndex === 1 && second.expedition?.phase === 'battle',
          `${second.expedition?.encounterIndex}/${second.expedition?.phase}`)
        check('chosen upgrade persists in the temporary run build', second.expedition?.upgrades?.includes(firstChoice.id))
        check('encounter 2 is visible after the choice', /ENCOUNTER 2 \/ 3/.test(q('.fight__vs')?.textContent ?? ''))
        check('chosen build is visible on screen', q(`[data-upgrade="${firstChoice.id}"]`) !== null)

        const purseBeforeSkip = JSON.stringify(await tempered.battle.purse())
        q('[data-action="skip"]').click()
        await waitFor('.outcome')
        const skipped = await tempered.battle.stateForDate()
        check('SKIP finishes the Expedition', skipped.expedition?.phase === 'complete')
        check('SKIP does not change rewards', JSON.stringify(await tempered.battle.purse()) === purseBeforeSkip)
        check('result explicitly says Expedition grants no character XP', /never grants character xp/i.test(q('.outcome')?.textContent ?? ''))

        q('[data-battle="restart"]').click()
        await waitFor('[data-action="attack"]')
        const replay = await tempered.battle.stateForDate()
        check('PLAY AGAIN resets encounter and temporary build',
          replay.turnState.turn === 0
            && replay.expedition?.encounterIndex === 0
            && replay.expedition?.upgrades?.length === 0)
        check('PLAY AGAIN does not pay again', JSON.stringify(await tempered.battle.purse()) === purseBeforeSkip)

        q('[data-action="auto"]').click()
        await waitFor('.outcome')
        const auto = await tempered.battle.stateForDate()
        check('AUTO resolves the whole Expedition', auto.expedition?.phase === 'complete')
        check('AUTO does not pay again', JSON.stringify(await tempered.battle.purse()) === purseBeforeSkip)

        const copy = q('.screen--battle').textContent
        const forbidden = /\b(failed|failure|lost your|penalt|missed|streak lost)\b/i
        check('Expedition copy contains no punishment language', !forbidden.test(copy), copy.match(forbidden)?.[0] ?? 'clean')
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 700))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'battle', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
