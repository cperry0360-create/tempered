<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — FTX cable machine</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { installMobileInteractions } from '../../src/ui/mobile-interactions.js'
    import { installCableMachineRuntime } from '../../src/ui/cable-machine-runtime.js'

    const checks = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s, root = document) => root?.querySelector?.(s) ?? null
    const qa = (s, root = document) => root?.querySelectorAll ? [...root.querySelectorAll(s)] : []
    const settle = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms))

    async function waitFor(selector, timeout = 4000) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      throw new Error(`timed out waiting for ${selector}`)
    }

    try {
      installMobileInteractions()
      const storage = createMemoryStorage()
      const clock = fixedClock(new Date(2026, 8, 7, 17, 45, 0))
      const tempered = await bootstrap({ storage, clock, mount: q('#app') })

      // Reproduce the user's pre-peg history exactly: the physical selector
      // number was written into weight and then promoted into the PR record.
      await storage.put('sessions', {
        id: 'legacy-cable-session', date: '2026-09-06', startedAt: '2026-09-06T10:00:00', endedAt: '2026-09-06T10:10:00',
      })
      await storage.put('setLogs', {
        id: 'legacy-cable-set', sessionId: 'legacy-cable-session', exerciseId: 'cable_fly',
        weight: 7, reps: 12, completedAt: '2026-09-06T10:05:00', setIndex: 0,
      })
      await storage.put('records', {
        exerciseId: 'cable_fly',
        bestWeight: { weight: 7, reps: 12, date: '2026-09-06' },
        bestVolume: { volume: 84, date: '2026-09-06' },
        bestE1RM: { value: 9.8, date: '2026-09-06' },
        lastPerformance: { weight: 7, reps: 12, date: '2026-09-06' },
      })

      await installCableMachineRuntime(tempered)
      const migratedLog = (await storage.getAll('setLogs')).find((row) => row.id === 'legacy-cable-set')
      const migratedRecord = await storage.get('records', 'cable_fly')
      check('legacy Cable Fly peg 7 migrates to 85 lb nominal total', migratedLog?.weight === 85, migratedLog?.weight)
      check('legacy Cable Fly keeps Peg 7 metadata', migratedLog?.cablePeg === 7, migratedLog?.cablePeg)
      check('legacy PR is rebuilt from migrated resistance', migratedRecord?.bestWeight?.weight === 85, migratedRecord?.bestWeight?.weight)
      check('legacy PR also remembers the physical peg', migratedRecord?.bestWeight?.cablePeg === 7, migratedRecord?.bestWeight?.cablePeg)

      await tempered.app.startSession({ exerciseId: 'cable_fly' })
      const card = await waitFor('.screen--session [data-exercise="cable_fly"]')
      await settle(160)

      check('Cable Fly weight column becomes PEG', q('.setrow--head [data-col="weight"]', card)?.textContent === 'PEG',
        q('.setrow--head [data-col="weight"]', card)?.textContent)
      check('session identifies Inspire FTX / Centr 2 peg mode', /FTX \/ CENTR 2 PEG MODE/.test(q('.cable-mode-note', card)?.textContent ?? ''))
      check('session labels the calculation nominal', /NOMINAL/.test(q('.cable-mode-note', card)?.textContent ?? ''))
      check('migrated LAST history shows peg rather than pretending it was pounds', /P7/.test(q('[data-kind="last"]')?.textContent ?? ''), q('[data-kind="last"]')?.textContent)
      check('migrated PR pill shows Peg 7 and 85 nominal pounds',
        /P7\s*·\s*85/.test(q('[data-kind="pr"]')?.textContent ?? '') && /nominal/i.test(q('[data-kind="pr"]')?.textContent ?? ''),
        q('[data-kind="pr"]')?.textContent)

      let weights = qa('.setrow__num[data-field="weight"]', card)
      let reps = qa('.setrow__num[data-field="reps"]', card)
      check('peg inputs use a numeric keyboard hint', weights[0]?.inputMode === 'numeric', weights[0]?.inputMode)

      weights[0].value = '6'
      weights[0].dispatchEvent(new Event('input', { bubbles: true }))
      reps[0].value = '16'
      reps[0].dispatchEvent(new Event('input', { bubbles: true }))
      weights[0].dispatchEvent(new Event('change', { bubbles: true }))
      await settle(160)

      const liveCard = q('.screen--session [data-exercise="cable_fly"]')
      weights = qa('.setrow__num[data-field="weight"]', liveCard)
      reps = qa('.setrow__num[data-field="reps"]', liveCard)
      const readout = q('.cable-readout', liveCard)?.textContent ?? ''

      check('Peg 6 calculates 37.5 lb nominal per handle', /Nominal 37\.5 lb \/ handle/.test(readout), readout)
      check('Cable Fly uses both stacks for 75 lb total', /75 lb total/.test(readout) && /2 stacks/.test(readout), readout)
      check('changing set 1 carries the peg through later sets', weights.slice(1).every((input) => input.value === '6'),
        weights.map((input) => input.value || '-').join(', '))
      check('changing set 1 carries reps through later sets', reps.slice(1).every((input) => input.value === '16'),
        reps.map((input) => input.value || '-').join(', '))

      q('.setrow__check', liveCard)?.click()
      await settle(180)
      const logs = await storage.getAll('setLogs')
      const log = logs.find((row) => row.exerciseId === 'cable_fly' && row.id !== 'legacy-cable-set')
      check('new Cable Fly stores calculated nominal resistance', log?.weight === 75, log?.weight)
      check('new Cable Fly preserves the physical selector peg', log?.cablePeg === 6, log?.cablePeg)
      check('new Cable Fly preserves per-handle resistance', log?.cablePerHandle === 37.5, log?.cablePerHandle)
      check('new Cable Fly records that both stacks were used', log?.cableStacks === 2, log?.cableStacks)

      await tempered.app.show('settings')
      const equipment = await waitFor('[data-section="cable-machine"]')
      await settle(100)
      check('Settings exposes the Inspire FTX / Centr 2 profile', /Inspire FTX \/ Centr 2 preset/.test(equipment.textContent ?? ''))
      check('Settings defaults to 15 selector positions',
        qa('.cable-settings__number', equipment).some((input) => input.getAttribute('aria-label') === 'Selector positions' && input.value === '15'))
      check('Settings describes the selector/head assembly instead of claiming a 15 lb top plate',
        qa('.cable-settings__number', equipment).some((input) => input.getAttribute('aria-label') === 'Selector/head assembly (lb)' && input.value === '15'))
      check('Settings preview explicitly calls the result nominal', /Nominal example/.test(q('.cable-settings__example', equipment)?.textContent ?? ''))

      const pushdown = q('[data-cable-exercise="tricep_push"]', equipment)
      check('other cable exercises are configurable from the same equipment profile', Boolean(pushdown))
      check('Tricep Pushdown starts as normal lb entry', /normal lb entry/.test(pushdown?.textContent ?? ''), pushdown?.textContent)
      q('button[aria-label="Tricep Pushdown (Cable) peg entry"]', pushdown)?.click()
      await settle(120)
      const profileAfterExercise = await storage.get('profile', 'profile')
      check('Tricep Pushdown can opt into peg mode independently',
        profileAfterExercise?.cableMachine?.exerciseSettings?.tricep_push?.enabled === true)

      const incline = q('[data-cable-exercise="incline_bench_db"]', equipment)
      check('a cable-capable press can opt into this machine profile', Boolean(incline))
      q('button[aria-label="Incline Dumbbell Bench Press peg entry"]', incline)?.click()
      await settle(120)

      await tempered.app.startSession({ exerciseId: 'incline_bench_db' })
      await settle(120)
      let inclineCard = q('.screen--session [data-exercise="incline_bench_db"]')
      q('button.actionpill[data-method]', inclineCard)?.click()
      await settle(80)
      q('[data-methodchoice="Cable"]', inclineCard)?.click()
      await settle(180)
      inclineCard = q('.screen--session [data-exercise="incline_bench_db"]')
      check('switching the press to Cable activates configured peg entry',
        inclineCard?.dataset.method === 'Cable' && q('.setrow--head [data-col="weight"]', inclineCard)?.textContent === 'PEG')

      const inclineWeight = q('.setrow__num[data-field="weight"]', inclineCard)
      const inclineReps = q('.setrow__num[data-field="reps"]', inclineCard)
      inclineWeight.value = '6'
      inclineWeight.dispatchEvent(new Event('input', { bubbles: true }))
      inclineReps.value = '12'
      inclineReps.dispatchEvent(new Event('input', { bubbles: true }))
      q('.setrow__check', inclineCard)?.click()
      await settle(180)
      const inclineLog = (await storage.getAll('setLogs')).find((row) => row.exerciseId === 'incline_bench_db')
      check('cable press keeps its movement id and method',
        inclineLog?.exerciseId === 'incline_bench_db' && inclineLog?.method === 'Cable',
        `${inclineLog?.exerciseId} / ${inclineLog?.method}`)
      check('cable press peg is converted through the same machine profile',
        inclineLog?.cablePeg === 6 && inclineLog?.weight === 37.5,
        `${inclineLog?.cablePeg} / ${inclineLog?.weight}`)

      await tempered.app.show('settings')
      const refreshedEquipment = await waitFor('[data-section="cable-machine"]')

      const addon = [...refreshedEquipment.querySelectorAll('button')].find((button) => button.textContent === 'NO')
      addon?.click()
      await settle(120)
      check('5 lb add-on toggle updates the Peg 6 preview to 80 lb total',
        /80 lb Cable Fly total/.test(q('.cable-settings__example', refreshedEquipment)?.textContent ?? ''),
        q('.cable-settings__example', refreshedEquipment)?.textContent)
      const profile = await storage.get('profile', 'profile')
      check('correct FTX identity is persisted through the storage adapter', profile?.cableMachine?.id === 'inspire_ftx_centr2')
    } catch (error) {
      check('cable machine harness threw', false, String(error?.stack ?? error).slice(0, 1100))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'cable-machine', passed: checks.every((c) => c.ok), checks }),
    })
  </script>
</body>
</html>
