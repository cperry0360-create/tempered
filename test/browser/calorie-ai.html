<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — itemized Nutrition</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/nutrition-today.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
  <link rel="stylesheet" href="../../src/ux-fixes.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import {
      NUTRITION_PHOTO_PROMPT,
      installCalorieAiRuntime,
    } from '../../src/ui/calorie-ai-runtime.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (selector) => document.querySelector(selector)
    const qa = (selector) => [...document.querySelectorAll(selector)]
    const settle = (ms = 40) => new Promise((resolve) => setTimeout(resolve, ms))

    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'unhandled rejection')))

    async function waitFor(selector, timeout = 3000) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    try {
      const clipboard = {
        copied: '',
        async writeText(text) { this.copied = text },
        async readText() {
          return '```text\nTEMPERED_DESCRIPTION=Chicken rice bowl with avocado\nTEMPERED_CALORIES=642\nTEMPERED_PROTEIN=42\nTEMPERED_CARBS=61\nTEMPERED_FAT=24\nTEMPERED_FIBER=9\n```'
        },
      }
      Object.defineProperty(navigator, 'clipboard', { configurable: true, value: clipboard })

      const clock = fixedClock(new Date(2026, 8, 9, 9, 15, 0))
      const tempered = await bootstrap({ storage: createMemoryStorage(), clock, mount: q('#app') })
      await tempered.daily.setCalorieTarget(2100)
      await tempered.daily.setCadence('calories_logged', 'daily', 1)
      await tempered.daily.setCadence('protein_target', 'daily', 1)
      await tempered.daily.setCadence('nutrition_logged', 'daily', 1)
      await tempered.daily.logAt(clock.today(), 'body_metrics', 200)
      // Simulate nutrition saved by 0.14.4 before itemized meal history existed.
      await tempered.daily.logAt(clock.today(), 'calories_logged', 100, { mode: 'add' })
      await tempered.daily.logAt(clock.today(), 'protein_target', 10, { mode: 'add' })
      await tempered.daily.logAt(clock.today(), 'nutrition_logged')
      await tempered.app.show('today')
      installCalorieAiRuntime()

      const fuelCard = await waitFor('[data-section="fuel"]')
      check('R2 Today uses the dedicated Fuel card instead of a Lifestyle/Nutrition habit row',
        Boolean(fuelCard) && !q('[data-activity="nutrition_combined"]') && !q('[data-lifestyle="snapshot"]'))
      check('separate Calories, Protein and Logged food habit rows are absent',
        !q('[data-activity="calories_logged"]') && !q('[data-activity="protein_target"]') && !q('[data-activity="nutrition_logged"]'))
      const before = fuelCard?.textContent ?? ''
      check('Fuel card shows both daily goals',
        /100\s*\/\s*2,?100\s*kcal/i.test(before) && /10\s*\/\s*160\s*g protein/i.test(before), before)

      await navigator.clipboard.writeText(NUTRITION_PHOTO_PROMPT)
      check('AI meal prompt remains copyable', clipboard.copied === NUTRITION_PHOTO_PROMPT)
      check('Prompt requests calories and all four macro values',
        ['CALORIES', 'PROTEIN', 'CARBS', 'FAT', 'FIBER'].every((tag) => clipboard.copied.includes(`TEMPERED_${tag}=`)))
      check('Prompt requests the meal description used by history and quick log', clipboard.copied.includes('TEMPERED_DESCRIPTION='))

      q('.today-fuel-card__add')?.click()
      const screen = await waitFor('[data-nutrition-screen]')
      check('Nutrition opens a dedicated persistent sub-screen', Boolean(screen))
      check('Nutrition screen has description, time, and five nutrient fields', qa('[data-nutrition-form] input').length === 7, qa('[data-nutrition-form] input').length)
      const carryover = await waitFor('[data-nutrition-carryover]')
      check('Legacy totals remain visible as an earlier total', /100 kcal/i.test(carryover?.textContent ?? '') && /10g protein/i.test(carryover?.textContent ?? ''))

      q('[data-calorie-ai="paste"]')?.click()
      await settle(120)
      const dayBeforeConfirm = await tempered.daily.dayLog(clock.today())
      check('Paste fills all nutrition fields',
        q('[data-entry="nutrition_description"]')?.value === 'Chicken rice bowl with avocado'
        && q('[data-entry="nutrition_calories"]')?.value === '642'
        && q('[data-entry="nutrition_protein"]')?.value === '42'
        && q('[data-entry="nutrition_carbs"]')?.value === '61'
        && q('[data-entry="nutrition_fat"]')?.value === '24'
        && q('[data-entry="nutrition_fiber"]')?.value === '9')
      check('Paste waits for review instead of instantly logging', dayBeforeConfirm.calories === 100 && qa('[data-nutrition-entry]').length === 0, dayBeforeConfirm.calories)
      check('Paste explicitly asks for review before Add Meal', /review.*add(?:ing)? the meal/i.test(q('[data-nutrition-status]')?.textContent ?? ''))

      q('[data-action="nutrition-log"]')?.click()
      await settle(260)
      check('Nutrition screen stays open after adding a meal', Boolean(q('[data-nutrition-screen]')))
      check('Meal history shows its time and calorie amount', /9:15/i.test(q('[data-nutrition-entry]')?.textContent ?? '') && /642 kcal/i.test(q('[data-nutrition-entry]')?.textContent ?? ''))
      check('Meal history keeps the useful AI description', /Chicken rice bowl with avocado/i.test(q('[data-nutrition-entry]')?.textContent ?? ''))
      check('Meal history shows protein, carbs, fat and fiber',
        /42g protein/i.test(q('[data-nutrition-entry]')?.textContent ?? '')
        && /61g carbs/i.test(q('[data-nutrition-entry]')?.textContent ?? '')
        && /24g fat/i.test(q('[data-nutrition-entry]')?.textContent ?? '')
        && /9g fiber/i.test(q('[data-nutrition-entry]')?.textContent ?? ''))

      const day = await tempered.daily.dayLog(clock.today())
      check('Itemized logger preserves old calories and adds the meal', day.calories === 742, day.calories)
      check('Itemized logger preserves old protein and adds the meal', day.proteinGrams === 52, day.proteinGrams)
      check('Itemized logger stores carb, fat and fiber totals', day.carbsGrams === 61 && day.fatGrams === 24 && day.fiberGrams === 9,
        `${day.carbsGrams}/${day.fatGrams}/${day.fiberGrams}`)
      check('Meal keeps its timestamp and AI source', day.nutritionEntries?.[0]?.loggedAt.includes('T09:15:') && day.nutritionEntries?.[0]?.source === 'ai', JSON.stringify(day.nutritionEntries?.[0]))
      check('Recent meals immediately become a one-tap quick log', Boolean(q('[data-nutrition-suggestion="Chicken rice bowl with avocado"]')))
      check('Logging Nutrition still satisfies Logged your food', day.nutritionLogged === true, day.nutritionLogged)

      q('[data-nutrition-entry] .nutrition-entry__delete')?.click()
      await settle(180)
      const deleted = await tempered.daily.dayLog(clock.today())
      check('Deleting a meal recalculates back to the earlier total', deleted.calories === 100 && deleted.proteinGrams === 10, `${deleted.calories}/${deleted.proteinGrams}`)
      check('Deleting offers an Undo action', Boolean(q('[data-nutrition-undo]:not([hidden]) .nutrition-undo__button')))
      q('.nutrition-undo__button')?.click()
      await settle(180)
      const restored = await tempered.daily.dayLog(clock.today())
      check('Undo restores the itemized meal and totals', restored.calories === 742 && restored.nutritionEntries?.length === 1, `${restored.calories}/${restored.nutritionEntries?.length}`)

      const underneath = q('[data-section="fuel"]')?.textContent ?? ''
      check('Today Fuel totals update behind the sub-screen',
        /742\s*\/\s*2,?100\s*kcal/i.test(underneath) && /52\s*\/\s*160\s*g protein/i.test(underneath), underneath)
      q('.nutrition-log-header__back')?.click()
      check('Back closes Nutrition and returns to the same Today dashboard', !q('[data-nutrition-screen]') && Boolean(q('[data-section="fuel"]')))

      const img = document.createElement('img')
      img.className = 'exercise__thumb'
      img.style.width = '72px'
      img.style.height = '72px'
      document.body.append(img)
      const position = getComputedStyle(img).objectPosition
      check('Exercise thumbnail crop remains anchored to the first frame', position !== '50% 50%', position)
      img.remove()

      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Nutrition AI harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'calorie-ai', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
