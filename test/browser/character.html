<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — character surface acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * The two Phase 5 acceptance criteria from docs/07-build-plan.md, driven
       * against the real app:
       *
       *   - tapping any attribute reveals exactly which activities feed it and
       *     what each is worth
       *   - after a session, the causal chain from performance to progression is
       *     visible without dismissing more than one screen
       *
       * The source guard derives its day from ACTIVITY_FIELDS so a newly
       * registered daily activity cannot silently award XP that Character is
       * unable to explain.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
      import { awardsForDay, awardsForSession } from '../../src/domain/xp-engine.js'
      import { ACTIVITY_FIELDS, applyActivity } from '../../src/domain/activities.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s, root = document) => root.querySelector(s)
      const qa = (s, root = document) => [...root.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 30))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      const probeValues = {
        sleep: 8, water: 64, steps: 9000, body_metrics: 184, mobility: 20,
        read: 20, study: 20, meditate: 10, instrument: 15,
      }
      function activityProbeDay() {
        let day = { date: '2026-09-04' }
        for (const [activityId, spec] of Object.entries(ACTIVITY_FIELDS)) {
          const value = spec.entry === 'number' ? (probeValues[activityId] ?? 1) : null
          day = applyActivity(day, activityId, value)
        }
        return { ...day, cardio: [{ activityId: 'run', distanceMiles: 3, minutes: 27 }] }
      }

      let taps = 0
      function tap(node, label) {
        if (!node) throw new Error(`nothing to tap for: ${label}`)
        taps += 1
        node.click()
        return node
      }

      try {
        const storage = createMemoryStorage()
        const tempered = await bootstrap({ storage, mount: document.getElementById('app') })
        const balance = tempered.balance

        await waitFor('[data-programday="monday"]')
        q('[data-programday="monday"]').click()
        await waitFor('.setrow__check')
        for (const button of qa('.setrow__check').slice(0, 6)) {
          const row = button.closest('.setrow')
          for (const field of qa('input.setrow__num', row)) {
            if (field.value === '') {
              field.value = field.dataset.field === 'weight' ? '135' : '8'
              field.dispatchEvent(new Event('change'))
            }
          }
          button.click()
          await settle()
        }
        q('[data-action="finish"]').click(); await settle()
        q('[data-action="confirm-finish"]').click()
        await waitFor('[data-action="done"]')

        const summary = q('.screen--summary')
        const chain = {
          did: q('.stats', summary) !== null,
          earned: q('[data-section="xp"]', summary) !== null,
          why: qa('.grew__why', summary).some((node) => node.textContent.trim().length > 0),
          next: q('[data-section="directive"]', summary) !== null,
        }
        check('2 ACCEPTANCE: what you did, what it earned, why, and what is next — one screen',
          Object.values(chain).every(Boolean), JSON.stringify(chain))
        check('2 ACCEPTANCE: and one dismiss, not four',
          qa('[data-action="done"]').length === 1 && qa('.screen--summary').length === 1)

        taps = 0
        tap(q('[data-action="done"]'), 'DONE')
        await settle()
        check('2 one tap leaves the chain, and nothing else is stacked behind it',
          taps === 1 && q('.screen--summary') === null, `${taps} tap`)

        await tempered.app.show('character')
        await waitFor('[data-attr]')

        const rows = qa('[data-attr]')
        check('1 all five attributes are on the screen', rows.length === 5,
          rows.map((node) => node.dataset.attr).join(', '))
        check('1 each shows its level, tier and where it is in that level',
          qa('.attr__level').length === 5 && qa('.attr__tier').length === 5
          && qa('.attr__bar').length === 5 && qa('.attr__xp').length === 5)
        check('1 nothing is expanded until it is asked for', q('[data-detail]') === null)

        taps = 0
        tap(q('[data-attr="might"]'), 'Might')
        await settle()
        check('1 ACCEPTANCE: one tap reveals what feeds it', taps === 1 && q('[data-detail="might"]') !== null,
          `${taps} tap`)

        const feeds = qa('[data-detail="might"] [data-feed]')
        check('1 ACCEPTANCE: and what each one is worth',
          feeds.length > 0 && feeds.every((node) => /\d/.test(q('.feed__worth', node)?.textContent ?? '')),
          feeds.map((node) => q('.feed__label', node).textContent).join(', '))

        const emitted = new Set([
          ...awardsForDay(activityProbeDay(), { paceBaselineMinPerMile: 12 }, balance).map((a) => a.source),
          ...awardsForSession(
            { id: 'p', routineId: null, durationMinutes: 75, sets: [
              { exerciseId: 'deadlift_bb', weight: 315, reps: 5 },
              { exerciseId: 'farmers_carry', weight: 200, reps: null, distance: 100 },
            ] },
            {
              date: '2026-09-04',
              exercises: await tempered.workout.exerciseMap(),
              records: new Map([['deadlift_bb', {
                exerciseId: 'deadlift_bb',
                bestWeight: { weight: 275, reps: 5, date: '2026-08-01' },
                bestVolume: { volume: 1000, date: '2026-08-01' },
                bestE1RM: { value: 300, date: '2026-08-01' },
                lastPerformance: { weight: 275, reps: 5, date: '2026-08-01' },
              }]]),
              daysSinceLastSession: 9,
              sessionsThisWeekBefore: 3,
              planTargetSessionsPerWeek: 4,
              isFirstOfDay: true,
            }, balance).map((a) => a.source),
        ])

        const shown = new Set()
        for (const row of qa('[data-attr]')) {
          if (q(`[data-detail="${row.dataset.attr}"]`) === null) { row.click(); await settle() }
          for (const feed of qa(`[data-detail="${row.dataset.attr}"] [data-feed]`)) shown.add(feed.dataset.feed)
        }
        const unexplained = [...emitted].filter((source) => !shown.has(source))
        check('1 ACCEPTANCE: every source the engine can award is explained on screen',
          unexplained.length === 0,
          unexplained.join(', ') || `all ${emitted.size} sources appear across the five attributes`)
        for (const source of ['vitality.calories', 'vitality.alcoholFree', 'vitality.sauna']) {
          check(`1 Phase 5: Character explains ${source}`,
            shown.has(source), shown.has(source) ? 'shown' : 'missing')
        }

        tap(q('[data-attr="might"]'), 'Might again')
        await settle()
        if (q('[data-detail="might"]') === null) { tap(q('[data-attr="might"]'), 'Might'); await settle() }
        const fed = qa('[data-detail="might"] [data-fed]')
        check('1 and what has actually fed it, from the session just logged',
          fed.length > 0 && fed.some((node) => node.dataset.fed === 'might.volume'),
          fed.map((node) => node.dataset.fed).join(', ') || 'nothing')

        const rank = q('[data-rank]')
        check('rank is shown and derived from the levels, never tracked separately',
          rank !== null && /^[FEDCBAS]$/.test(rank.textContent.trim()), rank?.textContent)
        check('the active directive is on the screen',
          q('[data-section="directive"] .directive__headline') !== null,
          q('[data-section="directive"] .directive__headline')?.textContent)

        await waitFor('[data-title="first_load"]')
        const firstLoad = q('[data-title="first_load"]')
        check('a title earned by the session is shown, with what earned it and when',
          firstLoad !== null && /session/i.test(firstLoad.textContent)
          && /\d{4}/.test(q('.title__date', firstLoad)?.textContent ?? ''),
          firstLoad?.textContent.replace(/\s+/g, ' ').trim())

        tap(q('[data-titles="toggle"]'), 'still to earn')
        await settle()
        check('and what there is still to earn, with the condition for each',
          qa('[data-available]').length > 0
          && qa('[data-available] .title__why').every((node) => node.textContent.trim().length > 5),
          `${qa('[data-available]').length} still to earn`)
        check('NO PUNISHMENT: nothing on this screen counts down or shames',
          !/\b(overdue|late|missed|failed|behind|streak lost|no excuses)\b/i.test(document.body.innerText),
          'checked the whole rendered screen')

        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'character', passed: checks.every((c) => c.ok), checks }),
        })
      } catch (error) {
        checks.push({ name: 'harness threw', ok: false, detail: String(error?.stack ?? error).slice(0, 400) })
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'character', passed: false, checks }),
        })
      }
    </script>
  </body>
</html>
