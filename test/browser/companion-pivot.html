<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — companion pivot</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/companion.css" />
  <link rel="stylesheet" href="../../src/pivot.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s) => document.querySelector(s)
    const qa = (s) => [...document.querySelectorAll(s)]
    const settle = (ms = 50) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    try {
      const storage = createMemoryStorage()
      const clock = fixedClock(new Date(2026, 8, 8, 10, 0, 0))
      const context = await bootstrap({ storage, clock, mount: q('#app') })
      await context.app.show('today')

      const visibleTabs = qa('.tabbar__tab').map((node) => node.textContent.trim())
      check('Normal navigation is Today, Train, Companion, Progress', visibleTabs.join('|') === 'TODAY|TRAIN|COMPANION|PROGRESS', visibleTabs.join(' | '))
      check('Character is no longer a visible navigation destination', !q('[data-tab="character"]'))
      check('Battle is not exposed from normal navigation', !/battle/i.test(visibleTabs.join(' ')))

      await context.app.show('companion')
      check('Companion screen renders', Boolean(q('.screen--companion')))
      check('Fresh companion starts as Seed', q('.companion-growth__stage')?.textContent === 'Seed', q('.companion-growth__stage')?.textContent)
      check('Companion explicitly never decays', /nothing ever decays/i.test(q('.companion-header__copy')?.textContent ?? ''))
      check('Starter room has at least one unlocked object', qa('.companion-room__item[data-unlocked="true"]').length >= 1)

      const img = q('.companion-habitat__pet')
      if (img && !img.complete) await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve })
      check('Companion art resolves to a real first-party asset', Boolean(img?.complete && img?.naturalWidth > 0), `${img?.naturalWidth ?? 0}px`)

      // Add enough real-world evidence to cross the first growth threshold.
      for (let i = 0; i < 3; i += 1) {
        await storage.put('sessions', {
          id: `session-${i}`, date: `2026-09-0${6 + i}`, startedAt: `2026-09-0${6 + i}T10:00:00`, endedAt: `2026-09-0${6 + i}T11:00:00`,
        })
        for (let set = 0; set < 4; set += 1) {
          await storage.put('setLogs', {
            id: `set-${i}-${set}`, sessionId: `session-${i}`, exerciseId: 'flat_bench_db', reps: 10, weight: 50, isWarmup: false,
          })
        }
      }
      await storage.put('dayLogs', {
        date: '2026-09-08', sleepHours: 7.75, steps: 10527, waterOz: 100, proteinGrams: 140, calories: 1900, nutritionLogged: true, readingMinutes: 20,
      })
      await context.app.show('companion')
      const stage = q('.companion-growth__stage')?.textContent ?? ''
      check('Accumulated real activity grows the companion forward', stage !== 'Seed', stage)
      check('Growth unlocks more room objects', qa('.companion-room__item[data-unlocked="true"]').length > 1, qa('.companion-room__item[data-unlocked="true"]').length)
      check('Today activity creates a small companion moment', /Post-workout stretch|Hydration break|Quiet reading|Snack time|Well rested/.test(q('.companion-moment')?.textContent ?? ''), q('.companion-moment')?.textContent)

      const input = q('.companion-name__input')
      input.value = 'Moss'
      q('.companion-name__save')?.click()
      await settle(120)
      check('Companion can be renamed', q('.screen--companion .screen__title')?.textContent === 'Moss', q('.screen--companion .screen__title')?.textContent)
      check('Companion name persists in profile', (await storage.get('profile', 'profile'))?.companionName === 'Moss')

      const normalText = q('.screen--companion')?.textContent ?? ''
      check('Companion surface contains no combat or RPG management language', !/attack|battle|rank|skill point|xp|level up/i.test(normalText), normalText.slice(0, 220))
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Companion harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'companion-pivot', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
