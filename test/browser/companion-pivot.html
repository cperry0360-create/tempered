<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — companion pivot</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/companion.css" />
  <link rel="stylesheet" href="../../src/pivot.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s) => document.querySelector(s)
    const qa = (s) => [...document.querySelectorAll(s)]
    const settle = (ms = 50) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    try {
      const storage = createMemoryStorage()
      const clock = fixedClock(new Date(2026, 8, 8, 10, 0, 0))
      const context = await bootstrap({ storage, clock, mount: q('#app') })
      await context.app.show('today')

      const visibleTabs = qa('.tabbar__tab').map((node) => node.textContent.trim())
      check('Normal navigation is Today, Train, Companion, Progress', visibleTabs.join('|') === 'TODAY|TRAIN|COMPANION|PROGRESS', visibleTabs.join(' | '))
      check('Character is no longer a visible navigation destination', !q('[data-tab="character"]'))
      check('Battle is not exposed from normal navigation', !/battle/i.test(visibleTabs.join(' ')))

      await context.app.show('companion')
      check('Companion screen renders', Boolean(q('.screen--companion')))
      check('Fresh companion starts as a Level 1 Egg', q('.companion-growth__stage')?.textContent === 'Level 1 · Egg', q('.companion-growth__stage')?.textContent)
      check('Trailback Turtle is the default visual style', q('.companion-habitat')?.dataset.style === 'turtle', q('.companion-habitat')?.dataset.style)
      check('Companion explicitly never decays', /nothing ever decays/i.test(q('.companion-header__copy')?.textContent ?? ''))
      check('Starter room has at least one unlocked object', qa('.companion-room__item[data-unlocked="true"]').length >= 1)
      check('Turtle habitat begins in its starter state', q('.companion-habitat')?.dataset.roomState === 'starter', q('.companion-habitat')?.dataset.roomState)
      check('Fresh visible form is checkpointed separately from earned care', (await storage.get('profile', 'profile'))?.companionRevealedLevel === 1)
      check('Current growth stage remains available for backup compatibility', (await storage.get('profile', 'profile'))?.companionStageSeen === 'Egg')
      check('Current art style is checkpointed with the growth stage', (await storage.get('profile', 'profile'))?.companionStageSeenStyle === 'turtle')
      check('Default visual style is saved for existing profiles', (await storage.get('profile', 'profile'))?.companionStyle === 'turtle')

      const pet = q('.companion-habitat__pet--turtle')
      const spriteStyle = pet ? getComputedStyle(pet).backgroundImage : 'none'
      const spriteUrl = spriteStyle.match(/url\(["']?(.*?)["']?\)/)?.[1]
      const sprite = new Image()
      if (spriteUrl) {
        sprite.src = spriteUrl
        if (!sprite.complete) await new Promise((resolve) => { sprite.onload = resolve; sprite.onerror = resolve })
      }
      check('Turtle art resolves to a real first-party sprite sheet', Boolean(spriteUrl && sprite.complete && sprite.naturalWidth > 0), `${sprite.naturalWidth}px`)

      // Add enough real-world evidence to cross the first growth threshold.
      for (let i = 0; i < 3; i += 1) {
        await storage.put('sessions', {
          id: `session-${i}`, date: `2026-09-0${6 + i}`, startedAt: `2026-09-0${6 + i}T10:00:00`, endedAt: `2026-09-0${6 + i}T11:00:00`,
        })
        for (let set = 0; set < 4; set += 1) {
          await storage.put('setLogs', {
            id: `set-${i}-${set}`, sessionId: `session-${i}`, exerciseId: 'flat_bench_db', reps: 10, weight: 50, isWarmup: false,
          })
        }
      }
      await storage.put('dayLogs', {
        date: '2026-09-08', sleepHours: 7.75, steps: 10527, waterOz: 100, proteinGrams: 140, calories: 1900, nutritionLogged: true, readingMinutes: 20,
      })
      await context.app.show('companion')
      check('Accumulated activity does not transform the turtle behind the scenes', q('.companion-growth__stage')?.textContent === 'Level 1 · Egg', q('.companion-growth__stage')?.textContent)
      check('Unrevealed habitat remains at the last visible level', qa('.companion-room__item[data-unlocked="true"]').length === 1, qa('.companion-room__item[data-unlocked="true"]').length)
      check('Unrevealed turtle remains on its prior sprite cell', q('.companion-habitat__pet--turtle')?.dataset.visual === '1', q('.companion-habitat__pet--turtle')?.dataset.visual)
      check('Opening Companion presents an unmistakable evolution-ready takeover', q('.companion-reveal')?.dataset.phase === 'ready' && /Level 3 · Hatchling is ready/.test(q('.companion-reveal')?.textContent ?? ''), q('.companion-reveal')?.textContent)
      check('Ready state does not advance the persisted visible form', (await storage.get('profile', 'profile'))?.companionRevealedLevel === 1)

      q('.companion-reveal__action')?.click()
      await settle(120)
      const stage = q('.companion-growth__stage')?.textContent ?? ''
      check('Reveal action performs the transformation on the Companion screen', stage === 'Level 3 · Hatchling', stage)
      check('Revealed growth unlocks the matching habitat objects', qa('.companion-room__item[data-unlocked="true"]').length > 1, qa('.companion-room__item[data-unlocked="true"]').length)
      check('Revealed growth selects the matching turtle sprite cell', q('.companion-habitat__pet--turtle')?.dataset.visual === '3', q('.companion-habitat__pet--turtle')?.dataset.visual)
      check('Transformation receives a completion splash', q('.companion-reveal')?.dataset.phase === 'complete' && /evolved/i.test(q('.companion-reveal')?.textContent ?? ''), q('.companion-reveal')?.textContent)
      check('Today workout selects the active companion reaction', q('.companion-habitat')?.dataset.moment === 'trained', q('.companion-habitat')?.dataset.moment)
      check('Visible-form checkpoint advances only after Reveal', (await storage.get('profile', 'profile'))?.companionRevealedLevel === 3, (await storage.get('profile', 'profile'))?.companionRevealedLevel)
      check('Today activity creates a companion moment', /Training registered|Recovery supplied|Focus sharpened|Fuel logged|Recovery logged/.test(q('.companion-moment')?.textContent ?? ''), q('.companion-moment')?.textContent)

      // Re-opening the same stage should not replay evolution endlessly.
      q('.companion-reveal__action')?.click()
      await settle(60)
      await context.app.show('today')
      await context.app.show('companion')
      check('Evolution takeover does not replay after the form was revealed', !q('.companion-reveal') && q('.companion-habitat')?.dataset.evolved === 'false')

      // A later unlock begins and completes on-screen without making the user
      // hunt for or claim a background reward.
      await storage.put('sessions', {
        id: 'session-auto', date: '2026-09-08', startedAt: '2026-09-08T12:00:00', endedAt: '2026-09-08T13:00:00',
      })
      for (let set = 0; set < 8; set += 1) {
        await storage.put('setLogs', {
          id: `set-auto-${set}`, sessionId: 'session-auto', exerciseId: 'flat_bench_db', reps: 10, weight: 55, isWarmup: false,
        })
      }
      await context.app.show('today')
      await context.app.show('companion')
      check('New earned form waits visibly before its automatic reveal', q('.companion-reveal')?.dataset.phase === 'ready' && q('.companion-habitat__pet--turtle')?.dataset.visual === '3')
      await settle(1250)
      check('Evolution advances automatically while Companion is on screen', q('.companion-growth__stage')?.textContent === 'Level 4 · Young Shell' && q('.companion-reveal')?.dataset.phase === 'complete', q('.companion-growth__stage')?.textContent)
      check('Automatic on-screen reveal persists the new visible form', (await storage.get('profile', 'profile'))?.companionRevealedLevel === 4)
      q('.companion-reveal__action')?.click()
      await settle(60)

      const input = q('.companion-name__input')
      input.value = 'Moss'
      q('.companion-name__save')?.click()
      await settle(120)
      check('Companion can be renamed', q('.screen--companion .screen__title')?.textContent === 'Moss', q('.screen--companion .screen__title')?.textContent)
      check('Companion name persists in profile', (await storage.get('profile', 'profile'))?.companionName === 'Moss')

      q('.companion-style__option[data-style="sprout"]')?.click()
      await settle(120)
      check('Existing Ember Sprout art remains selectable', q('.companion-habitat')?.dataset.style === 'sprout' && Boolean(q('img.companion-habitat__pet')), q('.companion-habitat')?.dataset.style)
      check('Style preference persists without resetting care', (await storage.get('profile', 'profile'))?.companionStyle === 'sprout' && /Level 4/.test(q('.companion-growth__stage')?.textContent ?? ''), q('.companion-growth__stage')?.textContent)
      check('Renamed companion survives a visual-style change', q('.screen--companion .screen__title')?.textContent === 'Moss')
      check('Forge Guardian remains available as an optional style', Boolean(q('.companion-style__option[data-style="forge"]')))

      const normalText = q('.screen--companion')?.textContent ?? ''
      check('Companion surface contains no combat or RPG management language', !/\b(?:attack|battle|rank|xp)\b|skill point|level up/i.test(normalText), normalText.slice(0, 220))
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Companion harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'companion-pivot', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
