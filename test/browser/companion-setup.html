<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — companion setup preference</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/setup.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { createSetupScreen } from '../../src/ui/screens/setup.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (selector) => document.querySelector(selector)
    const settle = (ms = 50) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    try {
      const storage = createMemoryStorage()
      await storage.open()
      await storage.put('profile', { id: 'profile', setupComplete: false })
      let finished = false
      const setup = createSetupScreen({
        mount: q('#app'),
        storage,
        clock: fixedClock(new Date(2026, 8, 9, 9, 0, 0)),
        activities: [],
        onDone: async () => { finished = true },
      })
      await setup.start()

      check('Welcome teaches effort and recovery', /training, nutrition, sleep, and recovery/i.test(q('.setup')?.textContent ?? '')
        && /no downside/i.test(q('.setup')?.textContent ?? ''))
      q('.setup__next')?.click()
      await settle()
      check('Goal and session choices are available', Boolean(q('.setup__choice') && q('.setup__number')))
      q('[data-selected="false"].setup__choice')?.click()
      q('.setup__next')?.click()
      await settle()
      check('Equipment choices are available', /Available equipment/i.test(q('.setup')?.textContent ?? ''))
      q('.setup__next')?.click()
      await settle()
      check('Starting path is explicit', /Choose how to begin/i.test(q('.setup')?.textContent ?? '') && /Use a template/i.test(q('.setup')?.textContent ?? '') && /Start blank/i.test(q('.setup')?.textContent ?? ''))
      check('Template chooser offers Mercy Mode', /Mercy Mode/i.test(q('.setup')?.textContent ?? ''))
      q('.setup__next')?.click()
      await settle()
      q('.setup__next')?.click()
      await settle()

      check('Setup does not require a companion choice', !q('[data-style="turtle"]') && !q('[data-style="sprout"]') && !q('[data-style="forge"]'))

      while (q('.setup__next')) {
        q('.setup__next')?.click()
        await settle()
        if (finished) break
      }
      const profile = await storage.get('profile', 'profile')
      check('Setup still completes and persists the profile', finished && profile?.setupComplete === true)
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Companion setup harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'companion-setup', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
