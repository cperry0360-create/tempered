<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — R2 Today habits</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (selector, root = document) => root?.querySelector(selector) ?? null
    const settle = (ms = 50) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    async function waitFor(selector, timeout = 3500) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    async function xpOf(attribute) {
      return (await globalThis.tempered.storage.get('attributeState', attribute))?.xp ?? 0
    }

    async function rowFor(id) {
      let row = q(`[data-activity="${id}"]`)
      if (row) return row
      const more = q('[data-other="toggle"]')
      if (more?.dataset.open !== 'true') { more?.click(); await settle() }
      return q(`[data-activity="${id}"]`)
    }

    async function openEditor(id) {
      const row = await rowFor(id)
      const body = q('.today-item__body', row)
      body?.click()
      await settle()
      return q(`[data-editor="${id}"]`)
    }

    try {
      const clock = fixedClock(new Date(2026, 8, 9, 9, 0, 0))
      const tempered = await bootstrap({ storage: createMemoryStorage(), clock, mount: q('#app') })
      await tempered.daily.setCadence('sleep', 'daily', 1)
      await tempered.daily.setCadence('water', 'daily', 1)
      await tempered.daily.setCadence('micro_cardio', 'daily', 1)
      await tempered.daily.setCadence('mobility', 'daily', 1)
      await tempered.daily.setCadence('rest_day', 'weekly', 1)
      await tempered.app.show('today')
      await waitFor('[data-section="daily"]')

      const ordered = [...document.querySelectorAll('.screen--today > [data-section], .screen--today > .today-heading')]
        .map((node) => node.dataset.section || 'heading')
      check('R2 Today uses the approved top-to-bottom dashboard order',
        ordered.join('|') === 'heading|next-session|readiness|week|fuel|daily', ordered.join(' | '))
      check('removed Today surfaces are absent',
        !q('.today-calendar') && !q('[data-summary="daily"]') && !q('[data-section="planner"]')
        && !q('[data-section="training"]') && !q('[data-daily-recap]'))
      check('Daily log is one card with extra logging inside it',
        Boolean(q('[data-section="daily"].today-card .today-list')) && Boolean(q('[data-section="daily"] [data-other="toggle"]')))

      let water = await rowFor('water')
      let quick = q('[data-quickadd="20"]', water)
      check('Water has one 20 oz quick action', Boolean(quick), quick?.textContent ?? 'missing')
      const beforeWaterXp = await xpOf('vitality')
      quick?.click(); await settle()
      water = await rowFor('water')
      q('[data-quickadd="20"]', water)?.click(); await settle()
      let day = await tempered.daily.dayLog(clock.today())
      check('two Water quick taps accumulate rather than replace', day.waterOz === 40, day.waterOz)
      check('Water logging still earns its attribute reward', (await xpOf('vitality')) > beforeWaterXp)

      let editor = await openEditor('water')
      const preset = q('.today-editor__preset-input', editor)
      preset.value = '24'
      q('.today-editor__preset-save', editor)?.click(); await settle()
      water = await rowFor('water')
      check('Water quick action remains user configurable', q('[data-quickadd="24"]', water) !== null)
      q('[data-quickadd="24"]', water)?.click(); await settle()
      day = await tempered.daily.dayLog(clock.today())
      check('custom Water quick action stays additive', day.waterOz === 64, day.waterOz)

      editor = await openEditor('sleep')
      const sleep = q('[data-entry="sleep"]', editor)
      sleep.value = '7.75'
      q('[data-action="log"]', editor)?.click(); await settle()
      day = await tempered.daily.dayLog(clock.today())
      check('measured Sleep logging still stores decimals', day.sleepHours === 7.75, day.sleepHours)

      const micro = await rowFor('micro_cardio')
      const windBefore = await xpOf('wind')
      q('[data-quickadd="2"]', micro)?.click(); await settle()
      day = await tempered.daily.dayLog(clock.today())
      check('Micro cardio one-tap logging stores minutes', day.microCardioMinutes === 2, day.microCardioMinutes)
      check('Micro cardio logging still earns Wind', (await xpOf('wind')) > windBefore)

      const rest = await rowFor('rest_day')
      const mark = rest?.matches('button.today-item') ? rest : q('button.today-item', rest)
      mark?.click(); await settle()
      const restView = (await tempered.daily.week(clock.today())).activities.find((activity) => activity.id === 'rest_day')
      check('weekly mark activities still complete in one tap', restView?.loggedToday === true)
      const completedRest = await rowFor('rest_day')
      check('completed habit uses the green check treatment', q('.today-item__icon[data-complete="true"]', completedRest) !== null)

      const mobility = await rowFor('mobility')
      q('.today-item__body', mobility)?.click(); await settle()
      const mobilityScreen = await waitFor('[data-mobility-screen]')
      check('Mobility still opens the guided full-screen tool', Boolean(mobilityScreen))
      q('[data-mobility-routine="desk_reset"]', mobilityScreen)?.click(); await settle()
      q('.mobility-flow__complete', mobilityScreen)?.click(); await settle()
      day = await tempered.daily.dayLog(clock.today())
      check('completing a Mobility flow logs its minutes', day.mobilityMinutes === 5, day.mobilityMinutes)

      const more = q('[data-other="toggle"]')
      if (more?.dataset.open !== 'true') { more?.click(); await settle() }
      editor = await openEditor('body_metrics')
      const weight = q('[data-entry="body_metrics"]', editor)
      weight.value = '184.2'
      q('[data-action="log"]', editor)?.click(); await settle()
      day = await tempered.daily.dayLog(clock.today())
      check('optional Body logging still persists from Log something else', day.bodyMetrics?.weight === 184.2, day.bodyMetrics?.weight)

      const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
      check('Today uses no punishment language', !forbidden.test(document.body.innerText))
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('R2 Today habit harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'daily', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
