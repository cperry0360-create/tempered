<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — calm daily tracking acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/calm.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * Calm Today acceptance.
       *
       * The redesign deliberately trades an always-open control panel for a
       * readable first view. Daily work still fits a phone, every tracker stays
       * reachable, mark activities remain one tap, and measured activities are
       * one disclosure tap plus the value/save interaction.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const PHONE = { width: 390, height: 844 }
      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s, root = document) => root?.querySelector(s) ?? null
      const qa = (s, root = document) => root ? [...root.querySelectorAll(s)] : []
      const settle = () => new Promise((r) => setTimeout(r, 35))

      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      async function openOther() {
        const toggle = q('[data-other="toggle"]')
        if (toggle && toggle.dataset.open !== 'true') { toggle.click(); await settle() }
        return toggle
      }

      async function openAllWeekly() {
        const button = q('[data-section="weekly"] .today-section__link')
        if (button && /see all/i.test(button.textContent)) { button.click(); await settle() }
      }

      async function rowFor(id) {
        let row = q(`[data-activity="${id}"]`)
        if (row) return row
        await openOther()
        row = q(`[data-activity="${id}"]`)
        return row
      }

      async function openEditor(id) {
        const row = await rowFor(id)
        const opener = q('[data-action="open-log"]', row)
        if (opener?.getAttribute('aria-expanded') !== 'true') { opener?.click(); await settle() }
        return q(`[data-editor="${id}"]`)
      }

      try {
        const storage = createMemoryStorage()
        const tempered = await bootstrap({ storage, mount: document.getElementById('app') })
        const xpOf = async (attribute) => (await storage.get('attributeState', attribute))?.xp ?? 0

        document.getElementById('app').style.width = `${PHONE.width}px`
        await tempered.app.show('today')
        await waitFor('.screen--today-calm')

        const summary = q('[data-summary="daily"]')
        check('Today opens with one calm daily summary', summary !== null)
        check('the summary exposes one progress bar rather than five attribute meters',
          qa('[role="progressbar"]', summary).length === 1 && qa('.strip__bar').length === 0,
          `${qa('[role="progressbar"]', summary).length} daily progress bar`)

        const bar = q('.tabbar')
        const dailySection = q('[data-section="daily"]')
        const barTop = PHONE.height - bar.getBoundingClientRect().height
        check('the DAILY list fits above navigation on a 6.1 inch view',
          dailySection.getBoundingClientRect().bottom <= barTop,
          `DAILY ends at ${Math.round(dailySection.getBoundingClientRect().bottom)}px; bar begins at ${Math.round(barTop)}px`)

        const dailyIds = await tempered.daily.dailyIds()
        const renderedDaily = qa('[data-section="daily"] [data-activity]').length
        check('the whole daily schedule is present', renderedDaily === dailyIds.length,
          `${renderedDaily}/${dailyIds.length} daily activities`)
        check('numeric fields are hidden until requested',
          q('[data-entry="sleep"]') === null && q('[data-entry="water"]') === null,
          'no always-open numeric controls')

        await openAllWeekly()
        await openOther()
        const reachable = new Set(qa('[data-activity]').map((node) => node.dataset.activity))
        check('every lifestyle tracker remains reachable from Today',
          tempered.daily.activities.every((activity) => reachable.has(activity.id)),
          `${reachable.size}/${tempered.daily.activities.length} trackers reachable`)

        const rest = await rowFor('rest_day')
        const restAction = q('[data-action="mark"]', rest)
        check('rest day is reachable in optional logging', restAction !== null)
        const vitalityBeforeRest = await xpOf('vitality')
        restAction?.click(); await settle()
        check('a mark activity still completes in one tap', (await xpOf('vitality')) > vitalityBeforeRest)
        check('the reward is shown as a small earned moment', /\+\d/.test(q('.today-earned')?.textContent ?? ''),
          q('.today-earned')?.textContent ?? 'no earned message')

        const nutrition = await rowFor('nutrition_logged')
        const vitalityBeforeFood = await xpOf('vitality')
        q('[data-action="mark"]', nutrition)?.click(); await settle()
        check('food logging remains one tap', (await xpOf('vitality')) > vitalityBeforeFood)

        let editor = await openEditor('sleep')
        const sleepField = q('[data-entry="sleep"]', editor)
        check('a measured activity reveals its field only after tapping the row', sleepField !== null)
        const vitalityBeforeSleep = await xpOf('vitality')
        sleepField.value = '8'
        q('[data-action="log"]', editor)?.click(); await settle()
        check('measured logging still awards XP after disclosure', (await xpOf('vitality')) > vitalityBeforeSleep)

        editor = await openEditor('water')
        let quick = qa('[data-quickadd]', editor)
        check('water keeps three fast add choices behind the row', quick.length === 3,
          quick.map((button) => button.textContent).join(' '))
        quick[0]?.click(); await settle()
        editor = await openEditor('water')
        quick = qa('[data-quickadd]', editor)
        quick[0]?.click(); await settle()
        const afterWater = await tempered.daily.dayLog(tempered.clock.today())
        check('piecewise water entries accumulate rather than replace', afterWater.waterOz === 16,
          `${afterWater.waterOz ?? 0} oz stored`)

        await openOther()
        editor = await openEditor('body_metrics')
        const bodyField = q('[data-entry="body_metrics"]', editor)
        const beforeMetric = await xpOf('vitality')
        bodyField.value = '184.2'
        q('[data-action="log"]', editor)?.click(); await settle()
        const afterMetric = await xpOf('vitality')
        check('body metric awards the flat act-of-logging XP',
          afterMetric - beforeMetric === tempered.balance.vitality.bodyMetricsLoggedXp,
          `+${afterMetric - beforeMetric}`)

        const workedToggle = q('[data-worked="toggle"]')
        if (workedToggle && workedToggle.dataset.open !== 'true') { workedToggle.click(); await settle() }
        check('completed evidence shows the body metric value back',
          /184\.2/.test(q('[data-worked="body_metrics"]')?.textContent ?? ''),
          q('[data-worked="body_metrics"]')?.textContent ?? 'not shown')

        const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
        check('Today uses no punishment language', !forbidden.test(document.body.innerText))

        check('the first view uses shared list surfaces instead of a card per task',
          qa('[data-section="daily"] .today-list').length === 1
          && qa('[data-section="daily"] .today-item').length >= dailyIds.length,
          `${qa('[data-section="daily"] .today-list').length} daily surface`)
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 400))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'daily', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
