<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — daily tracking acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * Phase 4 acceptance harness. The cadence rebuild renamed the Today DOM,
       * so this file deliberately speaks the current selectors while retaining
       * the original acceptance claims. Superseded claims should fail visibly;
       * they are not silently edited here.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const PHONE = { width: 390, height: 844 }
      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s, root = document) => root.querySelector(s)
      const qa = (s, root = document) => [...root.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 30))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      let taps = 0
      function tap(node, label) {
        if (!node) throw new Error(`nothing to tap for: ${label}`)
        taps += 1
        node.click()
        return node
      }

      const activityRow = (id) => q(`[data-activity="${id}"]`)
      const activityAction = (id) => activityRow(id)?.querySelector('button.row__act, button.entry__confirm') ?? null
      const activityInput = (id) => q(`[data-entry="${id}"]`)

      async function setOther(open) {
        const toggle = q('[data-other="toggle"]')
        if (!toggle) return false
        if ((toggle.dataset.open === 'true') !== open) { toggle.click(); await settle() }
        return true
      }

      async function ensureActivityVisible(id) {
        if (activityRow(id)) return activityRow(id)
        await setOther(true)
        return activityRow(id)
      }

      async function openWorked() {
        const toggle = q('[data-worked="toggle"]')
        if (!toggle) return false
        if (toggle.dataset.open !== 'true') { toggle.click(); await settle() }
        return true
      }

      try {
        const storage = createMemoryStorage()
        const tempered = await bootstrap({ storage, mount: document.getElementById('app') })
        const xpOf = async (attribute) => (await storage.get('attributeState', attribute))?.xp ?? 0

        document.getElementById('app').style.width = `${PHONE.width}px`
        await tempered.app.show('today')
        await waitFor('.screen--today')

        // ---------------------------------------------------------------
        // 1 — original one-view rule. Do not relax it here; step 4 decides it.
        // ---------------------------------------------------------------
        const body = q('.app__body')
        const bar = q('.tabbar')
        const barBox = bar.getBoundingClientRect()
        const needed = body.scrollHeight
        check('1 everything outstanding fits one 6.1" view, with no scrolling',
          needed <= PHONE.height,
          `needs ${Math.round(needed)}px of ${PHONE.height}px (bar is ${Math.round(barBox.height)}px, reserved)`)

        const renderedExercises = qa('[data-exerciseweek][data-done="false"]').length
        const prescribedToday = (await tempered.workout.todayTasks())?.tasks?.length ?? 0
        const renderedDaily = qa('[data-section="daily"] [data-activity]').length
        const dailyIds = await tempered.daily.dailyIds()
        check('1 and it is the whole day that fits, not a truncated list',
          renderedExercises === prescribedToday && renderedDaily === dailyIds.length,
          `${renderedExercises} exercise rows vs ${prescribedToday} prescribed today; ${renderedDaily}/${dailyIds.length} daily activities`)

        const catalogue = tempered.daily.activities.length
        const dailyCount = dailyIds.length
        check('1 the fit is about the daily list, not the catalogue',
          dailyCount < catalogue && q('[data-other="toggle"]') !== null,
          `${dailyCount} of ${catalogue} activities are daily; the rest are reachable separately`)

        check('1 rest day is on the daily list, never behind that control', dailyIds.includes('rest_day'))

        await setOther(true)
        const reachable = new Set(qa('[data-activity]').map((node) => node.dataset.activity))
        check('1 and every other activity is reachable through it',
          tempered.daily.activities.every((activity) => reachable.has(activity.id)),
          `${reachable.size} of ${catalogue} activity rows reachable`)
        await setOther(false)

        const visibleRows = qa('[data-section="daily"] [data-activity], [data-section="weekly"] [data-exerciseweek], [data-section="weekly"] [data-activity]')
        const lastOutstanding = visibleRows.at(-1)
        check('1 the last outstanding control is clear of the floating bar',
          lastOutstanding ? lastOutstanding.getBoundingClientRect().bottom <= PHONE.height - barBox.height : false,
          lastOutstanding ? `${Math.round(lastOutstanding.getBoundingClientRect().bottom)}px vs ${Math.round(PHONE.height - barBox.height)}px` : 'no outstanding row')

        // ---------------------------------------------------------------
        // 3 — rest day is first-class and rewarded
        // ---------------------------------------------------------------
        const restInitially = q('[data-section="daily"] [data-activity="rest_day"]')
        check('3 rest day is on screen without opening anything', restInitially !== null)
        const dailyRows = qa('[data-section="daily"] [data-activity]')
        check('3 rest day is the first daily action, not the last', dailyRows[0] === restInitially,
          `first is ${dailyRows[0]?.dataset.activity ?? 'none'}`)

        const vitalityBefore = await xpOf('vitality')
        await ensureActivityVisible('rest_day')
        taps = 0
        tap(activityAction('rest_day'), 'rest day')
        await settle()
        const vitalityAfterRest = await xpOf('vitality')
        check('3 ACCEPTANCE: rest day is a rewarded action, taken in one tap',
          taps === 1 && vitalityAfterRest > vitalityBefore,
          `${taps} tap, +${vitalityAfterRest - vitalityBefore} Vitality`)
        check('3 and the app says what it earned', /\+\d/.test(q('.earned')?.textContent ?? ''), q('.earned')?.textContent)

        // ---------------------------------------------------------------
        // 2 — one tap, or one number plus one tap
        // ---------------------------------------------------------------
        await ensureActivityVisible('nutrition_logged')
        const vitalityBeforeFood = await xpOf('vitality')
        taps = 0
        tap(activityAction('nutrition_logged'), 'food logged')
        await settle()
        check('2 ACCEPTANCE: a marked activity completes in exactly one tap',
          taps === 1 && await xpOf('vitality') > vitalityBeforeFood, `${taps} tap`)

        await ensureActivityVisible('sleep')
        const field = activityInput('sleep')
        check('2 a measured activity shows its field without being opened first', field !== null && field.offsetParent !== null)
        const vitalityBeforeSleep = await xpOf('vitality')
        taps = 0
        field.value = '8'
        tap(activityAction('sleep'), 'confirm sleep')
        await settle()
        check('2 ACCEPTANCE: a measured activity completes in one number plus one tap',
          taps === 1 && await xpOf('vitality') > vitalityBeforeSleep,
          `${taps} tap after entering the number`)
        check('2 and it leaves the outstanding list once logged',
          q('[data-section="daily"] [data-activity="sleep"]') === null && activityInput('sleep') === null)

        // Running total. Water may be OFF after the cadence rebuild, but the old
        // Phase 4 claim is still exercised rather than hidden by a null selector.
        await ensureActivityVisible('water')
        const waterField = activityInput('water')
        if (waterField) {
          waterField.value = '16'
          tap(activityAction('water'), 'water')
          await settle()
        }
        const dayAfterWater = await tempered.daily.dayLog(tempered.clock.today())
        check('2 a value that arrives in pieces adds up rather than replacing',
          dayAfterWater.waterOz === 16, `${dayAfterWater.waterOz ?? 0} oz stored`)

        const middayRows = qa('[data-section="daily"] [data-activity], [data-section="weekly"] [data-exerciseweek], [data-section="weekly"] [data-activity]')
        const middayLast = middayRows.at(-1)
        check('1 and it still fits once part of the day is logged',
          middayLast ? middayLast.getBoundingClientRect().bottom <= PHONE.height - barBox.height : false,
          middayLast ? `${Math.round(middayLast.getBoundingClientRect().bottom)}px vs ${Math.round(PHONE.height - barBox.height)}px` : 'no outstanding row')

        // ---------------------------------------------------------------
        // 4 — body metric: display the value, score only the act
        // ---------------------------------------------------------------
        const beforeMetric = await xpOf('vitality')
        await ensureActivityVisible('body_metrics')
        const bodyField = activityInput('body_metrics')
        if (bodyField) bodyField.value = '184.2'
        tap(activityAction('body_metrics'), 'body metrics')
        await settle()
        const afterMetric = await xpOf('vitality')
        const flat = tempered.balance.vitality.bodyMetricsLoggedXp
        check('4 ACCEPTANCE: a body metric awards XP for the act of logging',
          afterMetric - beforeMetric === flat,
          `+${afterMetric - beforeMetric}, and the act is worth ${flat}`)

        await openWorked()
        check('4 ACCEPTANCE: and shows the number back to the user',
          /184\.2/.test(q('[data-worked="body_metrics"]')?.textContent ?? ''),
          q('[data-worked="body_metrics"]')?.textContent ?? 'not shown')

        const beforeHeavier = await xpOf('vitality')
        await tempered.daily.log('body_metrics', 250)
        await tempered.app.show('today')
        await openWorked()
        check('4 HARD RULE: a heavier reading is worth exactly the same — nothing more',
          await xpOf('vitality') === beforeHeavier,
          `${await xpOf('vitality')} XP, unchanged`)
        check('4 and the new number is the one shown back',
          /250/.test(q('[data-worked="body_metrics"]')?.textContent ?? ''),
          q('[data-worked="body_metrics"]')?.textContent ?? 'not shown')

        const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
        check('nothing on this screen calls unlogged work overdue, late or missed',
          !forbidden.test(document.body.innerText),
          (document.body.innerText.match(forbidden) ?? ['none'])[0])

        const beforeCorrection = await xpOf('wind')
        await tempered.daily.log('steps', 12000)
        const paid = await xpOf('wind')
        await tempered.daily.log('steps', 3000)
        check('correcting a number downwards never takes XP back',
          await xpOf('wind') === paid && paid > beforeCorrection,
          `${paid} XP, kept`)

        await tempered.daily.setDaily('read', true)
        await tempered.app.show('today')
        check('the daily list is editable, and Today follows it',
          q('[data-section="daily"] [data-activity="read"]') !== null,
          'reading is on the daily list now')

        const loggedBefore = (await tempered.daily.today()).logged.length
        await tempered.daily.setDaily('water', false)
        check('taking one off the list never unlogs anything',
          (await tempered.daily.today()).logged.length === loggedBefore,
          `${loggedBefore} entries, untouched`)

        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'daily', passed: checks.every((c) => c.ok), checks }),
        })
      } catch (error) {
        checks.push({ name: 'harness threw', ok: false, detail: String(error?.stack ?? error).slice(0, 400) })
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'daily', passed: false, checks }),
        })
      }
    </script>
  </body>
</html>
