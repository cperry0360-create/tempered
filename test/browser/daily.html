<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — daily tracking acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * The four Phase 4 acceptance criteria from docs/07-build-plan.md, driven
       * against the real app:
       *
       *   - Today loads in one view with no scrolling to see what is outstanding
       *     (the day's slots and the DAILY activities — docs/03 and docs/10)
       *   - any single item completes in one tap, or one number plus one tap
       *   - rest day is a first-class rewarded action
       *   - a body metric shows its number back and awards XP only for logging
       *
       * Taps are counted the way `logging-speed.html` counts them: every click
       * goes through tap(), so nothing can be undercounted by hand. The fit is
       * measured at a stated 6.1" phone rather than at whatever size the
       * headless window happens to be, because "one view" is a claim about a
       * phone and nothing else.
       */
      import { bootstrap } from '../../src/app/bootstrap.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      /** iPhone 14 / 15, in CSS pixels. The screen docs/03 is written for. */
      const PHONE = { width: 390, height: 844 }

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s, root = document) => root.querySelector(s)
      const qa = (s, root = document) => [...root.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 30))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      /** The worked list is collapsed by default and stays open once opened. */
      async function openWorked() {
        const toggle = await waitFor('[data-worked="toggle"]')
        if (toggle.dataset.open !== 'true') { tap(toggle, 'open worked'); await settle() }
      }

      let taps = 0
      function tap(node, label) {
        if (!node) throw new Error(`nothing to tap for: ${label}`)
        taps += 1
        node.click()
        return node
      }

      try {
        const storage = createMemoryStorage()
        const tempered = await bootstrap({ storage, mount: document.getElementById('app') })
        const xpOf = async (attribute) => (await storage.get('attributeState', attribute))?.xp ?? 0

        // A phone-width layout, whatever window the harness happens to run in.
        document.getElementById('app').style.width = `${PHONE.width}px`
        await tempered.app.show('today')
        await waitFor('[data-log]')

        // ---------------------------------------------------------------
        // 1 — one view, no scrolling to see what is outstanding
        // ---------------------------------------------------------------
        const body = q('.app__body')
        const bar = q('.tabbar')
        const barBox = bar.getBoundingClientRect()
        // The body's own bottom padding already reserves room for the floating
        // bar, so its scroll height is the whole demand this screen makes.
        const needed = body.scrollHeight
        check('1 everything outstanding fits one 6.1" view, with no scrolling',
          needed <= PHONE.height,
          `needs ${Math.round(needed)}px of ${PHONE.height}px (bar is ${Math.round(barBox.height)}px, reserved)`)

        const slots = qa('[data-task][data-done="false"]').length
        check('1 and it is the whole day that fits, not a truncated list',
          slots === 6 && qa('[data-log]').length === (await tempered.daily.dailyIds()).length,
          `all ${slots} training slots and all ${qa('[data-log]').length} daily activities`)

        // The structural half of the rule: the fit is about the daily list, so
        // the catalogue can grow without the screen degrading.
        const catalogue = tempered.daily.activities.length
        const dailyCount = (await tempered.daily.dailyIds()).length
        check('1 the fit is about the daily list, not the catalogue',
          dailyCount < catalogue && q('[data-other="toggle"]') !== null,
          `${dailyCount} of ${catalogue} activities are daily; the rest are one control away`)

        check('1 rest day is on the daily list, never behind that control',
          (await tempered.daily.dailyIds()).includes('rest_day'))

        // Nothing is lost by the split: everything else is still loggable.
        tap(q('[data-other="toggle"]'), 'log something else')
        await settle()
        const reachable = new Set(qa('[data-log]').map((node) => node.dataset.log))
        check('1 and every other activity is reachable through it',
          tempered.daily.activities.every((activity) => reachable.has(activity.id)),
          `${reachable.size} of ${catalogue} reachable in one tap`)
        tap(q('[data-other="toggle"]'), 'close')
        await settle()

        // Nothing may be hidden under the floating bar.
        const lastOutstanding = qa('[data-log]').at(-1)
        check('1 the last outstanding control is clear of the floating bar',
          lastOutstanding.getBoundingClientRect().bottom <= PHONE.height - barBox.height,
          `${Math.round(lastOutstanding.getBoundingClientRect().bottom)}px vs ${Math.round(PHONE.height - barBox.height)}px`)

        // ---------------------------------------------------------------
        // 3 — rest day is first-class and rewarded
        // ---------------------------------------------------------------
        const rest = q('[data-log="rest_day"]')
        check('3 rest day is on screen without opening anything', rest !== null)
        check('3 rest day is the first daily action, not the last',
          qa('[data-log]')[0] === rest, `first is ${qa('[data-log]')[0]?.dataset.log}`)

        const vitalityBefore = await xpOf('vitality')
        taps = 0
        tap(rest, 'rest day')
        await settle()
        const vitalityAfterRest = await xpOf('vitality')
        check('3 ACCEPTANCE: rest day is a rewarded action, taken in one tap',
          taps === 1 && vitalityAfterRest > vitalityBefore,
          `${taps} tap, +${vitalityAfterRest - vitalityBefore} Vitality`)
        check('3 and the app says what it earned', /\+\d/.test(q('.earned')?.textContent ?? ''),
          q('.earned')?.textContent)

        // ---------------------------------------------------------------
        // 2 — one tap, or one number plus one tap
        // ---------------------------------------------------------------
        const vitalityBeforeFood = await xpOf('vitality')
        taps = 0
        tap(q('[data-log="nutrition_logged"]'), 'food logged')
        await settle()
        check('2 ACCEPTANCE: a marked activity completes in exactly one tap',
          taps === 1 && await xpOf('vitality') > vitalityBeforeFood, `${taps} tap`)

        // The field is already on screen: nothing to open first, which is what
        // makes the cost a number plus one tap rather than a tap, a number and
        // another tap.
        const field = q('[data-entry="sleep"]')
        check('2 a measured activity shows its field without being opened first',
          field !== null && field.offsetParent !== null)

        const vitalityBeforeSleep = await xpOf('vitality')
        taps = 0
        field.value = '8'
        tap(q('.entry [data-log="sleep"]'), 'confirm sleep')
        await settle()
        check('2 ACCEPTANCE: a measured activity completes in one number plus one tap',
          taps === 1 && await xpOf('vitality') > vitalityBeforeSleep,
          `${taps} tap after entering the number`)
        check('2 and it leaves the outstanding list once logged',
          q('[data-log="sleep"]') === null && q('[data-entry="sleep"]') === null)

        // A running total adds rather than asking for arithmetic.
        q('[data-entry="water"]').value = '16'
        tap(q('.entry [data-log="water"]'), 'water')
        await settle()
        await tempered.app.show('today')
        await openWorked()
        check('2 a value that arrives in pieces adds up rather than replacing',
          /16 oz/.test(q('[data-worked="water"]')?.textContent ?? ''),
          q('[data-worked="water"]')?.textContent)

        // Logging must not make the screen taller. Three entries in, the last
        // outstanding control is still above the bar.
        const midday = qa('[data-log]').at(-1).getBoundingClientRect().bottom
        check('1 and it still fits once part of the day is logged',
          midday <= PHONE.height - barBox.height,
          `${Math.round(midday)}px vs ${Math.round(PHONE.height - barBox.height)}px, three entries in`)

        // ---------------------------------------------------------------
        // 4 — a body metric shows the number back, and scores only the act
        //
        // Body metrics are not on the daily list by default — weighing yourself
        // every day is not something the app should assume — so this also
        // exercises logging from behind the one control.
        // ---------------------------------------------------------------
        const beforeMetric = await xpOf('vitality')
        tap(q('[data-other="toggle"]'), 'log something else')
        await settle()
        q('[data-entry="body_metrics"]').value = '184.2'
        tap(q('.entry [data-log="body_metrics"]'), 'body metrics')
        await settle()
        const afterMetric = await xpOf('vitality')
        const flat = tempered.balance.vitality.bodyMetricsLoggedXp
        check('4 ACCEPTANCE: a body metric awards XP for the act of logging',
          afterMetric - beforeMetric === flat,
          `+${afterMetric - beforeMetric}, and the act is worth ${flat}`)

        await openWorked()
        check('4 ACCEPTANCE: and shows the number back to the user',
          /184\.2/.test(q('[data-worked="body_metrics"]')?.textContent ?? ''),
          q('[data-worked="body_metrics"]')?.textContent)

        // The hard rule, at the surface: a different reading is worth the same.
        const beforeHeavier = await xpOf('vitality')
        await tempered.daily.log('body_metrics', 250)
        await tempered.app.show('today')
        await openWorked()
        check('4 HARD RULE: a heavier reading is worth exactly the same — nothing more',
          await xpOf('vitality') === beforeHeavier,
          `${await xpOf('vitality')} XP, unchanged`)
        check('4 and the new number is the one shown back',
          /250/.test(q('[data-worked="body_metrics"]')?.textContent ?? ''),
          q('[data-worked="body_metrics"]')?.textContent)

        // ---------------------------------------------------------------
        // The rules that outlive this phase
        // ---------------------------------------------------------------
        const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
        check('nothing on this screen calls unlogged work overdue, late or missed',
          !forbidden.test(document.body.innerText),
          (document.body.innerText.match(forbidden) ?? ['none'])[0])

        // Logging is never punished, in either direction.
        const beforeCorrection = await xpOf('wind')
        await tempered.daily.log('steps', 12000)
        const paid = await xpOf('wind')
        await tempered.daily.log('steps', 3000)
        check('correcting a number downwards never takes XP back',
          await xpOf('wind') === paid && paid > beforeCorrection,
          `${paid} XP, kept`)

        // The list is the user's: turning one on puts it on Today, and turning
        // it off takes it away without touching anything already logged.
        await tempered.daily.setDaily('read', true)
        await tempered.app.show('today')
        await waitFor('[data-log]')
        check('the daily list is editable, and Today follows it',
          q('[data-log="read"]') !== null && q('[data-entry="read"]') !== null,
          'reading is on the daily list now')

        const loggedBefore = (await tempered.daily.today()).logged.length
        await tempered.daily.setDaily('water', false)
        check('taking one off the list never unlogs anything',
          (await tempered.daily.today()).logged.length === loggedBefore,
          `${loggedBefore} entries, untouched`)

        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'daily', passed: checks.every((c) => c.ok), checks }),
        })
      } catch (error) {
        checks.push({ name: 'harness threw', ok: false, detail: String(error?.stack ?? error).slice(0, 400) })
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'daily', passed: false, checks }),
        })
      }
    </script>
  </body>
</html>
