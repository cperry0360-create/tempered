<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Duo layout acceptance</title></head>
<body><div id="app" class="app"></div><pre id="results"></pre><script type="module">
import { bootstrapHarness } from './harness.js'
import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
import { fixedClock } from '../../src/adapters/clock/clock.js'
const params = new URLSearchParams(location.search)
const settle = () => new Promise(resolve => setTimeout(resolve, 80))
if (params.has('fixture')) {
  const html = new DOMParser().parseFromString(await fetch('../../index.html').then(r => r.text()), 'text/html')
  const styles = [...html.querySelectorAll('link[rel="stylesheet"]')].map(link => new Promise((resolve, reject) => {
    const copy = document.createElement('link'); copy.rel = 'stylesheet'; copy.href = '../../' + link.getAttribute('href').replace('./', '')
    copy.onload = resolve; copy.onerror = reject; document.head.append(copy)
  }))
  await Promise.all(styles)
  // Geometry assertions inspect the settled layout, independent of background-tab animation throttling.
  document.documentElement.style.setProperty('--motion-screen', '0ms')
  if (params.get('layout') === 'duo') document.documentElement.dataset.layout = 'duo'
  document.documentElement.dataset.theme = params.get('theme') ?? 'light'
  document.documentElement.style.setProperty('--duo-inset-right', (params.get('right') ?? 0) + 'px')
  document.documentElement.style.setProperty('--duo-inset-top', (params.get('top') ?? 0) + 'px')
  const storage = createMemoryStorage(), clock = fixedClock(new Date(2026, 9, 25, 12))
  const app = await bootstrapHarness({ storage, clock, mount: document.querySelector('#app'), initialTab: params.get('view') ?? 'today' })
  await settle()
  parent.postMessage({ duoFixtureReady: true }, location.origin)
  // The same fixture supports visual review without changing production data.
 } else if (params.has('review')) {
  document.body.style.margin = '0'
  const frame = document.createElement('iframe')
  frame.style.cssText = `display:block;border:0;width:${Number(params.get('width') ?? 932)}px;height:${Number(params.get('height') ?? 656)}px`
  const query = new URLSearchParams(params); query.delete('review'); query.set('fixture', '1')
  frame.src = '?' + query; document.body.replaceChildren(frame)
} else {
  const checks = [], check = (name, ok, detail = '') => checks.push({name, ok: Boolean(ok), detail: String(detail)})
  const frame = document.createElement('iframe'); frame.style.cssText = 'position:fixed;left:0;top:0;border:0'; document.body.append(frame)
  const load = async (width, height, query) => {
    frame.style.width = width + 'px'; frame.style.height = height + 'px'
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Error('Duo fixture timed out')), 15000)
      const ready = event => { if(event.source === frame.contentWindow && event.data.duoFixtureReady) { clearTimeout(timer); removeEventListener('message', ready); resolve() } }
      addEventListener('message', ready); frame.src = '?fixture=1&' + query
    })
    return frame.contentDocument
  }
  const rect = node => node?.getBoundingClientRect()
  const close = (a, b) => Math.abs(a - b) < 2
  try {
    for (const [width, height, right, top] of [[932,656,0,0],[890,626,0,24],[932,656,80,0],[466,678,0,24],[626,890,0,24]]) {
      const d = await load(width,height,`layout=duo&right=${right}&top=${top}`), w = frame.contentWindow
      const q = s => d.querySelector(s), r = s => rect(q(s)), label = `${width}×${height} right ${right}`
      check(label + ' floating rail uses an isolated glass capsule on the continuous canvas',
        w.getComputedStyle(q('.tabbar')).backgroundImage === 'none'
        && w.getComputedStyle(q('.tabbar__tabs')).backgroundImage.includes('linear-gradient')
        && w.getComputedStyle(q('#app')).backgroundImage.includes('radial-gradient'))
      check(label + ' rail reserves the safe inset once', close(r('.tabbar').width, 48 + right))
      check(label + ' glass capsule stays fully on screen at the right safe edge',
        r('.tabbar__tabs').right <= width-right+2
        && r('.tabbar__tabs').left >= 0
        && close(r('.tabbar__tabs').width,48))
      check(label + ' main canvas remains full width with no tinted rail stripe',
  close(r('.app__body').right, r('#app').right)
  && w.getComputedStyle(q('.tabbar')).backgroundImage==='none'
  && w.getComputedStyle(q('.tabbar')).backdropFilter==='none')
check(label + ' content is padded clear of the floating icons',
  r('.app__body').right - parseFloat(w.getComputedStyle(q('.app__body')).paddingRight)
    <= r('.tabbar').left - 6)
      check(label + ' navigation uses matching, borderless custom SVG icons',
        q('.tabbar__tab[aria-current="page"]') !== null
        && r('.tabbar').width <= 48 + right + 1
        && w.getComputedStyle(q('.tabbar__tab span')).opacity === '0'
        && [...d.querySelectorAll('.tabbar__tab')].length===4
        && [...d.querySelectorAll('.tabbar__tab')].every(node=>
          w.getComputedStyle(node).borderTopWidth==='0px'
          && node.querySelector('svg')?.getAttribute('viewBox')==='0 0 24 24'
          && node.querySelector('svg')?.dataset.customRailGlyph==='nav-'+(node.dataset.tab==='history'?'progress':node.dataset.tab))
        && !q('[data-tab="history"] svg path')?.getAttribute('d')?.includes('M4.4 19.5v-6.6'))
      check(label + ' no horizontal overflow', q('.app__body').scrollWidth <= q('.app__body').clientWidth + 1)
      const wide = width >= 740
      check(label + ' daily log uses its own column only when expanded', wide ? close(r('.today-daily-log').top, r('.today-session-card').top) && r('.today-daily-log').left > r('.today-session-card').right : r('.today-daily-log').top > r('.today-fuel-card').top)
      if(width===932 && right===0) {
        const tapped=q('[data-tab="train"]'),pos=tapped.getBoundingClientRect()
        let shown=0
        const listener=e=>{if(e.detail?.tab==='train')shown++}
        w.addEventListener('tempered:screen-shown',listener)
        tapped.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:110,button:0,clientY:pos.top+pos.height/2}))
        tapped.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:110,button:0,clientY:pos.top+pos.height/2}))
        tapped.click()
        await new Promise(resolve => setTimeout(resolve,150));await settle()
        check(label+' ordinary tap navigates once despite pointerup plus click',shown===1,'events='+shown)
        w.removeEventListener('tempered:screen-shown',listener)
        const progress=q('[data-tab="history"]'),progressRect=progress.getBoundingClientRect()
        let progressShown=0
        const watch=e=>{if(e.detail?.tab==='history')progressShown++}
        w.addEventListener('tempered:screen-shown',watch)
        progress.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:111,button:0,clientY:progressRect.top+progressRect.height/2}))
        await new Promise(resolve=>setTimeout(resolve,720))
        const expandedRail=q('.tabbar__tabs'), expandedBounds=rect(expandedRail)
        check(label+' long press grows the glass vessel LEFT without clipping',
          expandedRail.dataset.holding==='true'
          && expandedBounds.width>=107
          && expandedBounds.right<=width+1
          && expandedBounds.left>=0)
        check(label+' long press reveals all four captions UNDER their custom art',
          [...expandedRail.querySelectorAll('.tabbar__tab')].length===4
          && [...expandedRail.querySelectorAll('.tabbar__tab')].every(tab=>{
            const art=rect(tab.querySelector('svg')), caption=tab.querySelector('span'), cap=rect(caption)
            return cap.top>=art.bottom-1
              && w.getComputedStyle(caption).opacity==='1'
              && w.getComputedStyle(caption).visibility==='visible'
              && ['Today','Train','Fuel','Progress'].includes(caption.textContent.trim())
          })
          && w.getComputedStyle(q('[data-tab="history"]')).transform!=='none')
        progress.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:111,button:0,clientY:progressRect.top+progressRect.height/2}))
        progress.click()
        await new Promise(resolve=>setTimeout(resolve,140));await settle()
        check(label+' held glass icon navigates once and consumes follow-up click',progressShown===1,'events='+progressShown)
        await new Promise(resolve=>setTimeout(resolve,420))
        check(label+' capsule animates back to icon-only compact size after release',
          rect(q('.tabbar__tabs')).width<=50
          && q('.tabbar__tabs').dataset.holding!=='true'
          && w.getComputedStyle(q('.tabbar__tab span')).opacity==='0')
        w.removeEventListener('tempered:screen-shown',watch)
        q('[data-tab="train"]').click();await settle()
      }else{
        q('[data-tab="train"]').click();await new Promise(resolve=>setTimeout(resolve,120));await settle()
      }
      if (wide) check(label + ' Train stacks cards independently', r('.train-r4__sessions') && r('.train-r4__routines') && close(r('.train-r4__sessions').top, r('.train-r4__program').top) && close(r('.train-r4__routines').top, r('.train-r4__sessions').bottom + 16))
      check(label + ' active plan is explicitly identified', Boolean(q('[data-active-program="true"]')))
      const planRow = q('[data-preview-day]')
      check(label + ' plan rows provide a preview without starting immediately', Boolean(planRow))
      planRow?.click()
      await settle()
      check(label + ' exercises and sets are visible before starting',
        Boolean(q('[data-program-preview] .train-r4__preview-exercise'))
        && Boolean(q('[data-start-preview]'))
        && !q('.screen--session'))
      q('.train-r4__plan-preview .train-r4__back')?.click()
      await settle()
      check(label + ' user can return to planned sessions', Boolean(q('.train-r4__sessions')))
      q('.app__body').scrollTop = 160; await settle()
      const header = r('.train-calculator-bar')
      check(label + ' Train header covers the top edge after scrolling', close(header.top,0) && q('.train-calculator-bar').contains(d.elementFromPoint(header.left + 8, 1)), JSON.stringify({top:header.top,left:header.left,scroll:q('.app__body').scrollTop,hit:d.elementFromPoint(header.left + 8,1)?.className}))
      q('[data-tab="fuel"]').click(); await new Promise(resolve => setTimeout(resolve,120)); await settle()
      check(label + ' Fuel fits the available canvas', q('.app__body').scrollWidth <= q('.app__body').clientWidth + 1)
      if (!wide) check(label + ' cover Food cards use the full pane width',
        Math.abs(r('.fuel-r4__energy').width - r('.food-v2__macro-card').width) <= 2
        && Math.abs(r('.food-v2__macro-card').width - r('.food-v2__small-row').width) <= 2)
      if (wide) {
        check(label + ' primary meal-entry pane begins beside calorie hero',
          close(r('.food-v3__search').top, r('.fuel-r4__energy').top))
        check(label + ' energy and Water share the left pane',
          q('.fuel-r4__overview')?.contains(q('.fuel-r4__energy'))
          && q('.fuel-r4__overview')?.contains(q('.fuel-r4__water'))
          && q('.fuel-r4__details')?.contains(q('.fuel-r4__meal-panel'))
          && r('.fuel-r4__water').right <= r('.fuel-r4__meal-panel').left)
        const overview = q('.fuel-r4__overview')
        const details = q('.fuel-r4__details')
        const computed = w.getComputedStyle(overview)
        check(label + ' Food columns never own separate scroll views',
          computed.position === 'static' &&
          computed.overflowY !== 'auto' && computed.overflowY !== 'scroll' &&
          overview.scrollHeight <= overview.clientHeight + 2 &&
          w.getComputedStyle(details).overflowY !== 'auto' &&
          w.getComputedStyle(q('.food-v3__search .fuel-food__results')).overflowY !== 'auto',
          JSON.stringify({ position: computed.position, overflow: computed.overflowY,
            content: overview.scrollHeight, height: overview.clientHeight }))
        details.style.paddingBottom = '1500px'
        const beforeLeft = r('.fuel-r4__energy').top
        const beforeRight = r('.fuel-r4__meal-panel').top
        q('.app__body').scrollTop = 650
        await settle()
        const leftTravel = beforeLeft - r('.fuel-r4__energy').top
        const rightTravel = beforeRight - r('.fuel-r4__meal-panel').top
        check(label + ' one page gesture scrolls left and right together',
          q('.app__body').scrollTop >= 500 &&
          Math.abs(leftTravel - rightTravel) <= 3 &&
          leftTravel > 500,
          JSON.stringify({leftTravel,rightTravel,scroll:q('.app__body').scrollTop}))
      }
      await w.tempered.app.show('settings'); await settle()
      q('[data-action="program-builder"]')?.click(); await new Promise(resolve => setTimeout(resolve,180)); await settle()
      check(label + ' Program Builder exposes independent editing panes',
        Boolean(q('.program-builder__sidebar')) && Boolean(q('.program-builder__editor')))
      if (wide) check(label + ' Program Builder uses both Duo columns',
        r('.program-builder__sidebar').right < r('.program-builder__editor').left
        && r('.program-builder__editor').width >= 270)
      else check(label + ' Program Builder stacks on narrow viewports',
        r('.program-builder__editor').top >= r('.program-builder__sidebar').bottom)
      q('[data-action="builder-back"]')?.click(); await settle()
      check(label + ' Builder closes back to Settings', Boolean(q('[data-section="program-library"]')))
    }
    for (const width of [390,430]) {
      const d = await load(width,844,'view=today'), w = frame.contentWindow
      const cards = [...d.querySelectorAll('.today-session-card,.today-readiness,.today-week,.today-fuel-card,.today-daily-log')]
      check(width + ' ordinary phone keeps its card order',cards.every((node,i) => !i || rect(node).top > rect(cards[i-1]).top))
      check(width + ' ordinary phone keeps bottom navigation',close(rect(d.querySelector('.tabbar')).width,width) && w.getComputedStyle(d.querySelector('.tabbar')).flexDirection !== 'column')
      d.querySelector('[data-tab="train"]').click(); await new Promise(resolve => setTimeout(resolve,120)); await settle()
      d.querySelector('[data-preview-day]')?.click(); await settle()
      check(width + ' phone plan preview lists exercises without opening session',
        Boolean(d.querySelector('[data-program-preview] .train-r4__preview-exercise'))
        && !d.querySelector('.screen--session'))
      d.querySelector('.train-r4__back')?.click(); await settle()
      d.querySelector('[data-tab="fuel"]').click(); await new Promise(resolve => setTimeout(resolve,120)); await settle()
      const f = selector => rect(d.querySelector(selector))
      check(width + ' ordinary phone puts primary meal entry after Water, before diary',
        f('.food-v2__energy').top < f('.food-v2__macro-card').top
        && f('.food-v2__macro-card').top < f('.food-v2__water').top
        && f('.food-v2__water').top < f('.fuel-r4__meal-panel').top
        && f('.fuel-r4__meal-panel').top < f('.fuel-diary').top)
      check(width + ' ordinary phone Fuel does not overflow',
        d.querySelector('.app__body').scrollWidth <= d.querySelector('.app__body').clientWidth + 1)
    }
  } catch(error) {check('Harness completed',false,error.stack)}
  frame.remove()
  document.querySelector('#results').textContent = JSON.stringify({passed: checks.every(c=>c.ok), checks},null,2)
  await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'duo-layout',passed:checks.every(c=>c.ok),checks})})
}
</script></body></html>
