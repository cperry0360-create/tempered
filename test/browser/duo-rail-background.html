<!doctype html>
<html lang="en" data-layout="duo"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFMS Duo right rail background acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/style.css">
<link rel="stylesheet" href="../../src/nutrition-today.css">
<link rel="stylesheet" href="../../src/calm.css">
<link rel="stylesheet" href="../../src/duo.css">
<link rel="stylesheet" href="../../src/refined-ui.css">
<link rel="stylesheet" href="../../src/food-v2.css">
<link rel="stylesheet" href="../../src/food-v3.css">
<link rel="stylesheet" href="../../src/food-next.css">
<link rel="stylesheet" href="../../src/workout-r5.css">
<link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/today-next.css">
<link rel="stylesheet" href="../../src/train-next.css">
<link rel="stylesheet" href="../../src/progress-next.css">
<link rel="stylesheet" href="../../src/lfms-finish.css">
<link rel="stylesheet" href="../../src/lfms-subscreen.css">
<link rel="stylesheet" href="../../src/food-neon.css">
<link rel="stylesheet" href="../../src/weekly-recap-next.css">
<link rel="stylesheet" href="../../src/food-log-polish.css">
<link rel="stylesheet" href="../../src/lfms-feedback-polish.css">
<link rel="stylesheet" href="../../src/lfms-workout-complete.css">
<link rel="stylesheet" href="../../src/lfms-session-duo.css">
</head><body><div id="app" class="app"></div>
<script type="module">
import { bootstrapHarness } from './harness.js'
import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
import { fixedClock } from '../../src/adapters/clock/clock.js'

const checks=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const transparent=element=>element && getComputedStyle(element).backgroundColor==='rgba(0, 0, 0, 0)' &&
 getComputedStyle(element).backgroundImage==='none'
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
try{
 const storage=createMemoryStorage()
 await storage.open()
 await storage.put('profile',{id:'profile',name:'Duo rail background test',setupComplete:true})
 const clock=fixedClock(new Date(2026,10,2,14))
 const fixture=await bootstrapHarness({storage,clock,mount:document.getElementById('app'),initialTab:'today'})
 await fixture.app.show('today')
 await wait(30)
 const html=document.documentElement,app=document.getElementById('app')
 const rail=app.querySelector('.tabbar'), capsule=rail?.querySelector('.tabbar__tabs')
 // The Duo has one solid color. No gradient canvas or duplicate strip.
 const canvas=()=>getComputedStyle(document.body).backgroundColor
 const originalCanvas=canvas()
 const rootColor=()=>getComputedStyle(document.documentElement).backgroundColor
 const backdrop=()=>getComputedStyle(document.body,'::before')
 check('soft-black Duo color fills root and body with no gradient layer',
   originalCanvas==='rgb(16, 24, 32)'
   &&rootColor()===originalCanvas
   &&getComputedStyle(document.body).backgroundImage==='none'
   &&getComputedStyle(document.documentElement).backgroundImage==='none'
   &&backdrop().content==='none'&&backdrop().display==='none',
   JSON.stringify({body:originalCanvas,root:rootColor(),pseudo:backdrop().content}))
 check('no duplicate canvas behind the LFMS app',backdrop().content==='none')
 // Simulate the initial LFMS splash and its dismissal, testing the actual
 // background underneath the 4s animation rather than only settled pages.
 const splash=document.createElement('div')
 splash.className='lfms-launch'
 splash.setAttribute('aria-hidden','true')
 document.body.append(splash)
 const statusCover=document.createElement('div')
 statusCover.className='status-bar-cover'
 document.body.append(statusCover)
 const clearLaunch=()=>getComputedStyle(splash).backgroundImage==='none'
   &&getComputedStyle(splash).backgroundColor==='rgba(0, 0, 0, 0)'
   &&getComputedStyle(splash).boxShadow==='none'
 check('launch is artwork over the same canvas, never a second opaque backdrop',
   clearLaunch()&&getComputedStyle(statusCover).display==='none')
 const beforeSplashBg=canvas()
 const beforeSplashRoot=getComputedStyle(html).backgroundColor
 const beforeSplashBody=getComputedStyle(document.body).backgroundColor
 check('Today stays invisible beneath the open LFMS splash',
   getComputedStyle(app).visibility==='hidden'
   &&getComputedStyle(app).opacity==='0'
   &&canvas()===originalCanvas)
 splash.dataset.closing='true'
 const closingBg=canvas()
 const closingRoot=getComputedStyle(html).backgroundColor
 const closingBody=getComputedStyle(document.body).backgroundColor
 check('Today becomes visible behind the same transparent splash canvas',
   getComputedStyle(app).visibility==='visible'
   &&getComputedStyle(app).opacity==='1'
   &&clearLaunch()
   &&getComputedStyle(statusCover).display==='none'
   &&canvas()===originalCanvas)
 check('splash exits in one brief crossfade rather than lingering over empty navy',
   getComputedStyle(splash).transitionDuration.split(',')[0].trim()==='0.18s')
 splash.remove()
 await wait(40)
 check('Today is fully visible after the LFMS splash is removed',
   getComputedStyle(app).visibility==='visible'
   &&Number(getComputedStyle(app).opacity)>0.99
   &&canvas()===originalCanvas)
 check('no black sidebar flash when LFMS splash closes',
   beforeSplashBg===closingBg&&closingBg===canvas()
   &&beforeSplashRoot===closingRoot
   &&beforeSplashBody===closingBody
   &&beforeSplashRoot===getComputedStyle(html).backgroundColor
   &&beforeSplashBody===getComputedStyle(document.body).backgroundColor,
   JSON.stringify({root:[beforeSplashRoot,closingRoot],
     body:[beforeSplashBody,closingBody]}))
 check('glass vessel remains painted, but its surrounding navigation rail is transparent',
   transparent(rail)&&getComputedStyle(capsule).backgroundImage.includes('linear-gradient'))
 const originalCapsule=capsule
 for(const tab of ['today','train','fuel','history']){
   await fixture.app.show(tab)
   await wait(30)
   const screen=app.querySelector('.app__body > .screen')
   check(tab+' has exactly one background layer and no distinct rail stripe',
     canvas()===originalCanvas
     &&backdrop().content==='none'
     &&getComputedStyle(document.body).backgroundImage==='none'
     &&getComputedStyle(html).backgroundImage==='none'
     &&transparent(app)
     &&transparent(app.querySelector('.app__body'))&&transparent(screen)
     &&transparent(rail),
     JSON.stringify({tab,canvas:canvas(),
       body:getComputedStyle(document.body).backgroundImage,
       app:getComputedStyle(app).backgroundImage,
       screen:screen&&getComputedStyle(screen).backgroundImage,
       rail:getComputedStyle(rail).backgroundImage}))
   check(tab+' preserves capsule geometry and glass',
     capsule===originalCapsule&&getComputedStyle(capsule).backgroundImage.includes('linear-gradient'))
 }
 const screen=app.querySelector('.app__body > .screen')
 check('the rail and main screen share one full-width ancestor without painted divider',
   !!screen&&app.getBoundingClientRect().right>=rail.getBoundingClientRect().right-1)
}catch(err){check('Duo seamless rail acceptance harness',false,err?.stack??String(err))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({label:'duo-rail-background',passed:checks.every(c=>c.ok),checks})})
</script></body></html>
