<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tempered — Approved Food 2.0 canonical integration</title>
<link rel="stylesheet" href="../../src/tokens.css"/><link rel="stylesheet" href="../../src/style.css"/>
<link rel="stylesheet" href="../../src/nutrition-today.css"/><link rel="stylesheet" href="../../src/calm.css"/>
<link rel="stylesheet" href="../../src/fuel.css"/><link rel="stylesheet" href="../../src/duo.css"/>
<link rel="stylesheet" href="../../src/food-v2.css"/><link rel="stylesheet" href="../../src/food-v3.css"/>
<link rel="stylesheet" href="../../src/food-next.css"/>
<link rel="stylesheet" href="../../src/lfms-finish.css"/>
<link rel="stylesheet" href="../../src/food-neon.css"/>
</head><body><div id="app" class="app"></div>
<script type="module">
import {bootstrapHarness} from './harness.js'
import {createMemoryStorage} from '../../src/adapters/storage/memory-storage.js'
import {fixedClock} from '../../src/adapters/clock/clock.js'
import {installCalorieAiRuntime} from '../../src/ui/calorie-ai-runtime.js'
import {nutritionLedger} from '../../src/domain/nutrition.js'
const checks=[],errors=[]
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)]
const settle=ms=>new Promise(r=>setTimeout(r,ms??140))
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
 history.replaceState(null,'',location.pathname+'?food2=1')
 const storage=createMemoryStorage(),clock=fixedClock(new Date(2026,9,1,13))
 const t=await bootstrapHarness({storage,clock,mount:q('#app')})
 installCalorieAiRuntime()
 await t.app.show('fuel');await settle(110)
 q('.fn2__pills button:nth-child(2)')?.click();await settle(55)
 check('Quick Log new-user state is actionable and content-sized',
   q('.fn2__sheet-body')?.textContent.includes('No saved meals yet')
   && q('.fn2__sheet')?.getBoundingClientRect().height<window.innerHeight*0.65)
 q('.fn2__sheet-close')?.click();await settle(20)
 await t.daily.addNutrition('2026-09-29',{description:'Greek yogurt and berries',calories:160,protein:20,carbs:13,fat:2},{loggedAt:'2026-09-29T08:40:00.000Z'})
 await t.daily.addNutrition('2026-09-30',{description:'Greek yogurt and berries',calories:160,protein:20,carbs:13,fat:2},{loggedAt:'2026-09-30T08:40:00.000Z'})
 await t.daily.addNutrition('2026-10-01',{description:'Chicken and rice bowl',calories:480,protein:39,carbs:52,fat:12},{loggedAt:'2026-10-01T12:30:00.000Z'})
 await t.daily.logAt('2026-10-01','water',16)
 await t.app.show('fuel');await settle(260)
 check('Food 2.0 gated view boots without old card stack',!!q('[data-food-two="true"]')&&!q('.food-v2__energy'))
 check('calorie and protein values are canonical',q('.fn2__neo-calorie-value')?.textContent==='480'&&q('[data-macro="protein"]')?.textContent.includes('39 g'))
 const todayView=await t.daily.forDate(clock.today())
 const goals=[...(todayView.logged??[]),...(todayView.outstanding??[])]
 const goal=(id,fallback)=>Number(goals.find(x=>x.id===id)?.dailyCap)||fallback
 check('Neon Fuel reads live calorie, protein targets and remaining amount',
   q('.fn2__neo-calorie-goal')?.textContent==='of '+Math.round(goal('calories_logged',2100)).toLocaleString()+' kcal'
   && q('[data-macro="protein"]')?.textContent.includes(String(Math.round(goal('protein_target',135))))
   && q('.fn2__neo-target-bottom')?.textContent.includes(String(Math.round(goal('calories_logged',2100)-480))))
 check('only Food Library, Quick Log and Meal History shortcuts remain',
   qa('.fn2__pills button').length===3
   && qa('.fn2__pills button').map(x=>x.textContent.trim()).join('|')==='Food Library|Quick Log|Meal History')
 check('new style retains existing right-side section navigation',qa('.tabbar__tab').length===4)
 check('neon calorie frame draws four rounded progress segments',qa('.fn2__neo-perimeter-live').length===4)
 check('neon meal allocation uses real timestamped entries, not invented shares',
   qa('.fn2__neo-meal').length===4
   && qa('.fn2__neo-meal')[1]?.textContent.includes('480 kcal')
   && qa('.fn2__neo-meal')[1]?.textContent.includes('100%')
   && qa('.fn2__neo-meal').filter(x=>x.textContent.includes('0 kcal')).length===3)
 check('Close Day is inside the neon card, one real button, and Track Other remains present',
   !!q('.fn2__neo [data-diary-finish-today]')
   && qa('[data-diary-finish-today]').length===1
   && !!q('.fn2__neo-other')&&!q('.fn2__inline-actions'))
 const sheetRect=q('.fn2__neo').getBoundingClientRect()
 check('neon panel fits app horizontal viewport and keeps primary actions accessible',
   sheetRect.width>250 && sheetRect.left>=-1 && sheetRect.right<=innerWidth+1
   && q('.fn2__neo-close').getBoundingClientRect().width>=44)

 check('seven date links and four five-part macro bars',qa('.fn2__week button').length===7&&qa('.fn2__neo-nutrient').length===4&&qa('.fn2__neo-meter-segment').length===20)
 const initialStatus=(await t.daily.dayLog('2026-10-01')).nutritionStatus
 q('.fn2__neo-close').click();await settle(110)
 check('red Close Day is canonical and toggles day status',
   (await t.daily.dayLog('2026-10-01')).nutritionStatus==='complete'
   && q('.fn2__neo-close')?.textContent.includes('Reopen Day'))
 q('.fn2__neo-close').click();await settle(110)
 check('reopening is reversible and does not alter calories',
   (await t.daily.dayLog('2026-10-01')).nutritionStatus!=='complete'
   && (await t.daily.dayLog('2026-10-01')).calories===480)

 check('water is canonical data, not sample data',q('.fn2__stat:nth-child(2)')?.textContent.includes('16 oz'))
 check('steps and weight are blank when not logged',q('.fn2__stat:nth-child(3)')?.textContent.includes('—')&&q('.fn2__stat:first-child')?.textContent.includes('—'))
 check('Macro Journal is on the main Food dashboard, below the summaries',
   !!q('.fn2__macro-journal') && !!q('.fn2__stats')
   && q('.fn2__macro-journal').compareDocumentPosition(q('.fn2__stats')) & Node.DOCUMENT_POSITION_PRECEDING)
 check('Daily Macro Journal includes four sections and the real logged meal',
   qa('.fn2__macro-journal .fn2__meal-group').length===4
   && ['Breakfast','Lunch','Dinner','Snacks'].every(name=>q('.fn2__macro-journal')?.textContent.includes(name))
   && q('.fn2__macro-journal')?.textContent.includes('Chicken and rice bowl'))
 check('Glass controls are scoped to Food and preserve tappable Quick Log',
   getComputedStyle(q('.fn2__pills button')).backgroundImage.includes('linear-gradient')
   && q('.fn2__float').getBoundingClientRect().height>=44
   && q('.fn2__float').getBoundingClientRect().width>=44
   && !!q('.fn2__macro-journal-head button'))
 const floatBox=q('.fn2__float').getBoundingClientRect(),moreBox=q('.fn2__macro-journal-head button').getBoundingClientRect()
 check('Floating log button does not cover Macro Journal More action',
   floatBox.left>=moreBox.right||floatBox.right<=moreBox.left
     ||floatBox.top>=moreBox.bottom||floatBox.bottom<=moreBox.top)
 const todayRow=qa('.fn2__macro-journal .fn2__meal-row').find(r=>r.textContent.includes('Chicken and rice bowl'))
 todayRow?.querySelector('.fn2__meal-photo')?.click();await settle(60)
 check('Tapping meal thumbnail opens an actual photo picker',!!q('[data-food2-overlay="attach-photo"] input[type=file]'))
 const photoCanvas=document.createElement('canvas');photoCanvas.width=400;photoCanvas.height=300
 photoCanvas.getContext('2d').fillRect(0,0,400,300)
 const photoBlob=await new Promise(resolve=>photoCanvas.toBlob(resolve,'image/png'))
 const photoFile=new File([photoBlob],'meal.png',{type:'image/png'})
 const fileInput=q('[data-food2-overlay="attach-photo"] input[type=file]')
 const transfer=new DataTransfer();transfer.items.add(photoFile);fileInput.files=transfer.files
 fileInput.dispatchEvent(new Event('change',{bubbles:true}));await settle(300)
 const withPhoto=await t.daily.dayLog('2026-10-01')
 const entry=nutritionLedger(withPhoto).entries.find(e=>e.description==='Chicken and rice bowl')
 const attachment=withPhoto.mealPhotos?.[entry?.id]
 check('Image is compacted and stored only with the actual logged entry',
   typeof attachment==='string'&&attachment.startsWith('data:image/jpeg;base64,')
   && attachment.length<180000&&withPhoto.calories===480)
 check('Real personal photo appears on daily journal in place of illustration',
   q('.fn2__macro-journal .fn2__meal-row .fn2__thumb img')?.getAttribute('src')===attachment)
 await t.app.show('today');await settle(50);await t.app.show('fuel');await settle(100)
 check('Meal photo persists after navigating away and reopening Food',
   q('.fn2__macro-journal .fn2__meal-row .fn2__thumb img')?.getAttribute('src')===attachment)

 q('.fn2__pills button:nth-child(1)')?.click();await settle(60)
 check('saved food library reads prior logged foods',qa('.fn2__food-row').length===2&&q('.fn2__food-results')?.textContent.includes('Greek yogurt'))
 const savedFoodThumbs=qa('.fn2__food-row img')
 check('saved-food thumbnails resolve to the local offline CC0 library',
   savedFoodThumbs.length===2 && savedFoodThumbs.every(img=>new URL(img.src).pathname.includes('/art/food/'))
     && savedFoodThumbs.some(img=>img.src.endsWith('/yogurt-berries.jpg'))
     && savedFoodThumbs.some(img=>img.src.endsWith('/chicken.jpg')))
 await Promise.all(savedFoodThumbs.map(img=>img.complete ? Promise.resolve() : new Promise(done=>{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});setTimeout(done,1200)})))
 check('actual image files decode in the browser',savedFoodThumbs.length===2 && savedFoodThumbs.every(img=>img.naturalWidth>=100))

 check('Food Library has no persistent cart and uses its full width',
   !q('.fn2__cart') && !!q('.fn2__library-list') && !!q('.fn2__food-results'))
 const before=(await t.daily.dayLog('2026-10-01')).calories
 const yogurt=qa('.fn2__food-row').find(r=>r.textContent.includes('Greek yogurt'))
 yogurt?.querySelector('.fn2__add')?.click();await settle(50)
 check('tapping + opens one compact serving picker',
   q('.fn2__overlay')?.dataset.food2Overlay==='serving'
   && qa('.fn2__serving-presets button').length===8
   && q('.fn2__serving-preview')?.textContent.includes('160 kcal'))
 const servingBounds=q('.fn2__overlay .fn2__sheet')?.getBoundingClientRect()
 check('serving picker sits wholly in viewport with rounded bottom edge',
   !!servingBounds && servingBounds.top>=0 && servingBounds.bottom<=innerHeight+1
   && getComputedStyle(q('.fn2__overlay .fn2__sheet')).borderBottomLeftRadius==='24px')

 check('no food data is written when opening serving picker',
   (await t.daily.dayLog('2026-10-01')).calories===before)
 q('.fn2__sheet-close')?.click();await settle(30)
 check('cancel leaves food log unchanged',
   !q('.fn2__overlay')&&(await t.daily.dayLog('2026-10-01')).calories===before)
 const yogurtAgain=qa('.fn2__food-row').find(r=>r.textContent.includes('Greek yogurt'))
 yogurtAgain?.querySelector('.fn2__add')?.click();await settle(40)
 q('[data-serving-submit]')?.click();await settle(220)
 const day=await t.daily.dayLog('2026-10-01')
 check('direct serving picker writes through canonical nutrition service',day.calories===640&&day.proteinGrams===59,JSON.stringify({calories:day.calories,protein:day.proteinGrams}))
 check('confirm closes picker but keeps the Food Library open',!q('.fn2__overlay')&&!!q('.fn2__library-list'))
 check('newly logged food appears in actual history on reload',nutritionLedger(day).entries.length===2)
 q('.fn2__pills button:nth-child(3)')?.click();await settle(70)
 check('Meal History opens the dated new-style journal, not the old nutrition screen',
   !!q('.fn2__journal') && !!q('.fn2__title h1')?.textContent.includes('Meal History')
   && !!q('.fn2__history-nav') && !!q('.fn2__history-summary') && !q('[data-nutrition-screen]')
   && !q('.fn2__overlay') && !q('[data-nutrition-form]'))
 check('Journal shows actual saved descriptions',q('.fn2__journal')?.textContent.includes('Chicken and rice bowl'))
 const row=qa('.fn2__meal-row').find(x=>x.textContent.includes('Chicken and rice'))
 row?.querySelector('.fn2__meal-menu')?.click();await settle(35)
 check('Journal offers canonical delete with undo',q('.fn2__overlay')?.dataset.food2Overlay==='actions')
 const deleteBtn=qa('.fn2__sheet .fn2__secondary').find(x=>x.textContent.includes('Delete'))
 deleteBtn?.click();await settle(160)
 const deleted=await t.daily.dayLog('2026-10-01')
 check('deletion updates canonical totals',deleted.calories===160&&deleted.proteinGrams===20)
 check('undo action appears on journal',!!q('.fn2__undo'))
 q('.fn2__undo')?.click();await settle(150)
 const restored=await t.daily.dayLog('2026-10-01')
 check('undo restores exact canonical meal entry',restored.calories===640&&nutritionLedger(restored).entries.length===2)
 q('.fn2__history-arrow[aria-label="Previous day"]')?.click();await settle(60)
 check('Previous-day Meal History stays in new Food UI and loads prior meals',
   q('.fn2__history-date input')?.value==='2026-09-30'
   && q('.fn2__journal')?.textContent.includes('Greek yogurt and berries')
   && !q('[data-nutrition-screen]'))
 const historical=qa('.fn2__meal-row').find(x=>x.textContent.includes('Greek yogurt'))
 historical?.querySelector('.fn2__meal-menu')?.click();await settle(35)
 const historicalDelete=qa('.fn2__sheet .fn2__secondary').find(x=>x.textContent.includes('Delete'))
 historicalDelete?.click();await settle(120)
 check('Deleting historical meal changes selected date, not today',
   ((await t.daily.dayLog('2026-09-30')).calories??0)===0
   && (await t.daily.dayLog('2026-10-01')).calories===640)
 q('.fn2__undo')?.click();await settle(120)
 check('Historical Undo restores selected day without touching today',
   (await t.daily.dayLog('2026-09-30')).calories===160
   && (await t.daily.dayLog('2026-10-01')).calories===640)
 const dateInput=q('.fn2__history-date input')
 dateInput.value='2026-09-29'
 dateInput.dispatchEvent(new Event('change',{bubbles:true}))
 await settle(50)
 check('Date picker can jump to an earlier day',q('.fn2__history-date input')?.value==='2026-09-29'&&q('.fn2__journal')?.textContent.includes('Greek yogurt'))
 q('.fn2__history-today')?.click();await settle(50)
 check('Today returns to present without an old-style overlay',q('.fn2__history-date input')?.value==='2026-10-01'&&!q('[data-nutrition-screen]'))
 q('.fn2__pills button:nth-child(2)')?.click();await settle(80)
 check('Quick Log starts on the new quick choices instead of legacy menu',
   q('.fn2__overlay')?.dataset.food2Overlay==='quick' && !!q('.fn2__quick-food'))
 check('Quick Log choices have LFMS borders, not white system default buttons',
   Number.parseFloat(getComputedStyle(q('.fn2__quick-food')).borderTopWidth)===1
   && getComputedStyle(q('.fn2__quick-food')).backgroundImage.includes('linear-gradient'))
 q('.fn2__sheet .fn2__primary')?.click();await settle(220)
 check('manual food entry mounts unchanged runtime and its paste action',!!q('[data-nutrition-form]')&&!!q('[data-calorie-ai="paste"]'))
 check('meal-photo link stays in the original runtime',q('[data-calorie-ai="prompt"]')?.getAttribute('href')==='https://chatgpt.com/')
 q('.fn2__sheet-close')?.click();await settle(30)
 check('Closing Quick Log returns to Meal History without data changes',!!q('.fn2__journal')&&!q('.fn2__overlay'))
 check('A Food modal is mounted above the scrollable page, not inside it',!document.body.dataset.food2Modal)
 // User regression: while Quick Log is open, taps and scroll gestures must
 // not scroll the page behind it; closing restores normal scrolling.
 const scrolling=q('.app__body')
 q('.fn2__pills button:nth-child(2)')?.click();await settle(85)
 check('Food sheets portal outside the scrollable pane',q('.fn2__overlay')?.parentElement===document.body)
 check('Food sheet freezes underlying page scrolling',document.body.dataset.food2Modal==='true'
   && getComputedStyle(scrolling).overflowY==='hidden'
   && getComputedStyle(q('.fn2__sheet-body')).overflowY==='auto')
 q('.fn2__sheet-close')?.click();await settle(40)
 check('Closing a sheet restores page scrolling',!document.body.dataset.food2Modal
   && getComputedStyle(scrolling).overflowY!=='hidden')
 await t.app.show('today');await settle(50);await t.app.show('fuel');await settle(100)
 check('switching tabs does not replace stored food data',q('.fn2__metrics')?.textContent.includes('640'))
 // The user logged only HALF of a 200-kcal meal. Repeat must work from its
 // original 200-kcal serving, never re-multiply the already eaten 100 kcal.
 await t.daily.addNutrition('2026-10-01',{description:'Half-serving granola',calories:200,protein:16,carbs:25,fat:5,portion:.5})
 await t.app.show('today');await t.app.show('fuel');await settle(100)
 q('.fn2__pills button:nth-child(3)')?.click();await settle(60)
 const halfRow=qa('.fn2__meal-row').find(x=>x.textContent.includes('Half-serving granola'))
 halfRow?.querySelector('.fn2__meal-menu')?.click();await settle(25)
 const repeatBtn=qa('.fn2__sheet .fn2__secondary').find(x=>x.textContent.includes('Log this meal again'))
 repeatBtn?.click();await settle(60)
 check('Repeat from historical half-serving opens a one-meal serving picker',q('.fn2__overlay')?.dataset.food2Overlay==='serving'
   && qa('.fn2__serving-presets button').length===8)
 const selector=q('.fn2__serving-custom input')
 check('Serving picker starts at one serving (not an accidental quarter)',selector?.value==='1')
 selector.value='0.75'
 selector.dispatchEvent(new Event('input',{bubbles:true}));await settle(35)
 check('Historical meal restores unit value then scales to three quarters',
   q('.fn2__serving-preview')?.textContent.includes('150 kcal')
   && q('[data-serving-submit]')?.textContent.includes('0.75 serving'))
 const beforeRepeat=(await t.daily.dayLog('2026-10-01')).calories
 q('[data-serving-submit]')?.click();await settle(210)
 const afterRepeat=await t.daily.dayLog('2026-10-01')
 check('Historical repeat saves exactly 150 kcal and 12g protein',
   afterRepeat.calories-beforeRepeat===150
   && nutritionLedger(afterRepeat).entries.at(-1)?.proteinGrams===12)
 check('Portaled sheet closes after logging and restores scrolling',!q('.fn2__overlay')
   && !document.body.dataset.food2Modal)
 // Precision matters for recipes logged as a fraction of a cup/scoop.
 q('.fn2__pills button:nth-child(1)')?.click();await settle(45)
 const repeatCustom=qa('.fn2__food-row').find(x=>x.textContent.includes('Half-serving granola'))
 repeatCustom?.querySelector('.fn2__add')?.click();await settle(40)
 const input=q('.fn2__serving-custom input')
 if(input) {
   input.value='0.4166667'
   input.dispatchEvent(new Event('input',{bubbles:true}))
 }
 check('custom decimal serving is accepted without arbitrary quarter steps',
   !!q('[data-serving-submit]') && !q('[data-serving-submit]').disabled
   && q('[data-serving-submit]').textContent.includes('0.416667'))
 const beforeCustom=(await t.daily.dayLog('2026-10-01')).calories
 q('[data-serving-submit]')?.click();await settle(190)
 check('custom portion saves only after confirmation',
   (await t.daily.dayLog('2026-10-01')).calories>beforeCustom
   && !q('.fn2__overlay'))
 check('no browser runtime errors',errors.length===0,errors.join(' | '))
}catch(error){check('Food 2.0 completed',false,error?.stack??error)}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'food2-integrated',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
