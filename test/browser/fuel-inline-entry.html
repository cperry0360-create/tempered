<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tempered — meal entry on Fuel</title>
<link rel="stylesheet" href="../../src/tokens.css" /><link rel="stylesheet" href="../../src/style.css" />
<link rel="stylesheet" href="../../src/nutrition-today.css" /><link rel="stylesheet" href="../../src/calm.css" /><link rel="stylesheet" href="../../src/fuel.css" /><link rel="stylesheet" href="../../src/food-v2.css" /><link rel="stylesheet" href="../../src/food-v3.css" />
</head><body><div id="app" class="app"></div>
<script type="module">
  import { bootstrapHarness } from './harness.js'
  import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
  import { fixedClock } from '../../src/adapters/clock/clock.js'
  import { installCalorieAiRuntime } from '../../src/ui/calorie-ai-runtime.js'
  const checks = []
  const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
  const q = (s) => document.querySelector(s), qa = (s) => [...document.querySelectorAll(s)]
  const settle = (ms = 200) => new Promise((r) => setTimeout(r, ms))
  const errors = []; addEventListener('error', (e) => errors.push(e.message)); addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)))
  const type = (el, value) => { el.value = value; el.dispatchEvent(new Event('input', { bubbles: true })) }
  try {
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { async writeText() {}, async readText() { return '' } } })
    const storage = createMemoryStorage(), clock = fixedClock(new Date(2026, 9, 1, 12, 30))
    const t = await bootstrapHarness({ storage, clock, mount: q('#app') })
    installCalorieAiRuntime()
    await t.daily.addNutrition('2026-09-28', { description: 'Protein shake', calories: 160, protein: 30 }, { loggedAt: '2026-09-28T10:00:00.000Z' })
    await t.daily.addNutrition('2026-09-29', { description: 'Protein shake', calories: 160, protein: 30 }, { loggedAt: '2026-09-29T10:00:00.000Z' })
    await t.daily.addNutrition('2026-10-01', { description: 'Morning oats', calories: 300, protein: 12 }, { loggedAt: '2026-10-01T12:00:00.000Z' })
    await t.daily.setNutritionStatus('2026-09-28', 'complete')
    const profile = (await storage.get('profile', 'profile')) ?? { id: 'profile' }
    await storage.put('profile', { ...profile, nutritionReviewStartOn: '2026-09-28' })
    await t.app.show('fuel'); await settle(400)
    check("meals already logged today show in the new journal", /Morning oats/.test(q('.forge-food__journal')?.textContent ?? ''), q('.forge-food__journal')?.textContent || 'empty list')
    await t.app.show('today'); await settle(200); await t.app.show('fuel'); await settle(400)
    check("meals still show after leaving Fuel and coming back", /Morning oats/.test(q('.forge-food__journal')?.textContent ?? ''))
    check('Food logging starts closed with a visible launch action', q('[data-food-log-sheet]')?.hidden === true && Boolean(q('[data-food-open-log]')))
    q('.forge-food__nav button:last-child')?.click(); await settle(80)
    check('Log food opens the existing runtime in a focused sheet', q('[data-food-log-sheet]')?.hidden === false && Boolean(q('.forge-food__sheet [data-nutrition-form]')))
    const form = q('.screen--fuel [data-nutrition-form]')
    check('the existing add-meal form remains in Fuel sheet, no full-screen editor required', Boolean(form) && Boolean(q('.forge-food__sheet')) && !q('.nutrition-log-overlay'))
    check('Meal photo and Import copied nutrition are on Fuel', Boolean(q('.screen--fuel [data-calorie-ai="prompt"]')) && Boolean(q('.screen--fuel [data-calorie-ai="paste"]')))
    const photoLink = q('.screen--fuel [data-calorie-ai="prompt"]')
    check('Meal photo offers a browser link rather than a share sheet',
      photoLink?.tagName === 'A' && photoLink?.getAttribute('href') === 'https://chatgpt.com/'
      && photoLink?.target === '_blank')
    let sharedPrompt = null, copiedPrompt = null
    Object.defineProperty(navigator, 'share', {
      configurable: true, value: async data => { sharedPrompt = data },
    })
    Object.defineProperty(navigator, 'clipboard', {
      configurable: true, value: { async writeText(value) { copiedPrompt = value }, async readText() { return '' } },
    })
    // Browser harness must not actually leave Tempered. Intercept only the link's
    // default navigation; the photo action still runs its copy handler.
    photoLink?.addEventListener('click', event => event.preventDefault(), { once: true })
    photoLink?.click()
    await settle(100)
    check('meal-photo action copies the prompt without using the share sheet',
      copiedPrompt?.includes('TEMPERED_CALORIES=') && sharedPrompt === null
      && Boolean(q('.screen--fuel [data-nutrition-form]')))
    check('Day status is on Fuel', Boolean(q('.screen--fuel [data-nutrition-day-status]')))
    check('dashboard and food journal precede earlier-day reminder backlog',
      Boolean(q('.forge-food__canvas')) && Boolean(q('[data-open-nutrition-days]'))
      && Boolean(q('.forge-food__journal').compareDocumentPosition(q('[data-open-nutrition-days]'))
        & Node.DOCUMENT_POSITION_FOLLOWING))

    check('Food search is in the logging sheet',
      Boolean(q('.forge-food__sheet [data-food-search]')) && Boolean(q('.food-v3__search-input')))
    check('calendar has explicit review icons and calorie totals',
      qa('[data-diary-date]').length === 7
      && qa('[data-diary-date] .food-v3__day-icon').length === 7
      && qa('[data-diary-date] .food-v3__day-cal').length === 7)
    check('closed day renders green check and its actual calories',
      Boolean(q('[data-diary-date="2026-09-28"][data-visual="closed"]'))
      && q('[data-diary-date="2026-09-28"] .food-v3__day-cal')?.textContent === '160')
    check('unfinished day has amber half-circle while unlogged day has red X',
      Boolean(q('[data-diary-date="2026-09-29"][data-visual="partial"]'))
      && Boolean(q('[data-diary-date="2026-09-30"][data-visual="missed"]')))
    check('macro guidance clutter is absent',
      !q('.food-v2__macro-note') && !q('.food-v2__macro-card .food-v2__caption'))
    check('beach card is only shown close to the Thanksgiving cut, not in September',
      !q('.food-v3__beach'))
    check('seven-day review calendar is visible before the food form',
      qa('.screen--fuel [data-diary-date]').length === 7)
    check('old logged but unclosed days are retained in the review queue',
      Number(q('[data-open-nutrition-days]')?.dataset.openNutritionDays) === 2)

    check('redundant action tiles removed', qa('[data-food-action]').length === 0)
    q('.forge-food__nav button:last-child')?.click(); await settle(80)
    check('Quick log shortcut opens the sheet and focuses the retained form',
      !q('[data-food-log-sheet]')?.hidden && document.activeElement === q('[data-entry="nutrition_description"]'))
    const entryCard = q('.screen--fuel .nutrition-panel__add')
    const mealsCard = q('.screen--fuel .nutrition-panel__meals')
    const searchCard = q('.screen--fuel [data-food-search]')
    const favoritesCard = q('.screen--fuel .food-v2__recents')
    check('Food order is Search, Entry, Favorites, Today’s meals (real DOM order)',
      Boolean(searchCard && entryCard && favoritesCard && mealsCard)
      && Boolean(searchCard.compareDocumentPosition(entryCard) & Node.DOCUMENT_POSITION_FOLLOWING)
      && Boolean(entryCard.compareDocumentPosition(favoritesCard) & Node.DOCUMENT_POSITION_FOLLOWING)
      && Boolean(favoritesCard.compareDocumentPosition(mealsCard) & Node.DOCUMENT_POSITION_FOLLOWING))
    check('Close day stays accessible above the dashboard',
      Boolean(q('.forge-food__hero [data-diary-finish-today]')))
    check('AI tools appear ahead of input fields',
      Boolean(q('.nutrition-meal-form__tools')?.compareDocumentPosition(q('.nutrition-meal-form__fields')) & Node.DOCUMENT_POSITION_FOLLOWING))
    check('recent meals are reusable without a second form', Boolean(q('[data-recent-food="Protein shake"]')))
    check('real calorie, macro, water, diary and meal data remain available',
      Boolean(q('.forge-food__hero')) && qa('.forge-food__macro').length === 3
      && Boolean(q('.food-v2__water')) && Boolean(q('[data-diary-calendar]'))
      && Boolean(q('.forge-food__sheet [data-nutrition-form]')))
    check('only one composed Food dashboard', qa('.forge-food__canvas').length === 1)

    let importScrollCount = 0
    const originalScroll = form.scrollIntoView
    form.scrollIntoView = () => { importScrollCount++ }
    Object.defineProperty(navigator, 'clipboard', { configurable: true,
      value: { async writeText() {}, async readText() {
        return ['TEMPERED_DESCRIPTION=Imported lunch', 'TEMPERED_CALORIES=540',
          'TEMPERED_PROTEIN=40', 'TEMPERED_CARBS=48', 'TEMPERED_FAT=18',
          'TEMPERED_FIBER=8'].join(String.fromCharCode(10))
      } },
    })
    q('.screen--fuel [data-calorie-ai="paste"]')?.click()
    await settle(130)
    check('AI import fills and reveals the actual meal-entry form',
      form.querySelector('[data-entry="nutrition_description"]')?.value === 'Imported lunch'
      && form.querySelector('[data-entry="nutrition_calories"]')?.value === '540'
      && importScrollCount === 1)
    form.scrollIntoView = originalScroll
    type(form.querySelector('[data-entry="nutrition_description"]'), 'Turkey sandwich')
    q('.forge-food__secondary summary')?.click(); await settle(60)
    q('.fuel-r4__water-actions button')?.click(); await settle(300)
    check('half-typed meal survives a Fuel refresh (water tap)', q('.screen--fuel [data-entry="nutrition_description"]')?.value === 'Turkey sandwich')
    check('Fuel water shows custom amount alongside presets',
      qa('.fuel-r4__water-actions button').length === 4
      && Boolean(q('[data-water-custom-toggle]')))
    q('[data-water-custom-toggle]')?.click()
    check('custom water entry expands directly within the Water card',
      Boolean(q('.food-v2__water [data-water-custom-form]'))
      && document.activeElement === q('[data-water-custom-input]'))
    type(q('[data-water-custom-input]'), '0')
    q('[data-water-custom-save]')?.click(); await settle(100)
    check('invalid water amount is rejected without adding anything',
      Boolean(q('[data-water-custom-error]')?.textContent)
      && (await t.daily.dayLog('2026-10-01')).waterOz === 8)
    type(q('[data-water-custom-input]'), '17.5')
    q('[data-water-custom-save]')?.click(); await settle(300)
    const waterDay = await t.daily.dayLog('2026-10-01')
    check('custom decimal water amount adds exactly once to the day', waterDay.waterOz === 25.5, waterDay.waterOz)
    check('Water card shows fractional ounces without rounding',
      (q('.food-v2__water-main strong')?.textContent ?? '').includes('25.5 oz'))
    check('custom form closes after a successful add and meal draft survives',
      !q('[data-water-custom-form]') && q('[data-entry="nutrition_description"]')?.value === 'Turkey sandwich')

    type(q('.screen--fuel [data-entry="nutrition_calories"]'), '740')
    type(q('.screen--fuel [data-entry="nutrition_protein"]'), '38.125')
    check('nutrition fields accept more than one decimal place',
      q('.screen--fuel [data-entry="nutrition_protein"]').step === 'any'
      && q('.screen--fuel [data-entry="nutrition_protein"]').validity.valid)
    type(q('.screen--fuel [data-entry="nutrition_carbs"]'), '')
    type(q('.screen--fuel [data-entry="nutrition_fat"]'), '')
    type(q('.screen--fuel [data-entry="nutrition_fiber"]'), '')
    q('.screen--fuel [data-action="nutrition-log"]')?.click(); await settle(500)
    let day = await t.daily.dayLog('2026-10-01')
    check('Add meal preserves three-decimal protein values', day.calories === 1040 && day.proteinGrams === 50.125, `${day.calories}/${day.proteinGrams}`)
    check('the calorie hero updates on the same screen', /1,040/.test(q('.forge-food__hero')?.textContent ?? ''), q('.forge-food__hero')?.textContent.slice(0, 100))
    check("today's meals list shows it", /Turkey sandwich/.test(q('.screen--fuel [data-nutrition-history]')?.textContent ?? ''))
    check('meal timeline groups existing entries by time of day',
      Boolean(q('[data-meal-group]')) && Boolean(q('.nutrition-timeline__heading'))
      && Boolean(q('[data-meal-group] .nutrition-entry')))
    const lookup = q('.food-v3__search-input')
    type(lookup, 'Turkey sandwich')
    check('new meals are immediately searchable', Boolean(q('[data-food="Turkey sandwich"]')))
    type(lookup, '')
    q('[data-recent-food="Protein shake"]')?.click(); await settle(500)
    check("Frequent meal taps add directly to today's meals",
      (q('.screen--fuel [data-nutrition-history]')?.textContent.match(/Protein shake/g) ?? []).length === 1)

    q('.screen--fuel .nutrition-entry__delete')?.click(); await settle(400)
    check('delete offers Undo', q('.screen--fuel [data-nutrition-undo]')?.hidden === false)
    q('.screen--fuel .nutrition-undo__button')?.click(); await settle(400)
    day = await t.daily.dayLog('2026-10-01')
    check('Undo restores the meal', day.calories === 1200, day.calories)

    const search = q('.food-v3__search-input'); type(search, 'pizza'); await settle(50)
    q('[data-food-new]')?.click(); await settle(100)
    check('no-match search offers to add it, filling the form', q('.screen--fuel [data-entry="nutrition_description"]')?.value === 'pizza' && document.activeElement === q('.screen--fuel [data-entry="nutrition_calories"]'))

    q('[data-nutrition-earlier]')?.click(); await settle(300)
    check('earlier days still open the dated entry screen', Boolean(q('.nutrition-log-overlay [data-nutrition-date]')))
    q('.nutrition-log-overlay .nutrition-log-header__back')?.click(); await settle(300)
    let updates = 0; const count = () => { updates += 1 }
    addEventListener('tempered:fuel-updated', count); await settle(1500); removeEventListener('tempered:fuel-updated', count)
    check('Fuel and the meal panel do not refresh each other in a loop', updates <= 1, `${updates} updates while idle`)
    q('[data-diary-finish-today]')?.click(); await settle(300)
    day = await t.daily.dayLog('2026-10-01')
    check('a nutrition day closes only when user explicitly finishes it',
      day.nutritionStatus === 'complete' && Boolean(day.nutritionClosedAt))
    await t.daily.addNutrition('2026-10-01', { description: 'Forgotten snack', calories: 140, protein: 7 })
    day = await t.daily.dayLog('2026-10-01')
    check('correcting a previously closed diary reopens it without deleting meals',
      day.nutritionStatus === 'partial' && day.calories === 1340)
    clock.advanceDays(1)
    await t.app.show('today'); await settle(250)
    check('the next morning shows a review prompt for yesterday',
      Boolean(q('[data-nutrition-reminder-today="2026-10-01"]')))
    q('[data-review-nutrition-date="2026-10-01"]')?.click(); await settle(300)
    check('morning review opens yesterday rather than today',
      q('.nutrition-log-overlay')?.dataset.date === '2026-10-01')
    q('.nutrition-log-overlay [data-nutrition-day-state="complete"]')?.click(); await settle(350)
    day = await t.daily.dayLog('2026-10-01')
    check('closing yesterday from the review prompt persists',
      day.nutritionStatus === 'complete')
    q('.nutrition-log-overlay .nutrition-log-header__back')?.click(); await settle(160)
    await t.app.show('today'); await settle(180)
    check('closed yesterday no longer produces a morning reminder',
      !q('[data-nutrition-reminder-today]'))

    check('no runtime errors', errors.length === 0, errors.join(' | '))
  } catch (error) { check('fuel inline harness completed', false, String(error?.stack ?? error).slice(0, 900)) }
  await fetch('/__report', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ label: 'fuel-inline-entry', passed: checks.every((c) => c.ok), checks }) })
</script></body></html>
