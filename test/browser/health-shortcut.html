<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — Health Shortcut bridge</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/nutrition-today.css" />
  <link rel="stylesheet" href="../../src/pivot.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { installCalorieAiRuntime } from '../../src/ui/calorie-ai-runtime.js'
    import { installProgressDashboardRuntime } from '../../src/ui/progress-dashboard-runtime.js'
    import {
      HEALTH_SNAPSHOT_PREFIX, healthImportUrl, installHealthShortcutRuntime,
    } from '../../src/ui/health-shortcut-runtime.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s) => document.querySelector(s)
    const settle = (ms = 50) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    async function waitFor(selector, timeout = 3000) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    try {
      const clipboardSnapshot = `${HEALTH_SNAPSHOT_PREFIX}\nDATE=2026-09-08\nSTEPS=10527\nSLEEP=7.75\nWEIGHT_LB=164.2\nRESTING_HR=49\nHRV_MS=41\nRESP_RATE=12\nSPO2=97\nBODY_TEMP_C=36.4`
      const querySnapshot = `${HEALTH_SNAPSHOT_PREFIX}\nDATE=2026-09-08\nSTEPS=4321\nSLEEP=6.5\nSPO2=96%`
      Object.defineProperty(navigator, 'clipboard', {
        configurable: true,
        value: { async readText() { return clipboardSnapshot }, async writeText() {} },
      })
      const clock = fixedClock(new Date(2026, 8, 8, 10, 0, 0))
      const context = await bootstrap({ storage: createMemoryStorage(), clock, mount: q('#app') })
      installCalorieAiRuntime()
      installProgressDashboardRuntime(context)

      // Recreate the preferred Shortcuts URL handoff on the local harness URL.
      const handoff = new URL(healthImportUrl(querySnapshot, window.location.href))
      history.replaceState(null, '', `${handoff.pathname}${handoff.search}${handoff.hash}`)
      installHealthShortcutRuntime(context)
      await settle(180)
      const auto = await context.daily.dayLog('2026-09-08')
      check('URL handoff auto-imports without tapping the clipboard button', auto.steps === 4321 && auto.sleepHours === 6.5, `${auto.steps} steps · ${auto.sleepHours} h`)
      check('URL handoff preserves a percent health value', auto.healthMetrics?.spo2 === 96, auto.healthMetrics?.spo2)
      check('URL handoff removes health payload from address bar after import', !window.location.search.includes('temperedHealth'), window.location.search)

      await context.app.show('today')
      const run = await waitFor('.screen--today [data-health-bridge="run"]')
      const setup = q('.screen--today [data-health-bridge="setup"]')
      check('Today has a direct one-tap Shortcut launcher', /RUN HEALTH SYNC/i.test(run?.textContent ?? '') && /^shortcuts:/.test(run?.getAttribute('href') ?? ''), run?.getAttribute('href') ?? 'missing')
      check('Today keeps setup separate from normal sync', Boolean(setup), setup?.textContent ?? 'missing')
      const stableSnapshot = q('[data-lifestyle="snapshot"]')
      await settle(320)
      check('Health and Nutrition helpers do not rebuild the Today card while idle', q('[data-lifestyle="snapshot"]') === stableSnapshot)
      check('Health controls remain the same working DOM nodes while idle', q('.screen--today [data-health-bridge="run"]') === run && q('.screen--today [data-health-bridge="setup"]') === setup)

      setup?.click()
      const setupScreen = await waitFor('[data-health-setup-overlay]')
      check('Setup opens on the first tap as a dedicated screen', Boolean(setupScreen))
      check('Setup diagnoses the observed Calculate Statistics conversion failure', /Conversion Error/i.test(setupScreen?.textContent ?? '') && /Get Details of Health Samples/i.test(setupScreen?.textContent ?? ''))
      check('Setup makes the automatic URL handoff the normal path', /no Paste button and no second Import tap/i.test(setupScreen?.textContent ?? ''))
      check('Setup includes all five Progress body metrics', ['Resting heart rate', 'HRV', 'Respiration', 'SpO₂', 'Body temperature'].every((label) => setupScreen?.textContent?.includes(label)))
      check('Setup offers exact instructions and the Shortcut editor', Boolean(q('[data-health-bridge="recipe"]')) && Boolean(q('[data-health-bridge="create"]')))

      const manualSnapshot = `${HEALTH_SNAPSHOT_PREFIX}\nDATE=2026-09-08\nSTEPS=11,888 steps\nSLEEP=8.25 hours\nWEIGHT_LB=164.2 lb\nRESTING_HR=48 bpm\nHRV_MS=42 ms\nRESP_RATE=12 breaths/min\nSPO2=0.98\nBODY_TEMP_F=98.6 F`
      const pasteInput = q('[data-health-import-input]')
      if (pasteInput) pasteInput.value = manualSnapshot
      q('[data-health-import-submit]')?.click()
      await settle(240)
      const manual = await context.daily.dayLog('2026-09-08')
      check('Manual paste fallback imports through the canonical day log', manual.steps === 11888 && manual.sleepHours === 8.25, `${manual.steps} steps · ${manual.sleepHours} h`)
      check('Unit-formatted weight imports', manual.bodyMetrics?.weight === 164.2, manual.bodyMetrics?.weight)
      check('Body metrics populate from unit-formatted Shortcut values', manual.healthMetrics?.restingHr === 48 && manual.healthMetrics?.hrvMs === 42 && manual.healthMetrics?.respiratoryRate === 12, JSON.stringify(manual.healthMetrics))
      check('Fractional SpO2 normalizes to percent', manual.healthMetrics?.spo2 === 98, manual.healthMetrics?.spo2)
      check('Fahrenheit body temperature normalizes to Celsius', manual.healthMetrics?.bodyTempC === 37, manual.healthMetrics?.bodyTempC)
      check('Health import is identified as a Shortcuts bridge', manual.healthBridge?.source === 'shortcuts', manual.healthBridge?.source)

      // Re-importing replacement values never doubles them.
      q('[data-health-import-submit]')?.click()
      await settle(180)
      const repeated = await context.daily.dayLog('2026-09-08')
      check('Repeated Health sync does not double steps or sleep', repeated.steps === 11888 && repeated.sleepHours === 8.25, `${repeated.steps}/${repeated.sleepHours}`)

      q('[data-health-setup-close]')?.click()
      check('Health Setup closes back to the app', !q('[data-health-setup-overlay]'))

      await context.app.show('history')
      await waitFor('[data-widget="body"]')
      check('Progress Body metrics renders the imported Health values', /48/.test(q('[data-widget="body"]')?.textContent ?? '') && /42/.test(q('[data-widget="body"]')?.textContent ?? '') && /98/.test(q('[data-widget="body"]')?.textContent ?? ''), q('[data-widget="body"]')?.textContent ?? 'missing')
      check('Body metrics card is never a dead end', Boolean(q('[data-widget="body"] [data-health-setup="progress"]')))

      await context.app.show('settings')
      const settings = await waitFor('[data-health-bridge="settings"]')
      check('Settings puts a short Apple Health entry card at the top', settings?.previousElementSibling?.classList.contains('screen__title') === true, settings?.textContent ?? 'missing')
      check('Settings opens the dedicated Health Setup instead of burying the recipe', Boolean(settings?.querySelector('[data-health-bridge="setup"]')))
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Health bridge harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'health-shortcut', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
