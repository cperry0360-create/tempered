<!doctype html>
<html lang="en" data-layout="duo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS Duo kinetic gradient handoff</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/lfms-finish.css"></head><body>
<div id="app" class="app"><div class="app__body">THE READY APP</div></div>
<script type="module">
const checks=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
try{
  const parsed=new DOMParser().parseFromString(await fetch('/index.html').then(r=>r.text()),'text/html')
  const launch=document.importNode(parsed.querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const app=document.getElementById('app'),skin=launch.querySelector('.lfms-launch__skin')
  const background=getComputedStyle(document.body).backgroundColor
  check('Duo hardware edge still matches charcoal BODY with NO gradient paint on root',
    background==='rgb(16, 24, 32)'&&getComputedStyle(document.body).backgroundImage==='none')
  check('gradient is isolated to FULL-VIEWPORT launch skin',
    getComputedStyle(skin).backgroundImage.includes('radial-gradient(')
    &&getComputedStyle(skin).backgroundImage.includes('linear-gradient(')
    &&skin.getBoundingClientRect().left<=0
    &&skin.getBoundingClientRect().right>=innerWidth)
  check('real app is mounted but not shown before dismiss',
    getComputedStyle(app).opacity==='0'&&getComputedStyle(app).visibility==='hidden'
    &&app.textContent.includes('THE READY APP'))
  check('no mechanics, barbell, tearing or paper edge',!launch.querySelector('.lfms-launch__barbell-stage,.lfms-launch__plate,.lfms-launch__peel-strip,.lfms-launch__lift-tab'))
  await wait(1560)
  launch.dataset.closing='true'
  await wait(90)
  check('Duo exposes READY dashboard beneath the fading gradient skin',
    getComputedStyle(app).visibility==='visible'&&getComputedStyle(app).opacity==='1'
    &&getComputedStyle(document.body).backgroundColor===background)
  await wait(175)
  launch.remove()
  check('overlay removal preserves real app and original charcoal edge',
    getComputedStyle(app).visibility==='visible'
    &&getComputedStyle(document.body).backgroundImage==='none'
    &&app.textContent.includes('THE READY APP'))
}catch(e){check('Duo kinetic handoff harness completes',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-dumbbell-peel',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
