<!doctype html>
<html lang="en" data-layout="duo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS temporary logo launch on Duo</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/lfms-finish.css"></head><body>
<div id="app" class="app"><div class="app__body">THE READY APP</div></div>
<script type="module">
const checks=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
try {
  const source=new DOMParser().parseFromString(await fetch('/index.html').then(r=>r.text()),'text/html')
  const launch=document.importNode(source.querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const app=document.getElementById('app')
  const skin=launch.querySelector('.lfms-launch__skin')
  const before=getComputedStyle(document.body).backgroundColor
  check('Duo keeps single solid charcoal viewport',before==='rgb(16, 24, 32)'
    &&getComputedStyle(document.body).backgroundImage==='none')
  check('already rendered app stays concealed only while splash visible',
    getComputedStyle(app).visibility==='hidden'&&app.textContent.includes('THE READY APP'))
  check('the tear and weight are never part of the visible scene',
    getComputedStyle(launch.querySelector('.lfms-launch__barbell-stage')).display==='none'
    &&getComputedStyle(skin).animationName==='none')
  launch.dataset.closing='true'
  await wait(80)
  check('closing logo reveals the real app, without any torn panel',
    getComputedStyle(app).visibility==='visible'&&getComputedStyle(app).opacity==='1'
    &&!launch.querySelector('.lfms-launch__peel-strip')
    &&getComputedStyle(document.body).backgroundColor===before)
  await wait(240)
  launch.remove()
  check('removal keeps real app visible and unaltered',getComputedStyle(app).visibility==='visible'
    &&app.textContent.includes('THE READY APP'))
}catch(e){check('Duo no-tear handoff checks complete',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-dumbbell-peel',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
