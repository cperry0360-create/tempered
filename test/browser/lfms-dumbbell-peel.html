<!doctype html>
<html lang="en" data-layout="duo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS Duo live-app red-white-blue barbell zipper handoff</title>
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/lfms-finish.css">
</head><body>
<div id="app" class="app"><div class="app__body">THE READY APP</div></div>
<script type="module">
const checks=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
try{
  const source=new DOMParser().parseFromString(await fetch('/index.html').then(r=>r.text()),'text/html')
  const launch=document.importNode(source.querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const app=document.querySelector('#app.app')
  const bg=getComputedStyle(document.body).backgroundColor
  check('Duo maintains original solid charcoal, no gradient seam',
    bg==='rgb(16, 24, 32)'&&getComputedStyle(document.body).backgroundImage==='none')
  check('app remains hidden behind loading splash until actual wipe',
    getComputedStyle(app).visibility==='hidden'&&getComputedStyle(app).opacity==='0')
  const bar=launch.querySelector('.lfms-launch__barbell-stage')
  const skin=launch.querySelector('.lfms-launch__skin')
  const tear=launch.querySelector('.lfms-launch__tear-edge')
  const flap=launch.querySelector('.lfms-launch__peel-flap')
  launch.dataset.revealing='true'
  await wait(70)
  check('reveal makes real app visible BEFORE mask finishes',
    getComputedStyle(app).visibility==='visible'&&getComputedStyle(app).opacity==='1')
  check('TOP-RIGHT peel clips the skin, not the falling silver bar',
    getComputedStyle(skin).animationName==='lfms-corner-peel'
    &&getComputedStyle(bar).animationName==='lfms-loaded-scrape'
    &&getComputedStyle(tear).animationName==='lfms-tear-follow'
    &&getComputedStyle(flap).animationName==='lfms-peel-flap'
    &&!skin.contains(bar)
    &&getComputedStyle(launch).clipPath==='none')
  const start=getComputedStyle(skin).clipPath
  const barStart=bar.getBoundingClientRect()
  const xStart=parseFloat(getComputedStyle(bar).left)
  await wait(650)
  const middle=getComputedStyle(skin).clipPath
  const barLater=bar.getBoundingClientRect()
  const xLater=parseFloat(getComputedStyle(bar).left)
  check('top-right wrapper tears diagonally while loaded barbell falls rightward',
    start!==middle&&middle.startsWith('polygon(')
    &&barLater.top>barStart.top+20
    &&xLater>xStart)
  check('the barbell remains outside the clipped wrapper during its fall',
    !skin.contains(bar)&&getComputedStyle(bar).opacity==='1')
  check('reveal never repaints root charcoal as a blue gradient',
    getComputedStyle(document.body).backgroundColor===bg
    &&getComputedStyle(document.body).backgroundImage==='none')
  launch.dataset.closing='true'
  launch.remove()
  check('removal leaves same fully-visible app without clearing its DOM',
    getComputedStyle(app).visibility==='visible'
    &&app.textContent.includes('THE READY APP'))
}catch(error){check('zipper handoff harness finishes',false,error.stack??String(error))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-dumbbell-peel',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
