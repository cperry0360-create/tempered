<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS kinetic gradient launch acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/brand.css"></head><body>
<div id="app" class="app">READY DASHBOARD</div>
<script type="module">
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
window.addEventListener('error',e=>errors.push(e.message))
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
  const html=await fetch('/index.html').then(r=>r.text())
  const launch=document.importNode(new DOMParser().parseFromString(html,'text/html').querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const mark=launch.querySelector('.lfms-launch__mark')
  const words=[...launch.querySelectorAll('.lfms-launch__wordmark')]
  const sweep=launch.querySelector('.lfms-launch__sweep')
  const flash=launch.querySelector('.lfms-launch__flash')
  const lockline=launch.querySelector('.lfms-launch__lockline')
  const skin=launch.querySelector('.lfms-launch__skin')
  const identity=launch.querySelector('.lfms-launch__identity')
  await Promise.all([mark,...words].map(x=>x.decode()))
  check('same approved LFMS mark and both genuine wordmark halves load',mark.naturalWidth>0&&words.length===2&&words.every(x=>x.naturalWidth>0))
  check('Kinetic mountain and longer words stage on independent timelines',
    getComputedStyle(mark).animationName==='lfms-kinetic-mark'
    &&getComputedStyle(words[0]).animationName==='lfms-kinetic-less'
    &&getComputedStyle(words[1]).animationName==='lfms-kinetic-strong'
    &&getComputedStyle(words[0]).animationDelay==='0.65s'
    &&getComputedStyle(words[1]).animationDelay==='0.81s'
    &&getComputedStyle(words[0]).animationDuration==='1.26s'
    &&getComputedStyle(words[1]).animationDuration==='1.31s')
  check('one kinetic red streak and one single-pass signature beam',
    Boolean(sweep)&&getComputedStyle(sweep).animationName==='lfms-kinetic-sweep'
    &&Boolean(flash)&&getComputedStyle(flash).animationName==='lfms-brand-flash'
    &&launch.querySelectorAll('.lfms-launch__sweep').length===1
    &&!launch.querySelector('.lfms-launch__barbell-stage,.lfms-launch__lift-tab,.lfms-launch__plate,.lfms-launch__peel-strip'))
  check('full-bleed dark-to-navy stage belongs to SKIN, not root',
    getComputedStyle(skin).backgroundImage.includes('radial-gradient(')
    &&getComputedStyle(skin).backgroundImage.includes('linear-gradient(')
    &&getComputedStyle(launch).backgroundImage==='none')
  // Sample the actual mid-animation motion, not only its finished CSS.
  await wait(740)
  const wordStage=launch.querySelector('.lfms-launch__wordmark-stage').getBoundingClientRect()
  const flyingLess=words[0].getBoundingClientRect(),flyingStrong=words[1].getBoundingClientRect()
  check('original opposite-screen swoops are visible midflight',
    flyingLess.left<wordStage.left-50&&flyingStrong.left>wordStage.right+50,
    JSON.stringify({stageLeft:wordStage.left,stageRight:wordStage.right,lessLeft:flyingLess.left,strongLeft:flyingStrong.left}))
  await wait(1700)
  check('cinematic lock-in adds a short red beam without obscuring the logo',
    Number(getComputedStyle(flash).opacity)>.2
    &&getComputedStyle(launch.querySelector('.lfms-launch__wordmark-stage')).animationName==='lfms-wordmark-lock')
  await wait(1520)
  const bounds=identity.getBoundingClientRect(),viewport=innerWidth
  check('logo settled and fitting in viewport',bounds.left>=-3&&bounds.right<=viewport+3&&bounds.top>=-3&&bounds.bottom<=innerHeight+3,
    JSON.stringify({x:bounds.left,right:bounds.right,top:bounds.top,bottom:bounds.bottom,viewport}))
  check('bright LESS FAT and MORE STRONG are both visible before handoff',
    words.every(x=>Number(getComputedStyle(x).opacity)>.99))
  check('red flash, final lockline and tagline have resolved before the hero hold',
    Number(getComputedStyle(sweep).opacity)<.02
    &&Number(getComputedStyle(flash).opacity)<.02
    &&Number(getComputedStyle(lockline).opacity)>.98
    &&Number(getComputedStyle(launch.querySelector('.lfms-launch__tagline')).opacity)>.7)
  launch.dataset.closing='true'
  await wait(365)
  check('fade reveals ready app without geometry tearing',Number(getComputedStyle(launch).opacity)<.02
    &&document.getElementById('app').textContent.includes('READY DASHBOARD'))
  check('no console errors',errors.length===0,errors.join(' | '))
  launch.remove()
}catch(e){check('kinetic launch harness finished',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-splash',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
