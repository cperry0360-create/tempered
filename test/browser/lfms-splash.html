<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS glass sweep and live Today flying-mountain acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/brand.css">
<style>
  #app {position:fixed;inset:0;background:#101820;color:#fff}
  #app .screen--today {position:relative;height:100%}
  #app .lfms-main-brand__mark {position:absolute;left:27px;top:26px;width:34px;height:28px;object-fit:contain}
</style></head><body>
<div id="app" class="app"><section class="screen--today">READY DASHBOARD
<img class="lfms-main-brand__mark" src="../../branding/lfms/logo-mark.svg" alt="">
</section></div>
<script type="module">
import { runBrandHandoff,LFMS_HANDOFF_MS } from '../../src/ui/lfms-launch-handoff.js'
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
window.addEventListener('error',e=>errors.push(e.message))
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try {
  const html=await fetch('/index.html').then(r=>r.text())
  const launch=document.importNode(new DOMParser().parseFromString(html,'text/html').querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const mark=launch.querySelector('.lfms-launch__mark')
  const wordmark=launch.querySelector('.lfms-launch__wordmark')
  const cracks=launch.querySelector('.lfms-launch__cracks')
  const shards=launch.querySelector('.lfms-launch__shards')
  const sweeper=launch.querySelector('.lfms-launch__sweeper')
  const tool=launch.querySelector('.lfms-launch__sweeper-tool')
  const skin=launch.querySelector('.lfms-launch__skin')
  const destination=document.querySelector('.lfms-main-brand__mark')
  await Promise.all([mark,wordmark,destination].map(x=>x.decode()))
  check('official mountain and genuine wordmark decode',
    mark.naturalWidth>0&&wordmark.naturalWidth>0)
  check('screen opens with native glass art and no rejected red cut',
    cracks&&shards&&sweeper&&tool
    &&launch.querySelectorAll('.lfms-launch__sweeper-arm').length===2
    &&!launch.querySelector('.lfms-launch__flash,.lfms-launch__cinema,.lfms-launch__barbell-stage,.lfms-launch__peel-strip'))
  check('deep gradient stays wholly on branded launch skin',
    getComputedStyle(skin).backgroundImage.includes('radial-gradient(')
    &&getComputedStyle(skin).backgroundImage.includes('linear-gradient('))
  check('approved timing is wired to impact, pile and slow sweeper',
    getComputedStyle(mark).animationName==='lfms-glass-mark-slam'
    &&getComputedStyle(wordmark).animationName==='lfms-glass-wordmark'
    &&getComputedStyle(cracks.querySelector('path')).animationName==='lfms-glass-crack'
    &&getComputedStyle(shards).animationName==='lfms-glass-pile'
    &&getComputedStyle(sweeper).animationName==='lfms-glass-sweeper'
    &&getComputedStyle(tool).animationName==='lfms-glass-tool')
  const drop=mark.getAnimations()[0]
  drop.pause()
  drop.currentTime=150
  const stage=launch.querySelector('.lfms-launch__mark-stage').getBoundingClientRect()
  const giant=mark.getBoundingClientRect()
  check('mountain is visibly descending toward its impact point',
    giant.top<stage.top&&giant.bottom<stage.bottom&&giant.width>=stage.width*.95,
    JSON.stringify({markTop:giant.top,stageTop:stage.top,markWidth:giant.width,stageWidth:stage.width}))
  drop.play()
  await wait(800)
  check('cracks appear at impact and the wordmark resolves cleanly',
    Number(getComputedStyle(cracks.querySelector('path')).opacity)>.08
    &&Number(getComputedStyle(wordmark).opacity)>.5)
  await wait(920)
  const firstSweep=sweeper.getBoundingClientRect()
  check('rounded two-arm figure enters with a real broom after shards land',
    firstSweep.left<innerWidth*.55
    &&launch.querySelectorAll('.lfms-launch__sweeper-arm').length===2
    &&!!launch.querySelector('.lfms-launch__broom-head'))
  await wait(2570)
  check('three deliberate pushes finish with sweeper and glass off screen',
    sweeper.getBoundingClientRect().left>innerWidth
    &&shards.getBoundingClientRect().left>innerWidth*.75
    &&Number(getComputedStyle(wordmark).opacity)>.98)
  const source=mark.getBoundingClientRect(),target=destination.getBoundingClientRect()
  const flight=runBrandHandoff(launch)
  await wait(220)
  const traveling=document.querySelector('[data-lfms-flying-mark]')
  const mid=traveling?.getBoundingClientRect()
  check('live shared mark moves toward REAL app header, not a fake dashboard',
    LFMS_HANDOFF_MS===720&&!!traveling&&launch.dataset.closing==='true'
    &&destination.style.visibility==='hidden'
    &&mid&&Math.hypot(mid.top-source.top,mid.left-source.left)>20,
    JSON.stringify({from:[source.left,source.top],mid:[mid?.left,mid?.top],to:[target.left,target.top]}))
  const used=await flight
  check('flight completes and hands visibility back to the ACTUAL Today mountain',
    used===true&&!document.querySelector('[data-lfms-flying-mark]')
    &&destination.style.visibility!=='hidden')
  check('no exceptions and underlying dashboard never replaced',errors.length===0
    &&document.getElementById('app').textContent.includes('READY DASHBOARD'),errors.join(' | '))
  launch.remove()
}catch(e){check('glass-sweep acceptance completes',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({label:'lfms-splash',passed:checks.every(c=>c.ok),checks})})
</script></body></html>
