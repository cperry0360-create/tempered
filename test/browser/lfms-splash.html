<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LFMS calm logo-only splash</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/brand.css"></head><body>
<div id="app" class="app">READY DASHBOARD</div>
<script type="module">
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
window.addEventListener('error',e=>errors.push(e.message))
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
  const html=await fetch('/index.html').then(r=>r.text())
  const launch=document.importNode(new DOMParser().parseFromString(html,'text/html').querySelector('[data-lfms-launch]'),true)
  for(const img of launch.querySelectorAll('img')) img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
  document.body.append(launch)
  const mark=launch.querySelector('.lfms-launch__mark')
  const words=[...launch.querySelectorAll('.lfms-launch__wordmark')]
  const logo=launch.querySelector('.lfms-launch__identity')
  const skin=launch.querySelector('.lfms-launch__skin')
  const bar=launch.querySelector('.lfms-launch__barbell-stage')
  await Promise.all([mark,...words].map(x=>x.decode()))
  check('original LFMS mountain and wordmark render',mark.naturalWidth>0&&words.every(x=>x.naturalWidth>0))
  check('temporary intro is clean and quiet',getComputedStyle(logo).animationName==='lfms-clean-brand-enter'
      &&getComputedStyle(mark).animationName==='none'
      &&words.every(x=>getComputedStyle(x).animationName==='none'))
  check('no equipment or tear animation can be seen',getComputedStyle(bar).display==='none'
      &&getComputedStyle(launch.querySelector('.lfms-launch__lift-tab')).display==='none'
      &&getComputedStyle(launch.querySelector('.lfms-launch__glow')).display==='none'
      &&getComputedStyle(skin).clipPath.startsWith('inset('))
  check('live dashboard is mounted below splash',document.getElementById('app').textContent.includes('READY DASHBOARD'))
  await wait(750)
  check('logo remains legible and inside the viewport',logo.getBoundingClientRect().height>70
    &&logo.getBoundingClientRect().top>=-2
    &&logo.getBoundingClientRect().bottom<=innerHeight+2)
  launch.dataset.closing='true'
  await wait(300)
  check('clean short fade completes and reveals app',getComputedStyle(launch).opacity==='0'
    &&document.getElementById('app').textContent.includes('READY DASHBOARD'))
  check('no browser errors',errors.length===0,errors.join(' | '))
  launch.remove()
}catch(e){check('temporary splash harness finished',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-splash',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
