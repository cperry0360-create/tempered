<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LFMS quiet launch acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/brand.css">
<style>#app{position:fixed;inset:0;background:var(--lfms-duo-canvas);color:white}</style></head><body>
<div id="app">READY DASHBOARD</div>
<script type="module">
const checks=[];const check=(name,ok)=>checks.push({name,ok:Boolean(ok)})
const wait=ms=>new Promise(r=>setTimeout(r,ms))
try {
 const html=await fetch('/index.html').then(r=>r.text())
 const launch=document.importNode(new DOMParser().parseFromString(html,'text/html').querySelector('[data-lfms-launch]'),true)
 for(const img of launch.querySelectorAll('img'))img.src=new URL(img.getAttribute('src'),location.origin+'/index.html').href
 document.body.append(launch)
 await Promise.all([...launch.querySelectorAll('img')].map(img=>img.decode()))
 await wait(550)
 check('both official logos decode and become visible',[...launch.querySelectorAll('img')].every(img=>img.naturalWidth>0&&Number(getComputedStyle(img).opacity)>.99))
 check('no character, glass or impact geometry',!launch.querySelector('svg,[data-lfms-emoji-sweep]')&&launch.querySelectorAll('img').length===2)
 const mark=launch.querySelector('.lfms-launch__mark'),before=mark.getBoundingClientRect()
 await wait(80)
 const after=mark.getBoundingClientRect()
 check('logo stays in place during its fade',Math.abs(before.top-after.top)<1&&Math.abs(before.left-after.left)<1)
 check('complete logo stays inside the viewport',[...launch.querySelectorAll('img')].every(img=>{const r=img.getBoundingClientRect();return r.left>=0&&r.right<=innerWidth+1&&r.top>=0&&r.bottom<=innerHeight+1}))
 launch.dataset.closing='true';await Promise.all(launch.getAnimations().map(animation=>animation.finished))
 check('quiet exit fades fully without a flying clone',Number(getComputedStyle(launch).opacity)<.01&&!document.querySelector('[data-lfms-flying-mark]'))
 launch.remove()
 check('underlying app remains intact',document.getElementById('app').textContent==='READY DASHBOARD')
}catch(e){checks.push({name:'launch acceptance completes',ok:false,detail:String(e)})}
const result={label:'lfms-splash',passed:checks.every(c=>c.ok),checks}
const summary=document.createElement('pre');summary.id='harness-result';summary.textContent=JSON.stringify(result);document.body.append(summary)
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(result)})
</script></body></html>
