<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFMS Today visual and interaction acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/style.css">
<link rel="stylesheet" href="../../src/nutrition-today.css">
<link rel="stylesheet" href="../../src/calm.css">
<link rel="stylesheet" href="../../src/duo.css">
<link rel="stylesheet" href="../../src/refined-ui.css">
<link rel="stylesheet" href="../../src/food-next.css">
<link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/today-next.css">
</head><body><div id="app" class="app"></div>
<script type="module">
import {bootstrapHarness} from './harness.js'
import {createMemoryStorage} from '../../src/adapters/storage/memory-storage.js'
import {fixedClock} from '../../src/adapters/clock/clock.js'
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const q=s=>document.querySelector(s)
const qa=s=>[...document.querySelectorAll(s)]
window.addEventListener('error',e=>errors.push(e.message))
window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
 const storage=createMemoryStorage(),clock=fixedClock(new Date(2026,9,1,12))
 const t=await bootstrapHarness({storage,clock,mount:q('#app'),initialTab:'today'})
 await t.app.show('today')
 check('Today opens with the approved Food visual theme',!!q('.today--fuel-style'))
 check('One compact calendar strip, not duplicate week cards',qa('[data-section=week]').length===1&&qa('.today-week__day').length===7)
 check('Hero uses canonical actual daily values, not sample placeholders',!!q('.today2__hero')&&q('.today2__hero')?.textContent.includes('Sessions logged')&&q('.today2__hero')?.textContent.includes('Working sets'))
 check('Dual concentric rings encode habits and training',qa('.today2__rings circle').length===4&&q('.today2__rings svg')?.getAttribute('aria-label')?.includes('Daily habits'))
 check('Three Food-style progress bars remain real values',qa('.today2__barline [role=progressbar]').length===3)
 check('Brand mark is loaded from existing LFMS artwork',q('.lfms__today-mark')?.src.includes('/branding/lfms/logo-mark.svg'))
 check('Four action pills include working section destinations',qa('.today2__pills button').length===4)
 check('Original workout, week, Fuel, and daily-log sections remain intact',
  !!q('[data-section=next-session]')&&!!q('[data-section=week]')&&!!q('[data-section=fuel]')&&!!q('[data-section=daily]'))
 check('Recovery card retains import/recovery behavior',!!q('[data-section=readiness]'))
 // Two prior readings plus today's lower HRV produce a real Recover state.
 // Check computed colors, not just the presence of the new CSS selectors.
 for(const date of ['2026-09-29','2026-09-30']) {
   await storage.put('dayLogs',{...await t.daily.dayLog(date),
     healthMetrics:{hrvMs:40,restingHr:62}})
 }
 await storage.put('dayLogs',{...await t.daily.dayLog('2026-10-01'),
   healthMetrics:{hrvMs:27,restingHr:64}})
 await t.app.show('today')
 const recover=q('.today-readiness__summary[data-readiness-label="recover"]')
 const recoveryDial=recover?.querySelector('.today-readiness__dial')
 const lowStatus=q('.today-readiness__metric[data-tone="low"] small')
 check('Readiness still labels a low score Recover from real logged health data',
   !!recover&&!!recoveryDial&&!!lowStatus)
 check('Recover uses LFMS blue and navy instead of the legacy orange ring',
   !!recoveryDial
   && getComputedStyle(recoveryDial).backgroundImage.includes('conic-gradient')
   && !getComputedStyle(recoveryDial).backgroundImage.includes('232, 131, 58')
   && getComputedStyle(recover.querySelector('.today-readiness__verdict strong')).color
      ===getComputedStyle(q('.today-readiness__import')).color
   && getComputedStyle(lowStatus).color===getComputedStyle(q('.today-readiness__import')).color)

 for(const b of qa('.today2__pills button')){b.click()}
 check('Shortcuts do not throw or leave Today',!!q('.today--fuel-style'))
 const prev=await t.daily.dayLog('2026-10-01')
 await t.daily.addNutrition('2026-10-01',{description:'Test chicken bowl',calories:375,protein:35,carbs:39,fat:9})
 await t.app.show('today')
 const next=await t.daily.dayLog('2026-10-01')
 check('Canonical calories update dashboard hero after logging',next.calories===(prev?.calories??0)+375&&q('.today2__hero')?.textContent.includes('375'))
 check('Canonical food stats update existing Fuel card',q('[data-section=fuel]')?.textContent.includes('375'))
 // The approved continuous canvas now applies to all four main Duo tabs.
 document.documentElement.dataset.layout='duo'
 const app=q('#app'),today=q('.today--fuel-style'),rail=q('.tabbar')
 check('Duo Today background is one continuous blue-black gradient',
   getComputedStyle(app).backgroundImage.includes('radial-gradient')
   && getComputedStyle(app).backgroundImage.includes('linear-gradient'))
 check('Duo Today content and outer gutter share the same canvas',
   getComputedStyle(today).backgroundColor==='rgba(0, 0, 0, 0)'
   && getComputedStyle(q('.app__body')).backgroundColor==='rgba(0, 0, 0, 0)')
 check('Duo floating rail has only a frosted capsule, no solid backdrop',
   getComputedStyle(rail).backgroundColor==='rgba(0, 0, 0, 0)'
   && getComputedStyle(rail).backgroundImage==='none'
   && getComputedStyle(rail.querySelector('.tabbar__tabs')).backgroundImage.includes('linear-gradient'))
 check('Duo rail has four circular icons, all with accessible names',
   qa('.tabbar__tab').length===4
   && qa('.tabbar__tab').every(x=>x.getAttribute('aria-label') && x.getBoundingClientRect().height>=44))
 const originalTabs=qa('.tabbar__tab')
 check('Duo nav labels are prepared for press-and-hold',
   originalTabs.every(x=>x.dataset.label?.length))

 const initialCanvas=getComputedStyle(app).backgroundImage
 for(const tab of ['train','fuel','history','today']) {
   await t.app.show(tab)
   check(tab+' uses continuous navy canvas with transparent screen',
     getComputedStyle(app).backgroundImage===initialCanvas
     && getComputedStyle(q('.app__body > .screen')).backgroundColor==='rgba(0, 0, 0, 0)')
   check(tab+' preserves original rail button DOM nodes',
     qa('.tabbar__tab').every((button,i)=>button===originalTabs[i]))
 }
 const topButton=qa('.tabbar__tab')[0]
 topButton.dispatchEvent(new PointerEvent('pointerdown',{pointerId:91,button:0,bubbles:true,clientY:topButton.getBoundingClientRect().top+22}))
 await new Promise(resolve=>setTimeout(resolve,350))
 check('Long press lifts a glass icon and reveals label styling',
   q('.tabbar__tabs')?.dataset.holding==='true'
   && topButton.dataset.peek==='true'
   && getComputedStyle(topButton,'::after').content.includes('Today'))
 topButton.dispatchEvent(new PointerEvent('pointercancel',{pointerId:91,bubbles:true}))
 check('Cancelling press restores capsule state',!q('.tabbar__tabs')?.dataset.holding)
 await Promise.all([t.app.show('train'),t.app.show('fuel'),t.app.show('today')])
 check('Rapid tab changes settle on the latest requested screen',
   !!q('.app__body > .today--fuel-style')
   && q('[data-tab="today"]')?.dataset.active==='true'
   && qa('.tabbar__tab').every((button,i)=>button===originalTabs[i]))
 check('No runtime errors or unhandled rejections',errors.length===0,errors.join(' | '))
}catch(e){check('Today Food-style test completes',false,e.stack)}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-today-style',passed:checks.every(c=>c.ok),checks})})
</script></body></html>
