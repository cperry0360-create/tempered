<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFMS Train Food-style design and canonical workflow acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/style.css">
<link rel="stylesheet" href="../../src/calm.css">
<link rel="stylesheet" href="../../src/duo.css">
<link rel="stylesheet" href="../../src/refined-ui.css">
<link rel="stylesheet" href="../../src/food-next.css">
<link rel="stylesheet" href="../../src/brand.css">
<link rel="stylesheet" href="../../src/today-next.css">
<link rel="stylesheet" href="../../src/train-next.css">
</head><body><div id="app" class="app"></div>
<script type="module">
import { bootstrapHarness } from './harness.js'
import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
import { fixedClock } from '../../src/adapters/clock/clock.js'
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)]
const wait=ms=>new Promise(r=>setTimeout(r,ms||60))
addEventListener('error',e=>errors.push(e.message))
addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
 const storage=createMemoryStorage(),clock=fixedClock(new Date(2026,8,9,12))
 const t=await bootstrapHarness({storage,clock,mount:q('#app')})
 await t.app.show('train')
 check('Train opens in the approved LFMS visual theme',!!q('.train--fuel-style'))
 check('Logo uses bundled vector asset, never an external request',q('.train2__logo')?.src.endsWith('/branding/lfms/logo-mark.svg'))
 check('Train has four working shortcuts',qa('.train2__pills button').length===4)
 check('Real-data training hero has two labeled stats',qa('.train2__metric').length===2&&q('.train2__hero')?.textContent.includes('Training days')&&q('.train2__hero')?.textContent.includes('Working sets'))
 check('Concentric training-progress rings are accessible',qa('.train2__rings circle').length===4&&q('.train2__rings svg')?.getAttribute('aria-label')?.includes('Training days'))
 check('Three progress bars are derived from canonical rhythm/program',qa('.train2__barline [role=progressbar]').length===3)
 check('Active program and program switch remain available',!!q('[data-active-program=true]')&&!!q('[data-action=open-program-library]'))
 check('Existing planned sessions and separate Preview actions remain',qa('[data-preview-day]').length>0&&qa('.train-r4__quick-start').length>0)
 check('Live exercise data remains in routines and library',!!q('[data-exercise-library=open]'))
 check('Real workout-queue action remains available',!!q('[data-section=next-session] [data-startday]'))
 const current=Number(q('.train2__metric--blue strong')?.textContent??-1)
 const date='2026-09-09', sessionId='lfms-train-test'
 await storage.put('sessions',{id:sessionId,date,startedAt:date+'T09:00:00.000Z',endedAt:date+'T09:35:00.000Z',programDayId:'wednesday'})
 await storage.put('setLogs',{id:'lfms-train-set',sessionId,exerciseId:'squat',programDayId:'wednesday',reps:8,weight:100,isWarmup:false,completedAt:date+'T09:20:00.000Z'})
 await t.app.show('train')
 check('Overview working sets update from stored set logs',Number(q('.train2__metric--blue strong')?.textContent)===current+1)
 check('Training metrics never fabricate a second storage layer',q('.train2__hero')?.textContent.includes(String(current+1)))
 const initialSessions=(await storage.getAll('sessions')).length
 q('.train2__pills button:nth-child(2)')?.click();await wait()
 check('Rhythm shortcut opens original interactive rhythm history',!!q('.train-r4__subheader')&&!!q('[data-away-toggle]'))
 q('.train-r4__back')?.click();await wait()
 q('.train2__pills button:nth-child(3)')?.click();await wait()
 check('Exercises shortcut opens real exercise library',!!q('input.search')&&!!q('.libraryrow'))
 q('.train-r4__back')?.click();await wait()
 const first=q('[data-preview-day]')
 first?.click();await wait()
 check('Existing workout preview still opens without logging',!!q('[data-start-preview]')&&!!q('.train-r5__plan-preview'))
 check('Navigation does not create session records',(await storage.getAll('sessions')).length===initialSessions)
 check('No browser exceptions or promise errors',errors.length===0,errors.join(' | '))
}catch(e){check('Train integration completes',false,e.stack)}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'lfms-train-style',passed:checks.every(c=>c.ok),checks})})
</script></body></html>
