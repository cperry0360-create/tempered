<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — mobile interaction smoke</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/setup.css" />
  <link rel="stylesheet" href="../../src/cadence.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/battle.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/battle-fidelity.css" />
  <link rel="stylesheet" href="../../src/character-rpg.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

    const checks = []
    const runtimeErrors = []
    const check = (name, ok, detail = '') => {
      checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
      return Boolean(ok)
    }
    const q = (selector, root = document) => root?.querySelector?.(selector) ?? null
    const qa = (selector, root = document) => root?.querySelectorAll ? [...root.querySelectorAll(selector)] : []
    const settle = (ms = 60) => new Promise((resolve) => setTimeout(resolve, ms))

    window.addEventListener('error', (event) => {
      runtimeErrors.push(`error: ${event.message || event.error || 'unknown'}`)
    })
    window.addEventListener('unhandledrejection', (event) => {
      runtimeErrors.push(`rejection: ${event.reason?.stack || event.reason || 'unknown'}`)
    })

    async function installShippedInlineCss() {
      const html = await fetch('../../index.html').then((response) => response.text())
      const matches = [...html.matchAll(/<style>([\s\S]*?)<\/style>/gi)]
      for (const match of matches) {
        const style = document.createElement('style')
        style.textContent = match[1]
        document.head.append(style)
      }
    }

    function isVisible(node) {
      if (!node || node.disabled) return false
      const style = getComputedStyle(node)
      const rect = node.getBoundingClientRect()
      return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) !== 0
        && rect.width > 0 && rect.height > 0
    }

    function labelFor(node) {
      return node?.getAttribute?.('aria-label') || node?.textContent?.replace(/\s+/g, ' ').trim().slice(0, 60)
        || node?.dataset?.action || node?.dataset?.tab || node?.className || node?.tagName || 'unknown'
    }

    async function scrollControlIntoView(node) {
      if (!node) return
      const scroller = q('.app__body')
      if (!scroller || getComputedStyle(node).position === 'fixed') return
      const before = node.getBoundingClientRect()
      const viewport = scroller.getBoundingClientRect()
      scroller.scrollTop += before.top - viewport.top - (viewport.height / 2) + (before.height / 2)
      await settle(35)
    }

    function hitInfo(node) {
      const rect = node.getBoundingClientRect()
      const x = rect.left + rect.width / 2
      const y = rect.top + rect.height / 2
      const onscreen = x >= 0 && x < innerWidth && y >= 0 && y < innerHeight
      const top = onscreen ? document.elementFromPoint(x, y) : null
      const owner = top?.closest?.('button, a, input, select, textarea, [role="button"]')
      const hit = onscreen && (top === node || node.contains(top) || owner === node)
      return { rect, x, y, onscreen, top, owner, hit }
    }

    async function centerHit(node, label, { click = false } = {}) {
      if (!node) {
        check(`${label}: control exists`, false, 'selector returned null')
        return false
      }
      await scrollControlIntoView(node)
      const info = hitInfo(node)
      check(`${label}: center is actually tappable`, info.hit,
        info.hit
          ? `${Math.round(info.rect.width)}×${Math.round(info.rect.height)} at ${Math.round(info.x)},${Math.round(info.y)}`
          : (!info.onscreen
              ? `could not scroll into viewport: top ${Math.round(info.rect.top)}, bottom ${Math.round(info.rect.bottom)}`
              : `blocked by ${info.top?.tagName || 'nothing'}.${info.top?.className || ''}`))
      if (info.hit && click) {
        info.owner?.click?.() ?? node.click()
        await settle(120)
      }
      return info.hit
    }

    async function scanButtons(screenName, root = document) {
      const buttons = qa('button', root).filter(isVisible)
      const blocked = []
      const small = []
      for (const button of buttons) {
        await scrollControlIntoView(button)
        const info = hitInfo(button)
        if (!info.hit) blocked.push(`${labelFor(button)} -> ${info.onscreen ? labelFor(info.top) : 'offscreen'}`)
        if (info.rect.width < 44 || info.rect.height < 44) {
          small.push(`${labelFor(button)} ${Math.round(info.rect.width)}×${Math.round(info.rect.height)}`)
        }
      }
      check(`${screenName}: every enabled button center is hit-testable`, blocked.length === 0,
        blocked.length ? blocked.slice(0, 12).join(' | ') : `${buttons.length} buttons checked`)
      // Touch-size is diagnostic rather than a hard failure. Several icon-only
      // controls intentionally sit beside a much larger tappable row, but this
      // inventory tells us when too much of the screen depends on precision taps.
      check(`${screenName}: touch-target inventory captured`, true,
        `${buttons.length} buttons; ${small.length} under 44px${small.length ? `: ${small.slice(0, 8).join(' | ')}` : ''}`)
    }

    async function tapTab(id) {
      const button = q(`.tabbar__tab[data-tab="${id}"]`)
      const ok = await centerHit(button, `Tab ${id}`, { click: true })
      if (!ok) return false
      const screen = await waitFor(`.screen--${id === 'history' ? 'history' : id}`)
      check(`Tab ${id}: navigation changed the visible screen`, Boolean(screen), screen?.className || '')
      return Boolean(screen)
    }

    async function waitFor(selector, timeout = 4000) {
      const deadline = Date.now() + timeout
      while (Date.now() < deadline) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    try {
      await installShippedInlineCss()
      const storage = createMemoryStorage()
      const tempered = await bootstrapHarness({ storage, mount: q('#app'), initialTab: 'today' })
      await waitFor('.screen--today')

      check('viewport is phone-class', innerWidth <= 560, `${innerWidth}×${innerHeight}`)
      check('Today loads', Boolean(q('.screen--today')))
      await scanButtons('Today', q('.screen--today'))

      const quick = q('.screen--today .today-item__quick')
      const activityId = quick?.closest?.('[data-activity]')?.dataset.activity
      const metaBefore = activityId ? q(`[data-activity="${activityId}"] .today-item__meta`)?.textContent ?? '' : ''
      await centerHit(quick, 'Today one-tap quick add', { click: true })
      const metaAfter = activityId ? q(`[data-activity="${activityId}"] .today-item__meta`)?.textContent ?? '' : ''
      check('Today quick add changes the logged value in one tap', Boolean(activityId) && metaAfter !== metaBefore,
        `${activityId || 'none'}: ${metaBefore} -> ${metaAfter}`)

      const expand = activityId ? q(`[data-activity="${activityId}"] .today-item__expand`) : null
      await centerHit(expand, 'Today details chevron', { click: true })
      check('Today chevron opens its numeric editor', Boolean(activityId && q(`[data-editor="${activityId}"]`)))
      await centerHit(activityId ? q(`[data-activity="${activityId}"] .today-item__expand`) : null,
        'Today details close', { click: true })
      check('Today chevron closes its editor', !activityId || !q(`[data-editor="${activityId}"]`))

      await tapTab('train')
      await scanButtons('Train', q('.screen--train'))
      const exercise = q('.libraryrow')
      await centerHit(exercise, 'First exercise row', { click: true })
      const session = await waitFor('.screen--session')
      check('Exercise row opens a workout session', Boolean(session))
      if (session) await scanButtons('Workout session', session)
      await tempered.app.show('train')
      await settle()

      await tapTab('character')
      await scanButtons('Character', q('.screen--character'))
      const firstAttribute = q('[data-attr]')
      const attrId = firstAttribute?.dataset.attr
      await centerHit(firstAttribute, 'Character attribute', { click: true })
      check('Character attribute expands from a real tap', Boolean(attrId && q(`[data-detail="${attrId}"]`)))
      const battleButton = q('[data-open="battle"]')
      await centerHit(battleButton, 'Character Enter Battle', { click: true })
      const battle = await waitFor('.screen--battle')
      check('Enter Battle opens the battle screen', Boolean(battle))
      if (battle) {
        await scanButtons('Battle', battle)
        await centerHit(q('[data-action="skip"]'), 'Battle Skip', { click: true })
        const done = await waitFor('[data-battle="close"]')
        await centerHit(done, 'Battle Done', { click: true })
        check('Battle Done returns to Character', Boolean(await waitFor('.screen--character')))
      }

      await tapTab('history')
      await scanButtons('Progress', q('.screen--history'))
      await centerHit(q('[data-view="habits"]'), 'Progress Habits segment', { click: true })
      check('Progress segment changes state', q('[data-view="habits"][data-active="true"]') !== null)
      await centerHit(q('.progress-range__button'), 'Progress range button', { click: true })
      check('Progress range keeps one selected range', qa('.progress-range__button[data-active="true"]').length === 1)

      await tapTab('today')
      await centerHit(q('.settings-access'), 'Settings gear', { click: true })
      const settings = await waitFor('.screen--settings')
      check('Settings gear opens Settings', Boolean(settings))
      if (settings) await scanButtons('Settings', settings)
      await centerHit(q('.settings-access'), 'Settings gear close', { click: true })
      check('Settings gear closes Settings', Boolean(await waitFor('.screen--today')))

      check('No uncaught runtime errors or unhandled rejections during the smoke journey', runtimeErrors.length === 0,
        runtimeErrors.join(' | ') || 'none')

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'mobile-ui-smoke', passed: checks.every((entry) => entry.ok), checks }),
      })
    } catch (error) {
      checks.push({ name: 'mobile UI smoke harness threw', ok: false, detail: String(error?.stack ?? error).slice(0, 800) })
      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'mobile-ui-smoke', passed: false, checks }),
      })
    }
  </script>
</body>
</html>
