<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — mobile interaction smoke</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/setup.css" />
  <link rel="stylesheet" href="../../src/cadence.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/battle.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/battle-fidelity.css" />
  <link rel="stylesheet" href="../../src/character.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { installWaterQuickPresets } from '../../src/ui/water-quick-presets.js'
    import { installMobileInteractions } from '../../src/ui/mobile-interactions.js'

    const checks = []
    const runtimeErrors = []
    const q = (selector, root = document) => root?.querySelector?.(selector) ?? null
    const qa = (selector, root = document) => root?.querySelectorAll ? [...root.querySelectorAll(selector)] : []
    const settle = (ms = 30) => new Promise((resolve) => setTimeout(resolve, ms))
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })

    window.addEventListener('error', (event) => runtimeErrors.push(`error: ${event.message || event.error || 'unknown'}`))
    window.addEventListener('unhandledrejection', (event) => runtimeErrors.push(`rejection: ${event.reason?.stack || event.reason || 'unknown'}`))

    async function installInlineCss() {
      const html = await fetch('../../index.html').then((response) => response.text())
      for (const match of html.matchAll(/<style>([\s\S]*?)<\/style>/gi)) {
        const style = document.createElement('style')
        style.textContent = match[1]
        document.head.append(style)
      }
    }

    async function waitFor(selector, timeout = 3000) {
      const deadline = Date.now() + timeout
      while (Date.now() < deadline) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    function targetSize(node) {
      if (!node) return null
      const rect = node.getBoundingClientRect()
      return { width: rect.width, height: rect.height }
    }

    function minTargetInventory(name, root) {
      const tooSmall = qa('button:not(:disabled)', root).filter((button) => {
        const style = getComputedStyle(button)
        const rect = button.getBoundingClientRect()
        if (!button.isConnected || style.display === 'none' || style.visibility === 'hidden' || rect.width <= 0 || rect.height <= 0) return false
        return rect.width < 43.5 || rect.height < 43.5
      }).map((button) => {
        const rect = button.getBoundingClientRect()
        return `${button.getAttribute('aria-label') || button.textContent.replace(/\s+/g, ' ').trim().slice(0, 32)} ${Math.round(rect.width)}×${Math.round(rect.height)}`
      })
      check(`${name}: independent buttons are finger-sized`, tooSmall.length === 0, tooSmall.slice(0, 8).join(' | '))
    }

    async function hit(node, name, { click = false } = {}) {
      if (!node) { check(`${name}: exists`, false, 'missing'); return false }
      node.scrollIntoView({ block: 'center', inline: 'nearest' })
      await settle(40)
      const rect = node.getBoundingClientRect()
      const x = rect.left + rect.width / 2
      const y = rect.top + rect.height / 2
      const top = x >= 0 && x < innerWidth && y >= 0 && y < innerHeight ? document.elementFromPoint(x, y) : null
      const owner = top?.closest?.('button, input, select, textarea, [role="button"]')
      const ok = node.isConnected && (top === node || node.contains(top) || owner === node)
      check(`${name}: finger can hit center`, ok, ok ? `${Math.round(rect.width)}×${Math.round(rect.height)}` : `blocked by ${top?.tagName || 'offscreen'}.${top?.className || ''}`)
      if (ok && click) {
        ;(owner ?? node).click()
        await settle(120)
      }
      return ok
    }

    async function tapTab(id) {
      const button = q(`.tabbar__tab[data-tab="${id}"]`)
      if (!await hit(button, `${id} tab`, { click: true })) return false
      const screen = await waitFor(`.screen--${id === 'history' ? 'history' : id}`)
      check(`${id} tab opens screen`, Boolean(screen))
      return Boolean(screen)
    }

    async function report() {
      check('no uncaught runtime errors', runtimeErrors.length === 0, runtimeErrors.join(' | ') || 'none')
      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'mobile-ui-smoke', passed: checks.every((entry) => entry.ok), checks }),
      })
    }

    try {
      await installInlineCss()
      installWaterQuickPresets()
      installMobileInteractions()
      const storage = createMemoryStorage()
      const tempered = await bootstrapHarness({ storage, mount: q('#app'), initialTab: 'today' })
      await tempered.daily.setCadence('water', 'daily')
      await tempered.app.show('today')
      await settle(150)

      check('phone-class viewport', innerWidth <= 560, `${innerWidth}×${innerHeight}`)
      const today = await waitFor('.screen--today')
      check('Today renders', Boolean(today))
      minTargetInventory('Today', today)

      const prevWeek = q('.today-calendar__nav', today)
      const prevSize = targetSize(prevWeek)
      check('calendar arrow is at least 44×44', prevSize?.width >= 43.5 && prevSize?.height >= 43.5, prevSize && `${Math.round(prevSize.width)}×${Math.round(prevSize.height)}`)

      const waterGroup = await waitFor('[data-activity="water"] [data-water-row-presets="true"]')
      const waterButtons = qa('.today-item__quick', waterGroup)
      check('Water has +8, +12 and custom quick adds', waterButtons.length === 3, waterButtons.map((button) => button.textContent.trim()).join(' | '))
      const waterBefore = q('[data-activity="water"] .today-item__meta')?.textContent ?? ''
      await hit(waterButtons[0], 'Water +8', { click: true })
      await settle(250)
      const waterAfter = q('[data-activity="water"] .today-item__meta')?.textContent ?? ''
      check('Water +8 changes total in one tap', waterAfter !== waterBefore, `${waterBefore} -> ${waterAfter}`)
      await hit(q('[data-activity="water"] .today-item__expand'), 'Water details', { click: true })
      check('Water details opens editor', Boolean(await waitFor('[data-editor="water"]')))
      await hit(q('[data-activity="water"] .today-item__expand'), 'Water details close', { click: true })
      check('Water details closes editor', !q('[data-editor="water"]'))

      await tapTab('train')
      const train = q('.screen--train')
      minTargetInventory('Train', train)
      const libraryRow = q('.libraryrow', train)
      await hit(libraryRow, 'exercise library row', { click: true })
      const session = await waitFor('.screen--session')
      check('exercise row opens workout', Boolean(session))
      if (session) {
        minTargetInventory('Workout', session)
        const number = q('.setrow__num[data-field]', session)
        if (number) {
          number.value = '135'
          number.focus()
          number.click()
          await settle(80)
          check('existing weight is selected for replacement', number.selectionStart === 0 && number.selectionEnd === 3, `${number.selectionStart}..${number.selectionEnd}`)
          number.blur()
        } else check('existing weight is selected for replacement', false, 'no numeric set field')
      }
      await tempered.app.show('train')

      await tapTab('character')
      const character = q('.screen--character')
      minTargetInventory('Character', character)
      const attr = q('[data-attr]', character)
      const attrId = attr?.dataset.attr
      await hit(attr, 'character attribute', { click: true })
      check('attribute expands', Boolean(attrId && q(`[data-detail="${attrId}"]`)))
      await hit(q('[data-open="battle"]'), 'open battle', { click: true })
      const battle = await waitFor('.screen--battle')
      check('battle opens', Boolean(battle))
      if (battle) {
        minTargetInventory('Battle', battle)
        await hit(q('[data-action="skip"]'), 'battle Skip', { click: true })
        const done = await waitFor('[data-battle="close"]')
        await hit(done, 'battle Done', { click: true })
        check('battle returns to Character', Boolean(await waitFor('.screen--character')))
      }

      await tapTab('history')
      const progress = q('.screen--history')
      minTargetInventory('Progress', progress)
      await hit(q('[data-view="habits"]', progress), 'Progress Habits', { click: true })
      check('Progress Habits becomes active', Boolean(q('[data-view="habits"][data-active="true"]')))
      await hit(q('.progress-range__button', progress), 'Progress range', { click: true })

      await tapTab('today')
      await hit(q('.settings-access'), 'Settings gear', { click: true })
      const settings = await waitFor('.screen--settings')
      check('Settings opens', Boolean(settings))
      if (settings) {
        minTargetInventory('Settings', settings)
        await hit(q('.setup__cadence', settings), 'Settings cadence button')
      }
      await hit(q('.settings-access'), 'Settings close', { click: true })
      check('Settings closes to Today', Boolean(await waitFor('.screen--today')))

      await report()
    } catch (error) {
      checks.push({ name: 'mobile smoke completed without throwing', ok: false, detail: String(error?.stack ?? error).slice(0, 800) })
      await report()
    }
  </script>
</body>
</html>
