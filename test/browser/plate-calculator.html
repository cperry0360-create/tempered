<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../src/style.css"><link rel="stylesheet" href="../../src/calm.css"></head><body><div id="app"></div><script type="module">
import { bootstrapHarness } from './harness.js'
import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
import { fixedClock } from '../../src/adapters/clock/clock.js'
const checks = []
const check = (name, ok) => checks.push({ name, ok: Boolean(ok) })
const q = (selector) => document.querySelector(selector)
const settle = () => new Promise((resolve) => setTimeout(resolve, 80))
const input = (selector, value) => { const node = q(selector); node.value = value; node.dispatchEvent(new Event('input', { bubbles: true })) }
try {
  const storage = createMemoryStorage()
  const tempered = await bootstrapHarness({ storage, clock: fixedClock('2026-10-15T12:00:00Z'), mount: q('#app') })
  check('calculator is available on Train', Boolean(q('[data-open-plate-calculator]')))
  q('[data-open-plate-calculator]').click()
  input('[data-plate-target]', '145')
  check('145 lb shows 45 and 5 per side', q('[data-plate-result]').textContent.includes('45 + 5') && q('[data-plate-total]').textContent.includes('145'))
  input('[data-plate-target]', '46')
  check('unreachable total reports closest available load', q('[data-plate-total]').textContent.includes('45') && q('.plate-calculator__note').textContent.includes('Closest'))
  input('[data-plate-target]', '')
  check('blank weight cannot appear as a valid calculation', q('[data-plate-total]').textContent.includes('—'))
  input('[data-plate-target]', '30')
  check('weight below the bar is explained', q('.plate-calculator__note').textContent.includes('45'))
  input('[data-plate-target]', '145')
  q('[data-plate-mode="build"]').click()
  check('switching direction carries the current loading', q('[data-plate-total]').textContent.includes('145'))
  q('[data-plate-clear]').click()
  q('[data-plate-add="45"]').click()
  q('[data-plate-add="5"]').click()
  check('adding a 45 and 5 a side makes 145 lb', q('[data-plate-total]').textContent.includes('145'))
  q('[data-plate-remove="5"]').click()
  check('removing a pair recalculates to 135 lb', q('[data-plate-total]').textContent.includes('135'))
  input('[data-plate-bar]', '35')
  check('custom bar recalculates both directions', q('[data-plate-total]').textContent.includes('125'))
  q('[data-plate-add="1.25"]').scrollIntoView({ block: 'center' })
  await settle()
  const small = q('[data-plate-add="1.25"]').getBoundingClientRect()
  check('small plate controls remain tappable when scrolled', document.elementFromPoint(small.x + small.width / 2, small.y + small.height / 2)?.closest('[data-plate-add="1.25"]'))
  const stickyTotal = q('[data-plate-total]').getBoundingClientRect()
  check('live total stays visible while building the bar', stickyTotal.top >= 0 && stickyTotal.bottom < innerHeight)
  q('[data-plate-mode="target"]').click()
  check('switching back carries the calculated total', q('[data-plate-target]').value === '125')
  q('[data-plate-close]').click()
  await settle()
  check('close returns focus to the calculator link', document.activeElement?.matches('[data-open-plate-calculator]'))
  q('[data-exercise-library]').click()
  check('library keeps the calculator available', Boolean(q('[data-open-plate-calculator]')))
  await tempered.app.startSession({ exerciseId: 'squat_bb' })
  const beforeInputs = [...document.querySelectorAll('.screen--session input')].map((node) => node.value).join('|')
  q('[data-open-plate-calculator]').click()
  check('calculator opens over an active session', q('dialog[open]') && q('.sessionbar'))
  q('[data-plate-close]').click()
  await settle()
  const header = q('.sessionbar')
  const scroll = header.closest('.app__body')
  if (scroll) scroll.scrollTop = 1000
  await settle()
  const rect = q('[data-open-plate-calculator]').getBoundingClientRect()
  check('session calculator stays visible after scrolling', rect.top >= 0 && rect.bottom < innerHeight)
  check('calculator never creates a logged set', (await storage.getAll('setLogs')).length === 0)
  check('calculator never changes prescribed or entered workout values', [...document.querySelectorAll('.screen--session input')].map((node) => node.value).join('|') === beforeInputs)
} catch (error) { checks.push({ name: 'plate calculator journey', ok: false, detail: String(error.stack) }) }
await fetch('/__report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: 'plate-calculator', passed: checks.every((check) => check.ok), checks }) })
</script></body></html>
