<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — configurable Progress dashboard</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/pivot.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { installProgressDashboardRuntime } from '../../src/ui/progress-dashboard-runtime.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s) => document.querySelector(s)
    const qa = (s) => [...document.querySelectorAll(s)]
    const settle = (ms = 60) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    async function waitFor(selector, timeout = 3000) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      return null
    }

    try {
      const storage = createMemoryStorage()
      const clock = fixedClock(new Date(2026, 8, 8, 9, 0, 0))
      const context = await bootstrap({ storage, clock, mount: q('#app') })
      installProgressDashboardRuntime(context)
      await context.app.show('history')
      await settle(160)
      check('R5 Progress renders the approved overview', Boolean(q('.progress-r5__weekly')))
      check('Legacy configurable dashboard is absent from the R5 surface', !q('[data-progress-dashboard]'))
      check('Overview contains Weekly sets, Recent PRs and Trends',
        ['Weekly sets', 'Recent PRs', 'Trends'].every((label) => qa('.progress-r5__card-title').some((node) => node.textContent === label)))
      check('Progress uses Overview, Lifts, Habits and Log', qa('.progress-r5__segments [data-view]').map((node) => node.textContent).join('|') === 'Overview|Lifts|Habits|Log')
      check('Progress has no horizontal overflow', document.documentElement.scrollWidth <= innerWidth + 1, `${document.documentElement.scrollWidth}/${innerWidth}`)
      check('No runtime error or rejection', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Progress R5 harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'progress-dashboard', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
