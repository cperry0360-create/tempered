<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFMS Progress Intelligence acceptance</title>
<link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/style.css">
<link rel="stylesheet" href="../../src/duo.css"><link rel="stylesheet" href="../../src/lfms-finish.css">
<link rel="stylesheet" href="../../src/progress.css"><link rel="stylesheet" href="../../src/progress-next.css">
</head><body><div id="app" class="app"></div>
<script type="module">
import {bootstrapHarness} from './harness.js'
import {createMemoryStorage} from '../../src/adapters/storage/memory-storage.js'
import {fixedClock} from '../../src/adapters/clock/clock.js'
const checks=[],errors=[]
const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms))
const q=s=>document.querySelector(s)
addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try {
  const copied=[]
  Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>copied.push(text)}})
  const storage=createMemoryStorage(),clock=fixedClock(new Date(2026,10,6,11,0))
  const t=await bootstrapHarness({storage,clock,mount:q('#app')})
  const before=(await storage.getAll('dayLogs')).length
  await t.daily.addNutrition('2026-11-05',{description:'Chicken with rice',calories:1875,protein:145,carbs:170,fat:54},{loggedAt:'2026-11-05T18:00:00.000Z'})
  await t.daily.setNutritionStatus('2026-11-05','complete')
  await t.daily.logAt('2026-11-05','creatine')
  await t.daily.logAt('2026-11-05','other_supplements')
  await t.daily.logAt('2026-11-05','water',80)
  await t.daily.logAt('2026-11-06','creatine')
  await t.daily.logAt('2026-11-06','water',90)
  await t.daily.logAt('2026-11-06','body_metrics',165.5)
  await t.app.show('history')
  await wait(160)
  check('local HTML report and optional copy action stay within LFMS layout',!!q('[data-copy-intelligence="true"]')
    &&!!q('[data-open-html-intelligence="true"]')
    &&!q('[data-download-intelligence="true"]')&&!q('.progress-report__intro')&&!q('.progress-report__privacy')
    &&q('[data-copy-intelligence="true"]')?.textContent.trim()==='Copy prompt + data')
  const initialLogs=JSON.stringify(await storage.getAll('dayLogs'))
  q('[data-copy-intelligence="true"]')?.click()
  await wait(350)
  const prompt=copied[0]??''
  check('ChatGPT prompt asks for a fresh interactive HTML dashboard with evidence-backed AI insights',
    prompt.length>2200&&prompt.includes('AI-GENERATED INTERACTIVE PROGRESS DASHBOARD')
    &&prompt.includes('INTERACTIVE HTML dashboard')
    &&prompt.includes('clickable top navigation')
    &&prompt.includes('AI judgment')
    &&prompt.includes('CALORIE')
    &&prompt.includes('STRENGTH')
    &&prompt.includes('Do NOT paste HTML source'))
  check('clipboard has zero blank rows or trailing whitespace',
    !prompt.includes('\n\n')&&prompt.endsWith('}')
    &&!(/\s$/.test(prompt))&&prompt.split('\n').length<25)
  check('payload contains actual meals, habits and body measurements',
    prompt.includes('Chicken with rice')&&prompt.includes('"weight":165.5')
    &&prompt.includes('"creatineTaken":true')&&prompt.includes('"otherSupplementsTaken":true'))
  check('payload has all four periods plus prior periods and adherence coverage',
    prompt.includes('"priorPeriods":')&&prompt.includes('"periods":')
    &&prompt.includes('"7":')&&prompt.includes('"14":')&&prompt.includes('"30":')&&prompt.includes('"90":')
    &&prompt.includes('"eligibleDays":2'))
  const report=JSON.parse(prompt.slice(prompt.lastIndexOf('\n')+1))
  check('full clipboard retains scoring methodology and training-grade evidence',
    !!report.trainingScore
    &&Array.isArray(report.trainingScore.methodology)
    &&Array.isArray(report.trainingScore.skippedWeeks)
    &&report.trainingScore.currentWeek?.week==='2026-11-02')
  check('report never changes any dayLogs or user goals',
    JSON.stringify(await storage.getAll('dayLogs'))===initialLogs)
  check('copy feedback is short, without text-heavy marketing copy',
    q('.progress-report__status')?.textContent==='Copied. Paste into ChatGPT to create your AI dashboard.')
  q('[data-open-html-intelligence="true"]')?.click()
  await wait(100)
  const overlay=q('.lfms-intelligence-overlay')
  const frame=overlay?.querySelector('iframe')
  check('private on-device HTML viewer opens with report tabs',
    !!overlay&&frame?.srcdoc.includes('data-page="strength"')
    &&frame?.srcdoc.includes('Chicken')===false
    &&frame?.srcdoc.includes('165.5'))
  check('HTML viewer offers a download and a close button',
    [...(overlay?.querySelectorAll('button')??[])].map(x=>x.textContent).join('|')==='Save HTML|Close')
  overlay?.querySelector('button:last-child')?.click()
  check('HTML viewer closes cleanly',!q('.lfms-intelligence-overlay')&&document.documentElement.style.overflow!=='hidden')
  check('HTML opens without modifying saved records',JSON.stringify(await storage.getAll('dayLogs'))===initialLogs)
  check('weekly recap entry point remains intact',!!q('[data-open-weekly-recap="true"]'))
  check('no JavaScript exceptions',errors.length===0,errors.join(' | '))
}catch(e){check('Progress Intelligence browser suite completed',false,e.stack??String(e))}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({label:'progress-intelligence',passed:checks.every(x=>x.ok),checks})})
</script></body></html>
