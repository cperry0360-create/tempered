<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — Progress overview</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (selector, root = document) => root?.querySelector?.(selector) ?? null
    const qa = (selector, root = document) => root?.querySelectorAll ? [...root.querySelectorAll(selector)] : []
    const settle = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms))

    try {
      const storage = createMemoryStorage()
      const clock = fixedClock(new Date(2026, 8, 7, 20, 0, 0))
      const app = await bootstrap({ storage, clock, mount: q('#app') })
      await storage.put('sessions', {
        id: 'recap-session', date: '2026-09-07', startedAt: '2026-09-07T18:00:00',
        endedAt: '2026-09-07T18:45:00', durationMinutes: 45,
      })
      await storage.put('setLogs', {
        id: 'recap-set', sessionId: 'recap-session', exerciseId: 'curl_db',
        weight: 20, reps: 10, completedAt: '2026-09-07T18:15:00', setIndex: 0,
      })
      await app.app.show('history')
      await settle(140)

      const screen = q('.screen--progress')
      const range = q('.progress-range__select', screen)
      check('Progress opens on a dedicated surface', Boolean(screen))
      check('the selected range defaults to 30D', range?.value === '30', range?.value)
      check('range control meets the tap target minimum', range?.getBoundingClientRect().height >= 44)
      check('overview is the selected first view', q('[data-view="overview"]', screen)?.getAttribute('aria-pressed') === 'true')
      check('overview begins with the eight-week Working sets chart', q('.progress-weekly__bars .progress-weekly__bar', screen) !== null && qa('.progress-weekly__bar', screen).length === 8)
      check('overview includes Recent PRs and Trends', /Recent PRs/.test(screen?.textContent ?? '') && /Trends/.test(screen?.textContent ?? ''))
      check('Trends includes Weight, Steps and Sleep', ['Weight', 'Steps', 'Sleep'].every((label) => qa('.progress-trend__label', screen).some((node) => node.textContent === label)))
      check('sparse history is explained in sentence case', /Showing 1 of 30 days since tracking began\./.test(screen?.textContent ?? ''))
      check('Recovery stays hidden without samples', !qa('.progress-panel__title', screen).some((node) => node.textContent === 'Recovery'))
      check('no horizontal scrolling is introduced', document.documentElement.scrollWidth <= document.documentElement.clientWidth, `${document.documentElement.scrollWidth}/${document.documentElement.clientWidth}`)
    } catch (error) {
      check('Progress overview harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'progress-recap', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
