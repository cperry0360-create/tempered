<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Tempered — release visual</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/setup.css" />
  <link rel="stylesheet" href="../../src/program-builder.css" />
  <link rel="stylesheet" href="../../src/cadence.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/nutrition-today.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
  <link rel="stylesheet" href="../../src/ux-fixes.css" />
  <link rel="stylesheet" href="../../src/companion.css" />
  <link rel="stylesheet" href="../../src/pivot.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrap } from '../../src/app/bootstrap.js'
    import { bootstrapHarness } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const view = new URL(location.href).searchParams.get('view') ?? 'today'
    const mount = document.querySelector('#app')
    localStorage.clear()
    const clock = fixedClock((view === 'today' || view === 'session') ? new Date(2026, 8, 29, 9, 0, 0) : new Date(2026, 8, 7, 9, 0, 0))
    const route = { today: 'today', train: 'train', fuel: 'fuel', progress: 'history' }

    async function installShippedInlineCss() {
      const html = await fetch('../../index.html').then((response) => response.text())
      for (const match of html.matchAll(/<style>([\s\S]*?)<\/style>/gi)) {
        const style = document.createElement('style')
        style.textContent = match[1]
        document.head.append(style)
      }
    }

    async function settle() {
      await document.fonts?.ready
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
      await new Promise((resolve) => setTimeout(resolve, 120))
    }

    async function report(ok, error = '') {
      document.documentElement.dataset.visualReady = String(ok)
      await fetch('/__visual-ready', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ view, ok, error }),
      })
    }

    async function seedTodayReference(storage) {
      const profile = await storage.get('profile', 'profile')
      await storage.put('profile', {
        ...(profile ?? { id: 'profile' }),
        setupComplete: true,
        companionName: 'Tank',
        companionStyle: 'turtle',
        companionRevealedLevel: 10,
      })

      const states = await storage.getAll('programState')
      for (const state of states) {
        if (state.active) await storage.put('programState', { ...state, startedOn: '2026-09-07' })
      }

      for (let offset = 7; offset >= 1; offset -= 1) {
        const date = new Date(2026, 8, 29 - offset, 12, 0, 0)
        const key = [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, '0'),
          String(date.getDate()).padStart(2, '0'),
        ].join('-')
        await storage.put('dayLogs', {
          date: key,
          sleepHours: 7.6,
        })
      }
      await storage.put('dayLogs', {
        date: '2026-09-29',
        sleepHours: 7.9,
        calories: 0,
        proteinGrams: 0,
        healthMetrics: { restingHr: 60, hrvMs: 27.6 },
      })

      for (const [sessionIndex, setCount] of [20, 21].entries()) {
        const sessionId = `visual-week-session-${sessionIndex + 1}`
        await storage.put('sessions', {
          id: sessionId,
          date: '2026-09-28',
          startedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:00:00`,
          endedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:59:00`,
          durationMinutes: 59,
          durationMinutesSource: 'manual',
        })
        for (let setIndex = 0; setIndex < setCount; setIndex += 1) {
          await storage.put('setLogs', {
            id: `${sessionId}-set-${setIndex + 1}`,
            sessionId,
            exerciseId: sessionIndex ? 'row_cable' : 'lat_pulldown_wide',
            reps: 8,
            weight: sessionIndex ? 130 : 115,
            isWarmup: false,
            completedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:${String(Math.min(58, setIndex * 2)).padStart(2, '0')}:00`,
          })
        }
      }
    }


    async function seedFuelReference(storage) {
      await storage.put('profile', {
        id: 'profile',
        setupComplete: true,
        calorieTarget: 2100,
      })
      await storage.put('dayLogs', {
        date: '2026-09-07',
        calories: 0,
        proteinGrams: 0,
        carbsGrams: 0,
        fatGrams: 0,
        fiberGrams: 0,
        waterOz: 0,
      })
      const recent = [
        ['2026-09-06', 'Greek yogurt + berries', 220, 20, 28, 3, 5],
        ['2026-09-05', 'Chicken rice bowl', 640, 45, 72, 18, 6],
        ['2026-09-04', 'Protein shake', 160, 30, 6, 2, 1],
      ]
      for (const [date, description, calories, proteinGrams, carbsGrams, fatGrams, fiberGrams] of recent) {
        await storage.put('dayLogs', {
          date,
          nutritionLedgerVersion: 1,
          nutritionCarryover: {},
          nutritionEntries: [{
            id: `visual-${date}`,
            loggedAt: `${date}T12:00:00.000Z`,
            source: 'manual',
            description,
            calories,
            proteinGrams,
            carbsGrams,
            fatGrams,
            fiberGrams,
          }],
          calories,
          proteinGrams,
          carbsGrams,
          fatGrams,
          fiberGrams,
          nutritionLogged: true,
          caloriesLogged: true,
        })
      }
    }

    async function seedSessionReference(storage) {
      await seedTodayReference(storage)
      await storage.put('sessions', {
        id: 'visual-rdl-history',
        date: '2026-09-17',
        startedAt: '2026-09-17T09:00:00.000Z',
        endedAt: '2026-09-17T09:40:00.000Z',
      })
      for (let index = 0; index < 3; index += 1) {
        await storage.put('setLogs', {
          id: `visual-rdl-history-${index}`,
          sessionId: 'visual-rdl-history',
          exerciseId: 'rdl',
          method: 'Barbell',
          setIndex: index,
          weight: 125,
          reps: 12,
          isWarmup: false,
          completedAt: `2026-09-17T09:${String(5 + index).padStart(2, '0')}:00.000Z`,
        })
      }
    }

    async function prepareSessionReference(tempered) {
      await tempered.app.show('train')
      await settle()
      const library = mount.querySelector('[data-exercise-library="open"]')
      if (!library) throw new Error('Exercise library entry missing')
      library.click()
      await settle()
      const rdl = mount.querySelector('[data-exercise="rdl"]')
      if (!rdl) throw new Error('RDL library row missing')
      rdl.click()
      await settle()
      const card = mount.querySelector('[data-exercise="rdl"]')
      if (!card) throw new Error('RDL session card missing')
      if (!card.querySelector('.exercise__art .exercise__thumb')) throw new Error('RDL photo missing')
      if (!card.querySelector('.plates')) throw new Error('RDL plate line missing')
      const weight = card.querySelector('[data-field="weight"]')
      const reps = card.querySelector('[data-field="reps"]')
      if (!weight?.value || !reps?.value) throw new Error('RDL prescription is not prefilled')
      clock.set(new Date(2026, 8, 29, 9, 23, 14))
      await settle()
    }

    try {
      await installShippedInlineCss()
      const storage = createMemoryStorage()
      if (view === 'setup-welcome' || view === 'setup-rhythm' || view === 'setup-plan') {
        await bootstrap({ storage, clock, mount })
        if (view === 'setup-rhythm') {
          mount.querySelector('.setup__next')?.click()
        }
        if (view === 'setup-plan') {
          for (let index = 0; index < 3; index += 1) mount.querySelector('.setup__next')?.click()
        }
      } else if (view === 'session') {
        await storage.open()
        await seedSessionReference(storage)
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: 'train' })
        await prepareSessionReference(tempered)
      } else if (route[view]) {
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: route[view] })
        if (view === 'today') await seedTodayReference(storage)
        if (view === 'fuel') await seedFuelReference(storage)
        await tempered.app.show(route[view])
      } else {
        throw new Error(`Unknown release visual: ${view}`)
      }
      await settle()
      if (!mount.firstElementChild) throw new Error('App did not render a surface')
      await report(true)
    } catch (error) {
      mount.innerHTML = `<main style="padding:24px;color:white"><h1>Visual QA failed</h1><pre></pre></main>`
      mount.querySelector('pre').textContent = String(error?.stack ?? error)
      await report(false, String(error?.stack ?? error).slice(0, 1200))
    }
  </script>
</body>
</html>
