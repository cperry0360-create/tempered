<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrap } from '../../src/app/bootstrap.js'
    import { bootstrapHarness } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { createSummaryScreen } from '../../src/ui/screens/summary.js'
    import { installCalorieAiRuntime } from '../../src/ui/calorie-ai-runtime.js'
    import { installCableMachineRuntime } from '../../src/ui/cable-machine-runtime.js'
    import { installHealthPasteRuntime } from '../../src/ui/health-paste-runtime.js'
    import { installHealthShortcutRuntime } from '../../src/ui/health-shortcut-runtime.js'
    import { confirmDiscardExercise } from '../../src/ui/session-guard.js'

    if (new URLSearchParams(location.search).get('layout') === 'duo') document.documentElement.dataset.layout = 'duo'
    const view = new URL(location.href).searchParams.get('view') ?? 'today'
    // Visual evidence for the opt-in Food 2.0 candidate, not the live app.
    {
      const url = new URL(location.href)
      // Preserve original release baseline screenshots for older Fuel pages.
      url.searchParams.set('food2', view.startsWith('food2-') ? '1' : '0')
      history.replaceState(null, '', url)
    }
    const theme = new URL(location.href).searchParams.get('theme') ?? 'dark'
    const mount = document.querySelector('#app')
    localStorage.clear()
    const clock = fixedClock((['progress-cut','fuel','fuel-entry','fuel-meals'].includes(view) || view.startsWith('food2-'))
      ? new Date(2026, 9, 29, 12, 0, 0)
      : (view === 'today' || view.startsWith('session'))
        ? new Date(2026, 8, 29, 9, 0, 0) : new Date(2026, 8, 7, 9, 0, 0))
    const route = {
      'weekly-recap': 'today', 'weekly-recap-details': 'today', 'weekly-recap-daily': 'today', 'weekly-recap-away': 'today', 'weekly-recap-quiet': 'today',
      today: 'today', 'rail-expanded':'today', 'today-expanded': 'today', 'today-day-details': 'today', mobility: 'today',
      train: 'train', 'train-preview': 'train', 'train-rhythm': 'train', 'train-program-details': 'train', 'train-routine': 'train', 'train-library': 'train', 'train-custom-exercise': 'train', fuel: 'fuel', 'fuel-entry': 'fuel', 'fuel-meals': 'fuel',
        'food2-dashboard':'fuel', 'food2-average':'fuel', 'food2-journal':'fuel', 'food2-library':'fuel', 'food2-serving':'fuel', 'food2-quicklog':'fuel',
      progress: 'history', 'progress-trends': 'history', 'progress-score-explain': 'history', 'progress-score-progression': 'history', 'progress-score-adherence': 'history', 'progress-score-consistency': 'history', 'progress-score-volume': 'history', 'progress-lifts': 'history', 'progress-lift-detail': 'history',
      'progress-habits': 'history', 'progress-cut': 'history', 'progress-log': 'history', 'progress-log-detail': 'history',
      settings: 'settings', 'settings-data': 'settings', 'settings-reset': 'settings', 'program-builder': 'program-builder', 'program-custom-exercise': 'program-builder',
    }

    async function installShippedInlineCss() {
      const html = await fetch('../../index.html').then((response) => response.text())
      for (const match of html.matchAll(/<style>([\s\S]*?)<\/style>/gi)) {
        const style = document.createElement('style')
        style.textContent = match[1]
        document.head.append(style)
      }
    }

    async function settle() {
      await document.fonts?.ready
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
      await new Promise((resolve) => setTimeout(resolve, 120))
    }

    async function report(ok, error = '') {
      const scope = document.querySelector('.health-paste-overlay, .nutrition-log-overlay, .mobility-screen-overlay, .session-sheet-overlay') ?? mount
      const visible = node => { const r = node.getBoundingClientRect(); return r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight && getComputedStyle(node).visibility !== 'hidden' }
      const audit = {
        outlinedTiles: [...scope.querySelectorAll('*')].filter(node => {
          if (!visible(node) || node.matches('.today-session-card, .today-readiness')) return false
          const r = node.getBoundingClientRect(), s = getComputedStyle(node)
          return r.width >= 80 && r.height >= 40 && ['Top','Right','Bottom','Left'].every(side => parseFloat(s['border'+side+'Width']) > 0 && s['border'+side+'Style'] !== 'none')
        }).map(node => node.className),
        greyTrendLines: [...scope.querySelectorAll('.spark, .trend-chart')].filter(node => visible(node) && !['var(--train-ink)','var(--fuel-ink)','var(--recovery-ink)'].some(value => {
          const probe = document.createElement('i'); probe.style.color = value; document.body.append(probe); const same = getComputedStyle(probe).color === getComputedStyle(node).color; probe.remove(); return same
        })).map(node => node.className.baseVal ?? node.className),
      }
      document.documentElement.dataset.visualReady = String(ok)
      await fetch('/__visual-ready', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ view, ok, error, audit }),
      })
    }

    async function seedTodayReference(storage) {
      const profile = await storage.get('profile', 'profile')
      await storage.put('profile', {
        ...(profile ?? { id: 'profile' }),
        setupComplete: true,
        ...(view === 'today' ? { nutritionReviewStartOn: '2026-09-28' } : {}),
      })

      const states = await storage.getAll('programState')
      for (const state of states) {
        if (state.active) await storage.put('programState', { ...state, startedOn: '2026-09-07' })
      }

      for (let offset = 7; offset >= 1; offset -= 1) {
        const date = new Date(2026, 8, 29 - offset, 12, 0, 0)
        const key = [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, '0'),
          String(date.getDate()).padStart(2, '0'),
        ].join('-')
        await storage.put('dayLogs', {
          date: key,
          sleepHours: 7.6,
          healthMetrics: { restingHr: 59, hrvMs: 34 },
        })
      }
      await storage.put('dayLogs', {
        date: '2026-09-29',
        sleepHours: 7.9,
        calories: 0,
        proteinGrams: 0,
        healthMetrics: { restingHr: 60, hrvMs: 27.6 },
      })

      for (const [sessionIndex, setCount] of [20, 21].entries()) {
        const sessionId = `visual-week-session-${sessionIndex + 1}`
        await storage.put('sessions', {
          id: sessionId,
          date: '2026-09-28',
          startedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:00:00`,
          endedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:59:00`,
          durationMinutes: 59,
          durationMinutesSource: 'manual',
        })
        for (let setIndex = 0; setIndex < setCount; setIndex += 1) {
          await storage.put('setLogs', {
            id: `${sessionId}-set-${setIndex + 1}`,
            sessionId,
            exerciseId: sessionIndex ? 'row_cable' : 'lat_pulldown_wide',
            reps: 8,
            weight: sessionIndex ? 130 : 115,
            isWarmup: false,
            completedAt: `2026-09-28T${sessionIndex ? '15' : '09'}:${String(Math.min(58, setIndex * 2)).padStart(2, '0')}:00`,
          })
        }
      }
    }


    async function seedFuelReference(storage) {
      await storage.put('profile', {
        id: 'profile', setupComplete: true,
        calorieTarget: 2250, proteinTargetGrams: 170,
        nutritionReviewStartOn: '2026-10-26',
      })
      const values = [
        ['2026-10-26', 'Greek yogurt + berries', 2075, 165, 'complete'],
        ['2026-10-27', 'Chicken rice bowl', 1825, 148, 'partial'],
        ['2026-10-29', 'Protein shake', 340, 48, 'partial'],
      ]
      for (const [date, description, calories, proteinGrams, state] of values) {
        const ingredients = date === '2026-10-29'
          ? [
              ['Protein shake', 340, 48, 18, 6, 2, '09:30'],
              ['Chicken and rice bowl', 680, 52, 62, 20, 5, '12:30'],
              ['Greek yogurt with berries', 320, 26, 33, 5, 4, '15:45'],
            ]
          : [[description, calories, proteinGrams, 48, 18, 5, '12:00']]
        const entries = ingredients.map(([name,kcal,protein,carbs,fat,fiber,time],i) => ({
          id: 'visual-' + date + '-' + i,
          loggedAt: date + 'T' + time + ':00.000Z',
          source: 'manual',
          description: name,
          calories: kcal, proteinGrams: protein,
          carbsGrams: carbs, fatGrams: fat, fiberGrams: fiber,
        }))
        const totals = {
          calories: entries.reduce((n,e) => n + e.calories, 0),
          proteinGrams: entries.reduce((n,e) => n + e.proteinGrams, 0),
          carbsGrams: entries.reduce((n,e) => n + e.carbsGrams, 0),
          fatGrams: entries.reduce((n,e) => n + e.fatGrams, 0),
          fiberGrams: entries.reduce((n,e) => n + e.fiberGrams, 0),
        }
        await storage.put('dayLogs', {
          date, ...totals,
          nutritionLedgerVersion: 1,
          nutritionCarryover: {}, nutritionEntries: entries,
          nutritionLogged: true, caloriesLogged: true,
          nutritionStatus: state,
          ...(date === '2026-10-29'
            ? { waterOz: 60, bodyMetrics: { weight: 166.8 } } : {}),
        })
      }
      await storage.put('dayLogs', {
        date:'2026-10-23', bodyMetrics:{weight:167.8},
      })
    }

    async function seedSessionReference(storage) {
      await seedTodayReference(storage)
      await storage.put('records', {
        exerciseId: 'rdl',
        bestWeight: { weight: 125, reps: 12, date: '2026-09-17' },
        bestE1RM: { value: 175, date: '2026-09-17' },
      })
      await storage.put('sessions', {
        id: 'visual-rdl-history',
        date: '2026-09-17',
        startedAt: '2026-09-17T09:00:00.000Z',
        endedAt: '2026-09-17T09:40:00.000Z',
      })
      for (let index = 0; index < 3; index += 1) {
        await storage.put('setLogs', {
          id: `visual-rdl-history-${index}`,
          sessionId: 'visual-rdl-history',
          exerciseId: 'rdl',
          method: 'Barbell',
          setIndex: index,
          weight: 125,
          reps: 12,
          isWarmup: false,
          completedAt: `2026-09-17T09:${String(5 + index).padStart(2, '0')}:00.000Z`,
        })
      }
    }

    async function seedProgressReference(storage) {
      const profile = await storage.get('profile', 'profile')
      await storage.put('profile', {
        ...(profile ?? { id: 'profile' }),
        setupComplete: true,
        activitySchedule: {
          ...(profile?.activitySchedule ?? {}),
          water: { cadence: 'daily', target: 1 },
        },
      })

      const today = new Date(2026, 8, 7, 12)
      const start = new Date(2026, 5, 10, 12)
      for (let offset = 0; offset < 90; offset += 1) {
        const date = new Date(start)
        date.setDate(date.getDate() + offset)
        const key = [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-')
        const recent = key >= '2026-08-01'
        await storage.put('dayLogs', {
          date: key,
          steps: 5800 + ((offset * 317) % 6900),
          sleepHours: 6.7 + (offset % 5) * 0.25,
          waterOz: offset > 86 || offset % 7 !== 0 ? 120 : 80,
          bodyMetrics: { weight: 166.2 - offset * 0.035 },
          healthMetrics: {
            restingHr: 64 - Math.floor(offset / 30),
            hrvMs: 31 + (offset % 9),
            respiratoryRate: 13.5 - (offset % 4) * 0.2,
            spo2: 97 + (offset % 2),
          },
          ...(recent ? { nutritionStatus: 'complete' } : {}),
        })
      }

      const exerciseMap = new Map((await storage.getAll('exercises')).map((exercise) => [exercise.id, exercise]))
      const exerciseIds = ['rdl', 'split_squat', 'seated_row_close'].filter((id) => exerciseMap.has(id))
      if (exerciseIds.length === 0) throw new Error('Progress reference exercises are missing')
      const scoreProgram = { id: 'visual-score-plan', name: 'Strength block', weeks: 12,
        days: exerciseIds.map((exerciseId, i) => ({ id: 'score-day-' + i, exercises: [{ exerciseId, sets: 4, repMin: 6, repMax: 10 }] })) }
      for (const state of await storage.getAll('programState')) await storage.delete('programState', state.programId)
      await storage.put('programs', scoreProgram)
      await storage.put('programState', { id: 'visual-score-plan', programId: scoreProgram.id, startedOn: '2026-07-20', active: true })
      const weeklySetCounts = [24, 36, 43, 58, 47, 72, 85, 110]
      for (let weekIndex = 0; weekIndex < weeklySetCounts.length; weekIndex += 1) {
        const sessionDate = new Date(today)
        sessionDate.setDate(sessionDate.getDate() - (weeklySetCounts.length - 1 - weekIndex) * 7)
        const key = [sessionDate.getFullYear(), String(sessionDate.getMonth() + 1).padStart(2, '0'), String(sessionDate.getDate()).padStart(2, '0')].join('-')
        const sessionId = `visual-progress-session-${weekIndex + 1}`
        await storage.put('sessions', {
          id: sessionId,
          programId: scoreProgram.id,
          date: key,
          startedAt: `${key}T09:00:00.000Z`,
          endedAt: `${key}T09:52:00.000Z`,
          durationMinutes: 52,
          durationMinutesSource: 'manual',
          routineName: 'Strength session',
        })
        for (let setIndex = 0; setIndex < weeklySetCounts[weekIndex]; setIndex += 1) {
          const exerciseId = exerciseIds[setIndex % exerciseIds.length]
          await storage.put('setLogs', {
            id: `${sessionId}-set-${setIndex + 1}`,
            programId: scoreProgram.id, programDayId: 'score-day-' + (setIndex % exerciseIds.length), slotIndex: 0,
            sessionId,
            exerciseId,
            reps: 8,
            weight: 80 + weekIndex * 4 + setIndex % 3 * 5,
            setIndex,
            isWarmup: false,
            completedAt: `${key}T09:${String(Math.min(58, 5 + setIndex % 54)).padStart(2, '0')}:00.000Z`,
          })
        }
      }

      const records = await storage.getAll('records')
      for (const [index, exerciseId] of exerciseIds.entries()) {
        const weight = 130 + index * 20
        const record = records.find((item) => item.exerciseId === exerciseId) ?? { id: `visual-progress-record-${exerciseId}`, exerciseId }
        await storage.put('records', {
          ...record,
          bestWeight: { weight, reps: 8, date: '2026-09-05' },
          bestE1RM: { value: weight * 1.25, date: '2026-09-05' },
          bestVolume: { volume: weight * 8 * 3, date: '2026-09-04' },
        })
      }
    }

    async function selectProgressView(tempered, target) {
      await tempered.app.show('history')
      if (target === 'progress' || target === 'progress-trends' || target === 'progress-cut') return
      if (target === 'progress-score-explain') { mount.querySelector('[data-score-info]')?.click(); await settle(); return }
      if (target.startsWith('progress-score-')) {
        mount.querySelector('[data-score-component="' + target.slice('progress-score-'.length) + '"]')?.click()
        await settle()
        return
      }
      const view = target.startsWith('progress-lift') ? 'lifts'
        : target.startsWith('progress-habit') ? 'habits' : 'log'
      mount.querySelector(`.progress-views [data-view="${view}"]`)?.click()
      await settle()
      if (target === 'progress-lift-detail') mount.querySelector('.progress-lift')?.click()
      if (target === 'progress-log-detail') mount.querySelector('.progress-log-row')?.click()
      await settle()
    }

    async function prepareSessionReference(tempered) {
      await tempered.app.show('train')
      await settle()
      const library = mount.querySelector('[data-exercise-library="open"]')
      if (!library) throw new Error('Exercise library entry missing')
      library.click()
      await settle()
      const rdl = mount.querySelector('[data-exercise="rdl"]')
      if (!rdl) throw new Error('RDL library row missing')
      rdl.click()
      await settle()
      const card = mount.querySelector('[data-exercise="rdl"]')
      if (!card) throw new Error('RDL session card missing')
      if (!card.querySelector('.exercise__art .exercise__thumb')) throw new Error('RDL photo missing')
      if (!card.querySelector('.plates')) throw new Error('RDL plate line missing')
      const weight = card.querySelector('[data-field="weight"]')
      const reps = card.querySelector('[data-field="reps"]')
      if (!weight?.value || !reps?.value) throw new Error('RDL prescription is not prefilled')
      clock.set(new Date(2026, 8, 29, 9, 23, 14))
      await settle()
    }

    try {
      await installShippedInlineCss()
      const storage = createMemoryStorage()
      if (!view.startsWith('setup-')) {
        await storage.open()
        await storage.put('profile', { id: 'profile', setupComplete: true, appearance: theme })
      }
      if (view === 'setup-welcome' || view === 'setup-rhythm' || view === 'setup-plan') {
        await bootstrap({ storage, clock, mount })
        if (view === 'setup-rhythm') {
          mount.querySelector('.setup__next')?.click()
        }
        if (view === 'setup-plan') {
          for (let index = 0; index < 3; index += 1) mount.querySelector('.setup__next')?.click()
        }
      } else if (view === 'session' || view === 'session-finish-rest' || view === 'session-custom-exercise' || view.startsWith('session-half-fold') || view.startsWith('plate-calculator-')) {
        await storage.open()
        await seedSessionReference(storage)
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: 'train' })
        await prepareSessionReference(tempered)
        if (view.startsWith('session-half-fold')) {
          mount.querySelector('[data-half-fold-toggle]')?.click()
          if (mount.querySelector('.screen--session')?.dataset.halfFold !== 'true') throw new Error('Half-fold mode did not open')
          if (view === 'session-half-fold-rest') {
            mount.querySelector('.setrow__check')?.click()
            await new Promise(resolve => setTimeout(resolve, 100))
          }
        }
        if (view.startsWith('plate-calculator-')) {
          mount.querySelector('[data-open-plate-calculator]')?.click()
          if (view === 'plate-calculator-build') document.querySelector('[data-plate-mode="build"]')?.click()
        }
        if (view === 'session-custom-exercise') {
          mount.querySelector('[data-action="add-movement"]')?.click()
          const details = mount.querySelector('[data-add-movement-panel] details')
          details.open = true
          details.scrollIntoView({ block: 'start' })
        }
        if (view === 'session-finish-rest') {
          // The confirmation must sit above a running rest timer.
          ;[...document.querySelectorAll('.screen--session .setrow__check')]
            .find((button) => !button.disabled && button.closest('.setrow')?.dataset.done !== 'true')?.click()
          await new Promise((resolve) => setTimeout(resolve, 60))
          document.querySelector('[data-action="finish"]')?.click()
        }
      } else if (view === 'summary') {
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: 'train' })
        const summary = createSummaryScreen({ onDone: () => tempered.app.show('today') })
        await summary.show({
          session: { date: '2026-09-07' }, durationMinutes: 52, setsCompleted: 18,
          totalReps: 144, totalVolume: 18800,
          records: {
            weightPrs: [{ exerciseId: 'rdl', weight: 180, reps: 6 }],
            volumePrs: [{ exerciseId: 'seated_row_close', volume: 6400 }],
          },
        })
        mount.querySelector('.app__body')?.replaceChildren(summary.root)
        const tabs = mount.querySelector('.tabbar')
        if (tabs) tabs.hidden = true
      } else if (view === 'health-import' || view === 'health-review' || view === 'nutrition-log' || view === 'nutrition-meal' || view === 'session-discard') {
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: view === 'session-discard' ? 'train' : 'today' })
        installCalorieAiRuntime()
        installHealthPasteRuntime(tempered)
        await installCableMachineRuntime(tempered)
        if (view === 'nutrition-log' || view === 'nutrition-meal') {
          await seedFuelReference(storage)
          window.dispatchEvent(new CustomEvent('tempered:open-nutrition', { detail: { date: '2026-09-07' } }))
        } else if (view === 'health-import' || view === 'health-review') {
          window.dispatchEvent(new CustomEvent('tempered:open-health-import'))
          if (view === 'health-review') {
            const input = document.querySelector('[data-health-paste-input]')
            input.value = 'TEMPERED_HEALTH_V1\nDATE=2026-09-07\nSTEPS=9000\nSLEEP=7.5\nWEIGHT_LB=166\nRESTING_HR=60\nHRV_MS=40\nRESP_RATE=14\nSPO2=98'
            input.dispatchEvent(new Event('input'))
          }
        } else {
          void confirmDiscardExercise(2)
        }
      } else if (view === 'health-setup' || view === 'health-launch') {
        const initialTab = view === 'health-launch' ? 'today' : 'settings'
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab })
        installHealthShortcutRuntime(tempered, { showLaunchGate: view === 'health-launch' })
        if (view === 'health-setup') {
          await settle()
          const setup = mount.querySelector('.health-bridge__settings-open')
          if (!setup) throw new Error('Health setup entry missing from Settings')
          setup.click()
        }
      } else if (route[view]) {
        const target = route[view]
        const tempered = await bootstrapHarness({ storage, clock, mount, initialTab: target })
        await installCableMachineRuntime(tempered)
        if (view.startsWith('weekly-recap')) {
          if (view !== 'weekly-recap-quiet') await seedProgressReference(storage)
          const profile = await storage.get('profile', 'profile')
          await storage.put('profile', { ...profile, createdAt: '2026-07-20T12:00:00Z', weeklyRecapLastSeenWeek: null,
            ...(view === 'weekly-recap-away' ? { awayPeriods: [{ start: '2026-08-31', end: '2026-09-06' }] } : {}) })
          const { installWeeklyRecapRuntime } = await import('../../src/ui/weekly-recap-runtime.js')
          await installWeeklyRecapRuntime(tempered)
          if (!document.querySelector('[data-weekly-recap][open]')) throw new Error('Weekly recap did not open')
          if (view === 'weekly-recap-details') document.querySelector('.weekly-recap__breakdown').open = true
          if (view === 'weekly-recap-daily') document.querySelector('.weekly-recap__card:last-of-type').scrollIntoView({ block: 'start' })
        }
        if (view.startsWith('today') || view === 'mobility' || view.startsWith('train-')) await seedTodayReference(storage)
        if (view.startsWith('fuel') || view.startsWith('food2-')) { installCalorieAiRuntime(); await seedFuelReference(storage) }
        // Retired Shortcut UI is not mounted in production Settings.
        if (view.startsWith('progress')) {
          await seedProgressReference(storage)
          if (view === 'progress-cut') {
            for (const row of await storage.getAll('programState')) {
              await storage.put('programState', { ...row, active: false })
            }
            await storage.put('programState', {
              programId: 'beach-cut-2026', active: true,
              startedOn: '2026-10-26', revisionId: 'beach-cut-2026:r1',
            })
            for (const [date, weight, waist, calories, protein] of [
              ['2026-10-27', 167.2, 34.1, 2290, 169],
              ['2026-10-28', 166.8, 33.9, 2220, 173],
              ['2026-10-29', 166.7, 33.8, 2200, 171],
            ]) {
              await storage.put('dayLogs', {
                date, bodyMetrics: { weight }, bodyMetricsLogged: true, waistInches: waist,
                bodyMeasurements: { chest: 39.2, hips: 37.1, arm: 13.2, thigh: 21.7 },
                calories, proteinGrams: protein,
                caloriesLogged: true, nutritionLogged: true, nutritionStatus: 'complete',
              })
            }
          }
          await selectProgressView(tempered, view)
        } else {
          await tempered.app.show(target)
          if (view === 'rail-expanded') {
            if (document.documentElement.dataset.layout !== 'duo') throw new Error('Expanded rail reference requires Duo layout')
            const progress = mount.querySelector('[data-tab="history"]')
            if (!progress) throw new Error('Progress custom navigation glyph missing')
            const pos = progress.getBoundingClientRect()
            progress.dispatchEvent(new PointerEvent('pointerdown', {
              bubbles:true,pointerId:512,button:0,clientY:pos.top+pos.height/2,
            }))
            await new Promise(resolve => setTimeout(resolve,760))
            const capsule=mount.querySelector('.tabbar__tabs[data-holding="true"]')
            if (!capsule || capsule.getBoundingClientRect().width < 105 ||
                [...capsule.querySelectorAll('.tabbar__tab > span')].some(node=>getComputedStyle(node).opacity!=='1'))
              throw new Error('Long-press expanded rail failed to render four labels')
            // Guard the exact customer screenshot: the selected halo must sit
            // ON its icon, not on the taller row or beneath its caption.
            const glyph=progress.querySelector('.tabbar__glyph')
            const art=glyph?.querySelector('svg')
            const bubble=glyph?.getBoundingClientRect()
            const iconBox=art?.getBoundingClientRect()
            if (!bubble || !iconBox || Math.abs(bubble.top+bubble.height/2-iconBox.top-iconBox.height/2)>2 ||
                Math.abs(bubble.left+bubble.width/2-iconBox.left-iconBox.width/2)>2 ||
                getComputedStyle(glyph,'::before').opacity!=='1')
              throw new Error('Selected bubble does not cover and center on Progress icon')
          }
          if (view.startsWith('food2-')) {
            if (!mount.querySelector('[data-food-two="true"]')) throw new Error('Food 2.0 opt-in failed to mount')
            if (view === 'food2-average') mount.querySelector('[data-fuel-average]')?.click()
            if (view === 'food2-library') mount.querySelector('.fn2__pills button:nth-child(1)')?.click()
            if (view === 'food2-serving') {
              mount.querySelector('.fn2__pills button:nth-child(1)')?.click()
              mount.querySelector('.fn2__food-row .fn2__add')?.click()
              if (!document.querySelector('[data-food2-overlay="serving"]'))
                throw new Error('Direct serving picker did not open')
            }
            if (view === 'food2-journal') mount.querySelector('.fn2__pills button:nth-child(3)')?.click()
            if (view === 'food2-quicklog') mount.querySelector('.fn2__pills button:nth-child(2)')?.click()
          }
          if (view === 'program-custom-exercise') {
            const details = mount.querySelector('.program-builder details')
            details.open = true
            details.scrollIntoView({ block: 'start' })
          }
          if (view === 'train-preview') {
            mount.querySelector('[data-preview-day]')?.click()
            if (!mount.querySelector('[data-start-preview]')) throw new Error('Workout preview did not open')
          }
          if (view === 'train-rhythm') mount.querySelector('[data-training-rhythm="open"]')?.click()
          if (view === 'train-program-details') mount.querySelector('[data-program-details]')?.click()
          if (view === 'train-routine') mount.querySelector('[data-routine]')?.click()
          if (view === 'train-library') mount.querySelector('[data-exercise-library]')?.click()
          if (view === 'train-custom-exercise') {
            mount.querySelector('[data-exercise-library]')?.click()
            mount.querySelector('[data-create-exercise]')?.click()
            mount.querySelector('.custom-exercise__actions')?.scrollIntoView({ block: 'nearest' })
          }
          if (view === 'today-expanded') mount.querySelector('[data-workout-expand]')?.click()
          if (view === 'today-day-details') mount.querySelector('[data-day-details]')?.click()
          if (view === 'mobility') {
            mount.querySelector('[data-other="toggle"]')?.click()
            mount.querySelector('[data-activity="mobility"] .today-item__body')?.click()
            if (!document.querySelector('[data-mobility-screen]')) throw new Error('Mobility view did not open')
          }
        }
      } else {
        throw new Error(`Unknown release visual: ${view}`)
      }
      await settle()
      if (view === 'nutrition-meal') document.querySelector('.nutrition-meal-form')?.scrollIntoView({ block: 'start' })
      if (view === 'settings-data') mount.querySelector('[data-section="data"]')?.scrollIntoView({ block: 'start' })
      if (view === 'settings-reset') mount.querySelector('[data-section="reset"]')?.scrollIntoView({ block: 'start' })
      if (view === 'fuel-entry') document.querySelector('.nutrition-panel__add')?.scrollIntoView({ block: 'start' })
      if (view === 'fuel-meals') document.querySelector('.nutrition-panel__meals')?.scrollIntoView({ block: 'start' })
      if (view === 'progress-trends') document.querySelectorAll('.progress-trends')[0]?.closest('.progress-panel')?.scrollIntoView({ block: 'start' })
      if (view === 'health-review') document.querySelector('[data-health-paste-preview]')?.scrollIntoView({ block: 'center' })
      document.activeElement?.blur()
      await settle()
      if (view.startsWith('weekly-recap')) {
        const dialog=document.querySelector('dialog.weekly-recap[open]')
        if(!dialog || !dialog.querySelector('.weekly-recap__brand img') ||
           !dialog.querySelector('.weekly-recap__scoreline') ||
           !dialog.querySelector('.weekly-recap__done') ||
           dialog.querySelectorAll('.weekly-recap__stats > div').length!==4)
          throw new Error('Weekly recap retains legacy layout instead of LFMS score/metric cards')
        const rect=dialog.getBoundingClientRect()
        if(rect.left<-1 || rect.right>window.innerWidth+1 || rect.top<-1 || rect.bottom>window.innerHeight+1)
          throw new Error('Weekly recap overflows viewport or safe region')
        if(document.querySelector('[data-lfms-launch]'))
          throw new Error('Weekly recap opens while LFMS splash exists')
      }
      if (view === 'food2-quicklog') {
        const log=mount.querySelector('.fn2__log-entry')
        const favorites=mount.querySelector('.fn2__log-favorites')
        if(!log || !log.querySelector('[data-nutrition-form]') || !favorites ||
           mount.querySelector('.fn2__overlay'))
          throw new Error('Log must be a direct page with form first and Favorites beneath')
        const a=log.getBoundingClientRect(),b=favorites.getBoundingClientRect()
        if(b.top<a.bottom-2 || a.left<0 || a.right>innerWidth+1)
          throw new Error('Log form and Favorites overlap or overflow')
      }
      if (view === 'food2-journal') {
        const picker=mount.querySelector('.fn2__date-picker')
        const display=picker?.querySelector('.fn2__date-picker-display')
        const input=picker?.querySelector('input[type="date"]')
        if(!picker||!display||!input)throw new Error('Meal History compact date selector missing')
        const a=picker.getBoundingClientRect(),b=input.getBoundingClientRect()
        const prev=mount.querySelector('[aria-label="Previous day"]')?.getBoundingClientRect()
        const next=mount.querySelector('[aria-label="Next day"]')?.getBoundingClientRect()
        if(a.width<90 || Math.abs(a.left-b.left)>2 || Math.abs(a.right-b.right)>2 ||
           a.right>innerWidth+1 || a.left<0 || (prev&&prev.right>a.left+1) ||
           (next&&next.left<a.right-1))
          throw new Error('Meal History calendar picker geometry: '+JSON.stringify({picker:[a.left,a.right,a.width],input:[b.left,b.right,b.width],prev:prev&&[prev.left,prev.right],next:next&&[next.left,next.right],viewport:innerWidth}))
        for(const row of mount.querySelectorAll('.fn2__meal-row')) {
          const a=row.querySelector('.fn2__meal-info')?.getBoundingClientRect()
          const b=row.querySelector('.fn2__meal-menu')?.getBoundingClientRect()
          if(a&&b&&a.right>b.left+1)throw new Error('History food title collides with meal menu')
        }
      }
      if (view === 'food2-dashboard') {
        const lifter=mount.querySelector('[data-water-goal-figure="true"]')
        const waterCard=lifter?.closest('.fn2__stat--water')
        const figureFill=lifter?.querySelector('[data-water-figure-fill="true"]')
        const lifterGlyphs=lifter?.querySelectorAll('[data-custom-rail-glyph="nav-train"]')
        const waveClip=figureFill?.querySelector('clipPath[data-water-clip]')
        const wavePath=figureFill?.querySelector('[data-water-wave-path="true"]')
        const clippedGlyph=figureFill?.querySelector('g[clip-path]')
        if(!lifter||!waterCard||!figureFill||lifterGlyphs?.length!==2 ||
           lifter.getAttribute('role')!=='meter')
          throw new Error('Water goal lifter must reuse the exact LFMS rail figure twice')
        if(!waveClip||!wavePath||!clippedGlyph || getComputedStyle(figureFill).filter!=='none')
          throw new Error('Water blue must be wave-clipped inside the lifter with no outer halo')
        const lr=lifter.getBoundingClientRect(),cr=waterCard.getBoundingClientRect()
        if(lr.left<cr.left-2 || lr.right>cr.right+2 || lr.bottom>cr.bottom+2)
          throw new Error('Water goal lifter spills beyond its card')
        const neo=mount.querySelector('[data-food-neon="true"]')
        if(!neo || !neo.querySelector('.fn2__neo-close') ||
            neo.querySelectorAll('.fn2__neo-meal').length!==4 ||
            neo.querySelectorAll('.fn2__neo-nutrient').length!==4 ||
            neo.querySelectorAll('.fn2__neo-perimeter-live').length!==4)
          throw new Error('Neon Fuel reference is missing meal, ring, meter, or close-day pieces')
        const rect=neo.getBoundingClientRect()
        if(rect.left < -1 || rect.right > window.innerWidth+1)
          throw new Error('Neon Fuel widget overflows the visual viewport')
        if(mount.querySelector('.fn2__float'))
          throw new Error('Floating Quick Log overlaps the neon card')
        if(window.innerWidth<=540){
          const shortcuts=[...mount.querySelectorAll('.fn2__pills button')]
          if(shortcuts.length!==4 || shortcuts.some(n=>{
            const b=n.getBoundingClientRect()
            return b.left<0 || b.right>window.innerWidth+1
          }))throw new Error('Food shortcut pill is clipped on phone/Duo cover')
        }
        const track=neo.querySelector('.fn2__neo-perimeter-track')
        if(!track || [...neo.querySelectorAll('.fn2__neo-perimeter-live')].some(n=>n.getAttribute('d')!==track.getAttribute('d')))
          throw new Error('Calorie meal segments are not on the same rounded perimeter')
        if(window.innerWidth>980){
          const body=neo.querySelector('.fn2__neo-body').getBoundingClientRect()
          const cells=[...neo.querySelector('.fn2__neo-body').children].map(n=>n.getBoundingClientRect())
          if(rect.height>440 || body.height>355 || Math.max(...cells.map(x=>x.top))-Math.min(...cells.map(x=>x.top))>24)
            throw new Error('Wide Fuel widget broke compact single-row reference layout')
          if(neo.scrollWidth>neo.clientWidth+2)
            throw new Error('Wide Fuel widget clips its five reference columns')
        }
        for(const node of neo.querySelectorAll('.fn2__neo-close,.fn2__neo-other')) {
          if(node.getBoundingClientRect().width<44 || node.getBoundingClientRect().height<44)
            throw new Error('Neon Fuel action is below 44px accessibility target')
        }
        if(window.innerWidth>=811 && window.innerWidth<=1100) {
          const cells=[...neo.querySelector('.fn2__neo-body').children].map(n=>n.getBoundingClientRect())
          const tops=cells.map(box=>box.top)
          const frame=neo.querySelector('.fn2__neo-calorie').getBoundingClientRect()
          const footer=neo.querySelector('.fn2__neo-footer').getBoundingClientRect()
          const widget=neo.getBoundingClientRect()
          if(Math.max(...tops)-Math.min(...tops)>4)
            throw new Error('Duo inner Fuel columns are not in one row')
          if(widget.height>285 || footer.bottom>window.innerHeight-10)
            throw new Error('Duo inner Fuel widget does not match compact reference proportions')
          if(neo.scrollWidth>neo.clientWidth+2)
            throw new Error('Duo inner Fuel widget has horizontal overflow')
          if(frame.width<125||frame.height<170)
            throw new Error('Duo inner calorie frame became too small')
        }
        if(window.innerWidth>740 && window.innerWidth<811){
          const footer=neo.querySelector('.fn2__neo-footer').getBoundingClientRect()
          if(footer.bottom>window.innerHeight-10)
            throw new Error('Intermediate Fuel layout clips the footer')
        }
        if(window.innerWidth<=540){
          const frame=neo.querySelector('.fn2__neo-outline').getBoundingClientRect()
          const copy=neo.querySelector('.fn2__neo-calorie-content').getBoundingClientRect()
          const meals=neo.querySelector('.fn2__neo-meals').getBoundingClientRect()
          if(copy.left<frame.left+frame.width*.14 || copy.right>frame.right-frame.width*.14 ||
             copy.top<frame.top+frame.height*.13 || copy.bottom>frame.bottom-frame.height*.13)
            throw new Error('Compact calorie words overflow their segmented frame')
          if(meals.top<frame.bottom-1)
            throw new Error('Compact meal tiles collide with calorie frame')
        }
      }
      if (!mount.firstElementChild) throw new Error('App did not render a surface')
      // Regression gate for the formerly gray/orange drill-down surfaces.
      // Compare computed palette tokens, not screenshots or hardcoded hex.
      const deepScreens = {
        settings: '.screen--settings',
        'settings-data': '.screen--settings',
        'settings-reset': '.screen--settings',
        'program-builder': '.program-builder',
        mobility: '.mobility-screen',
        summary: '.screen--summary',
      }
      if (Object.prototype.hasOwnProperty.call(deepScreens,view)) {
        const scope = document.querySelector(deepScreens[view])
        const actual = scope && getComputedStyle(scope).getPropertyValue('--surface-1').trim()
        const expected = getComputedStyle(document.documentElement).getPropertyValue('--lfms-sub-panel').trim()
        if (!scope || actual !== expected)
          throw new Error(`LFMS sub-screen palette missing on ${view}: ${actual} (expected ${expected})`)
      }
      if (view === 'settings') {
        const title = mount.querySelector('.screen--settings > .screen__title')
        if (!title || getComputedStyle(title,'::after').content === 'none')
          throw new Error('Settings lost its LFMS red title accent')
      }
      if (view === 'progress-cut') {
        const eyebrow=mount.querySelector('.progress-cut__eyebrow')
        if (!eyebrow || !getComputedStyle(eyebrow).color)
          throw new Error('Progress cut accent not present')
      }
      await report(true)
    } catch (error) {
      mount.innerHTML = `<main style="padding:24px;color:white"><h1>Visual QA failed</h1><pre></pre></main>`
      mount.querySelector('pre').textContent = String(error?.stack ?? error)
      await report(false, String(error?.stack ?? error).slice(0, 1200))
    }
  </script>
</body>
</html>
