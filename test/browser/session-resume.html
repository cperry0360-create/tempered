<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tempered — minimize and resume workout</title>
    <style>
      body { font: 14px system-ui; background: #0a0c10; color: #e6eaf2; padding: 20px; }
      .check[data-ok="true"]::before { content: "PASS  "; color: #4fc9a0; }
      .check[data-ok="false"]::before { content: "FAIL  "; color: #e05a6a; }
    </style>
  </head>
  <body>
    <h1>minimize and resume workout</h1>
    <div id="fixture"></div>
    <div id="results"></div>
    <script type="module">
      import { bootstrap } from '../../src/app/bootstrap.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
      import { fixedClock } from '../../src/adapters/clock/clock.js'
      import { clearActiveSessionDraft, loadActiveSessionDraft } from '../../src/ui/session-draft.js'

      const mount = document.getElementById('fixture')
      const results = document.getElementById('results')
      const checks = []
      function check(name, ok, detail = '') {
        checks.push({ name, ok: Boolean(ok), detail })
        const row = document.createElement('div')
        row.className = 'check'
        row.dataset.ok = String(Boolean(ok))
        row.textContent = `${name}${detail ? ` — ${detail}` : ''}`
        results.append(row)
      }
      const settle = () => new Promise((resolve) => setTimeout(resolve, 20))

      try {
        clearActiveSessionDraft()
        const storage = createMemoryStorage()
        await storage.open()
        await storage.put('profile', {
          id: 'profile', name: 'Cory', units: 'imperial', setupComplete: true,
          planTargetSessionsPerWeek: 4,
        })
        const clock = fixedClock('2026-09-05T18:00:00')

        const first = await bootstrap({ mount, storage, clock })
        await first.app.startSession({ exerciseId: 'incline_bench_db' })
        const weight1 = mount.querySelector('[data-exercise="incline_bench_db"][data-set="0"][data-field="weight"]')
        const reps1 = mount.querySelector('[data-exercise="incline_bench_db"][data-set="0"][data-field="reps"]')
        weight1.value = '135'
        weight1.dispatchEvent(new Event('input', { bubbles: true }))
        reps1.value = '8'
        reps1.dispatchEvent(new Event('input', { bubbles: true }))
        mount.querySelector('[data-log="incline_bench_db:0"]').click()
        await settle()

        const weight2 = mount.querySelector('[data-exercise="incline_bench_db"][data-set="1"][data-field="weight"]')
        weight2.value = '140'
        weight2.dispatchEvent(new Event('input', { bubbles: true }))
        const draftBeforeRestart = loadActiveSessionDraft()
        const sessionId = draftBeforeRestart?.session?.id
        check('a live checkpoint exists before the restart', Boolean(draftBeforeRestart))

        // New shell + services, same durable stores. A cold launch should not
        // take over the product, but it must keep the workout resumable.
        const second = await bootstrap({ mount, storage, clock })
        await settle()
        check('relaunch lands on Today', Boolean(mount.querySelector('.screen--today-calm')))
        check('relaunch does not auto-open the workout', mount.querySelector('.screen--session') === null)
        check('navigation is visible after relaunch', mount.querySelector('.tabbar')?.hidden === false)
        check('Today is the active tab', mount.querySelector('[data-tab="today"]')?.getAttribute('aria-current') === 'page')
        check('the workout checkpoint survives relaunch', loadActiveSessionDraft()?.session?.id === sessionId)
        check('a compact resume control is visible', Boolean(mount.querySelector('[data-active-workout]')))
        check('already logged canonical work is preserved', sessionId
          ? (await second.workout.setsFor(sessionId)).length === 1
          : false)

        mount.querySelector('[data-active-workout]').click()
        await settle()
        check('resume reopens the same active workout', Boolean(mount.querySelector('.screen--session')))
        check('logged set remains checked after resume', mount.querySelector('[data-log="incline_bench_db:0"]')?.dataset.done === 'true')

        mount.querySelector('[data-action="add-movement"]').click()
        const addChoice = mount.querySelector('[data-add-exercise]')
        const addedId = addChoice?.dataset.addExercise
        addChoice?.click()
        await settle()
        check('another movement can be added while the workout is open', Boolean(addedId && mount.querySelector(`[data-exercise="${addedId}"]`)))
        check('the added movement is checkpointed', loadActiveSessionDraft()?.plan?.some((entry) => entry.exercise?.id === addedId))

        mount.querySelector('[data-action="minimize-workout"]').click()
        await settle()
        check('minimize returns to the app without finishing', Boolean(mount.querySelector('.screen--today-calm')))
        check('minimized workout remains resumable', Boolean(mount.querySelector('[data-active-workout]')))

        clearActiveSessionDraft()
        const passed = checks.every((entry) => entry.ok)
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'session-resume', passed, checks }),
        })
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error))
        clearActiveSessionDraft()
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'session-resume', passed: false, checks }),
        })
      }
    </script>
  </body>
</html>
