<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — calm structure and feel</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/calm.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * Structure-and-feel acceptance after the calm tracker pass.
       * Today is intentionally quieter than Character/Battle: shared surfaces,
       * neutral task icons, one progress signal, and rewards that appear only
       * after an action. Workout ergonomics remain unchanged.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }) }
      const q = (s, root = document) => root?.querySelector(s) ?? null
      const qa = (s, root = document) => root ? [...root.querySelectorAll(s)] : []
      const settle = () => new Promise((r) => setTimeout(r, 35))

      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      async function ensureActivity(id) {
        let row = q(`[data-activity="${id}"]`)
        if (row) return row
        const toggle = q('[data-other="toggle"]')
        if (toggle && toggle.dataset.open !== 'true') { toggle.click(); await settle() }
        return q(`[data-activity="${id}"]`)
      }

      async function openEditor(id) {
        const row = await ensureActivity(id)
        const opener = q('[data-action="open-log"]', row)
        if (opener?.getAttribute('aria-expanded') !== 'true') { opener?.click(); await settle() }
        return q(`[data-editor="${id}"]`)
      }

      try {
        const tempered = await bootstrap({ storage: createMemoryStorage(), mount: document.getElementById('app') })
        await tempered.app.show('today')
        await waitFor('.screen--today-calm .today-item')

        const backdrop = getComputedStyle(document.body, '::before')
        const opacity = Number(backdrop.opacity)
        check('the tracker backdrop is deliberately quiet', opacity >= 0.10 && opacity <= 0.14, `opacity ${opacity}`)
        check('the tracker backdrop is softly blurred', /blur\((2(\.\d+)?)px\)/.test(backdrop.filter), backdrop.filter)

        const summary = q('[data-summary="daily"]')
        check('Today opens with one clear summary card', summary !== null)
        check('the summary has one progress signal, not five attribute meters',
          qa('[role="progressbar"]', summary).length === 1 && qa('.strip__bar').length === 0)

        const sectionTitles = qa('.today-section__title').map((node) => node.textContent.trim())
        check('the main hierarchy is Today then This week',
          sectionTitles[0] === 'Today' && sectionTitles[1] === 'This week', sectionTitles.join(' | '))

        const dailyList = q('[data-section="daily"] .today-list')
        const dailyRows = qa('.today-item', dailyList)
        const icons = qa('.today-item__icon', dailyList)
        check('daily work shares one list surface', dailyList !== null && dailyRows.length > 1,
          `${dailyRows.length} rows on one surface`)
        check('every visible daily row has one compact icon', icons.length === dailyRows.length,
          `${icons.length}/${dailyRows.length} icons`)
        const firstIcon = icons[0]?.getBoundingClientRect()
        check('task icons are compact rather than large attribute tiles',
          firstIcon && firstIcon.width <= 36 && firstIcon.height <= 36,
          firstIcon ? `${Math.round(firstIcon.width)}x${Math.round(firstIcon.height)}` : 'no icon')
        check('Today contains no progress rings', qa('.ring, .ring__fill').length === 0)
        check('numeric controls are progressive disclosure', qa('.today-editor').length === 0)

        const training = q('[data-trainingweek="true"]')
        check('weekly strength is summarized as one row', training !== null,
          training?.textContent?.trim() ?? 'missing')
        check('Today does not dump individual exercise slots into the weekly section',
          qa('[data-exerciseweek]').length === 0)

        const rest = await ensureActivity('rest_day')
        const restAction = q('[data-action="mark"]', rest)
        check('optional rest logging remains reachable', restAction !== null)
        restAction?.click(); await settle()
        const earned = q('.today-earned')
        check('XP appears as a reward moment after logging', /\+\d+ XP/.test(earned?.textContent ?? ''),
          earned?.textContent ?? 'no reward')
        check('the reward is inline, not a modal', earned !== null && earned.closest('[role="dialog"]') === null)

        let editor = await openEditor('water')
        let quick = qa('[data-quickadd]', editor)
        check('water offers three quick adds only after opening the row', quick.length === 3,
          quick.map((node) => node.textContent).join(' '))
        quick[0]?.click(); await settle()
        const afterOne = (await tempered.daily.dayLog(tempered.clock.today())).waterOz

        editor = await openEditor('water')
        quick = qa('[data-quickadd]', editor)
        quick[0]?.click(); await settle()
        const afterTwo = (await tempered.daily.dayLog(tempered.clock.today())).waterOz
        check('quick adds accumulate safely', afterOne === 8 && afterTwo === 16, `${afterOne} then ${afterTwo} oz`)

        editor = await openEditor('water')
        const field = q('[data-entry="water"]', editor)
        field.value = '4'
        q('[data-action="log"]', editor)?.click(); await settle()
        const afterManual = (await tempered.daily.dayLog(tempered.clock.today())).waterOz
        check('typed additive amounts also add rather than silently replace the total',
          afterManual === 20, `16 + 4 -> ${afterManual} oz`)

        // Workout ergonomics are intentionally untouched by the calm Today pass.
        await tempered.app.show('train')
        await waitFor('[data-programday]')
        q('[data-programday="monday"]')?.click()
        await waitFor('.setrow__check')
        const firstCard = q('[data-exercise]')
        const firstWeights = qa('input.setrow__num[data-field="weight"]', firstCard)
        if (firstWeights[0]) {
          firstWeights[0].value = '95'
          firstWeights[0].dispatchEvent(new Event('change'))
        }
        await settle()
        q('.setrow__check')?.click(); await settle()
        const kept = qa('input.setrow__num[data-field="weight"]', q('[data-exercise]'))
        check('the logged set keeps what was logged', kept[0]?.value === '95', kept[0]?.value)

        await tempered.app.show('train')
        await waitFor('[data-programday]')
        ;(q('[data-programday="tuesday"]') ?? q('[data-programday]'))?.click()
        await waitFor('.setrow__check')
        const fresh = qa('input.setrow__num[data-field="weight"]', q('[data-exercise]'))
        check('there are several sets to cascade into', fresh.length >= 3, `${fresh.length} sets`)
        if (fresh[0]) {
          fresh[0].value = '135'
          fresh[0].dispatchEvent(new Event('change'))
          await settle()
        }
        const cascaded = qa('input.setrow__num[data-field="weight"]', q('[data-exercise]'))
        check('editing set 1 fills the remaining sets',
          cascaded.length > 1 && cascaded.slice(1).every((input) => input.value === '135'),
          cascaded.map((input) => input.value || '-').join(', '))
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 400))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'structure-and-feel', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
