<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — R2 Today structure and feel</title>
  <link rel="stylesheet" href="../../src/tokens.css" />
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks=[]
    const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
    const q=(s,root=document)=>root?.querySelector(s)??null
    const qa=(s,root=document)=>root?[...root.querySelectorAll(s)]:[]
    const parse=(css)=>(String(css).match(/[\d.]+/g)??[]).map(Number)
    const settle=(ms=35)=>new Promise((resolve)=>setTimeout(resolve,ms))
    async function waitFor(selector,timeout=4000){
      const end=Date.now()+timeout
      while(Date.now()<end){const node=q(selector);if(node)return node;await settle(15)}
      return null
    }

    try{
      const clock=fixedClock(new Date(2026,8,29,9,0,0))
      const tempered=await bootstrap({storage:createMemoryStorage(),clock,mount:q('#app')})
      await tempered.daily.setCadence('water','daily',1)
      await tempered.daily.setCadence('sleep','daily',1)
      await tempered.app.show('today')
      const screen=await waitFor('.screen--today-calm')

      const structure=[...screen.children].map((node)=>node.dataset.section||(
        node.classList.contains('today-heading')?'heading':node.className))
      check('Today order matches the approved R2 stack',
        structure.slice(0,6).join('|')==='heading|next-session|readiness|week|fuel|daily',
        structure.slice(0,6).join(' | '))
      check('Today starts with its title row, date, and Settings gear',
        Boolean(q('.today-heading__title-row .screen__title',screen))
          && Boolean(q('.today-heading__date',screen))
          && Boolean(q('.today-heading .today-settings',screen)))
      check('the heading uses Today plus the compact date', q('.screen__title',screen)?.textContent==='Today'
        && /Tuesday, 29 Sep/.test(q('.today-heading__date',screen)?.textContent??''))

      const removed=['.today-calendar','[data-summary="daily"]','[data-section="planner"]','[data-section="training"]',
        '[data-daily-recap]','.today-firstweek']
      check('superseded Today modules are removed from the DOM', removed.every((selector)=>!q(selector,screen)))

      const cards=qa('.today-card',screen)
      check('the five dashboard cards render in the approved order',
        cards.map((card)=>card.dataset.section).join('|')==='next-session|readiness|week|fuel|daily',
        cards.map((card)=>card.dataset.section).join(' | '))
      check('cards use opaque themed fills with 16px corners',
        cards.every((card)=>{
          const style=getComputedStyle(card)
          return Math.round(parseFloat(style.borderRadius))===16
            && (parse(style.backgroundColor)[3]??1)===1
        }))

      const rows=qa('[data-section="daily"] [data-activity]',screen)
      check('Daily log is one shared card rather than one card per habit',
        q('[data-section="daily"] .today-list',screen)!==null && rows.length>=2)
      check('every visible Daily row has at most one quick action',
        rows.every((row)=>qa('.today-item__quick',row).length<=1),
        rows.map((row)=>qa('.today-item__quick',row).length).join(','))
      check('Log something else is inside the Daily log card',
        q('[data-section="daily"] [data-other="toggle"]',screen)?.textContent.includes('Log something else'))

      const body=getComputedStyle(document.body)
      check('Today is flat slate with no scenic background',
        body.backgroundImage==='none'&&getComputedStyle(document.body,'::before').backgroundImage==='none',
        `${body.backgroundColor} / ${body.backgroundImage}`)
      const bar=q('.tabbar')
      const barStyle=getComputedStyle(bar)
      check('bottom navigation uses an opaque themed bar without blur',
        (parse(barStyle.backgroundColor)[3]??1)===1
        && !(barStyle.backdropFilter||barStyle.webkitBackdropFilter||'').includes('blur'),
        barStyle.backgroundColor)
      check('Today has no sideways scroll', document.documentElement.scrollWidth<=document.documentElement.clientWidth+1,
        `${document.documentElement.scrollWidth}/${document.documentElement.clientWidth}`)
    }catch(error){
      check('harness threw',false,String(error?.stack??error).slice(0,700))
    }

    await fetch('/__report',{
      method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({label:'structure-and-feel',passed:checks.every((item)=>item.ok),checks}),
    })
  </script>
</body>
</html>
