<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — structure and feel</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * The acceptance criteria of `docs/11-structure-and-feel.md`, sections A
       * to F, driven against the real app.
       *
       * Contrast and geometry are computed rather than eyeballed, as `docs/04`
       * requires — the whole point of section E is a palette derived from a
       * picture, and a palette derived from a picture is exactly the kind that
       * looks right and fails AA.
       */
      import { bootstrap } from '../../src/app/bootstrap.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }) }
      const q = (s) => document.querySelector(s)
      const qa = (s) => [...document.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 0))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      // --- contrast, computed ------------------------------------------------
      const channel = (v) => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4 }
      const parse = (css) => {
        // Tokens come back as hex; computed styles come back as rgb().
        const text = String(css).trim()
        const hex = text.match(/^#([0-9a-f]{6})$/i)
        if (hex) return [0, 2, 4].map((k) => parseInt(hex[1].slice(k, k + 2), 16))
        return (text.match(/[\d.]+/g) ?? []).map(Number)
      }
      const luminance = ([r, g, b]) => 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b)
      function ratio(fg, bg) {
        const f = parse(fg), b = parse(bg)
        const a = f[3] === undefined ? 1 : f[3]
        const over = [0, 1, 2].map((i) => f[i] * a + b[i] * (1 - a))
        const [hi, lo] = [luminance(over), luminance(b)].sort((x, y) => y - x)
        return (hi + 0.05) / (lo + 0.05)
      }
      const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim()

      try {
        const tempered = await bootstrap({ storage: createMemoryStorage() })
        await tempered.app.show('today')
        await waitFor('.row')

        // ===================================================================
        // E — the scheme is the artwork's, and it is legible
        // ===================================================================
        check('E the ground is the night-forest gradient, not jet black',
          /gradient/.test(getComputedStyle(document.body).backgroundImage)
          && token('--bg-3') === '#237494',
          token('--bg-0') + ' -> ' + token('--bg-3'))

        const backdrop = getComputedStyle(document.body, '::before')
        const opacity = Number(backdrop.opacity)
        check('E the backdrop is dimmed to 12-18%', opacity >= 0.12 && opacity <= 0.18, String(opacity))
        check('E the backdrop is blurred 2-3px', /blur\((2(\.\d+)?|3)px\)/.test(backdrop.filter), backdrop.filter)
        check('E the backdrop is fixed and anchored to the bottom',
          backdrop.position === 'fixed' && /(bottom|100%)$/.test(backdrop.backgroundPosition.trim()),
          `${backdrop.position} / ${backdrop.backgroundPosition}`)

        const surface = token('--surface')
        const attrs = ['might', 'wind', 'grit', 'vitality', 'mind']
        const worst = attrs
          .map((a) => ({ a, r: ratio(token(`--${a}`), surface) }))
          .sort((x, y) => x.r - y.r)[0]
        check('E every attribute colour clears AA as text on a card',
          worst.r >= 4.5, `worst is ${worst.a} at ${worst.r.toFixed(2)}:1`)

        const glyphWorst = attrs
          .map((a) => ({ a, r: ratio(token('--canopy'), token(`--${a}`)) }))
          .sort((x, y) => x.r - y.r)[0]
        check('E a glyph on any attribute tile clears 3:1',
          glyphWorst.r >= 3, `worst is ${glyphWorst.a} at ${glyphWorst.r.toFixed(2)}:1`)

        check('E acid survives unchanged as the action accent', token('--acid') === '#edfe73', token('--acid'))

        // ===================================================================
        // A — every row is differentiated by a coloured tile
        // ===================================================================
        const rows = qa('.row')
        const tiles = rows.map((r) => r.querySelector('.tile')).filter(Boolean)
        check('A every row opens with an icon tile', tiles.length === rows.length,
          `${tiles.length} tiles across ${rows.length} rows`)

        const box = tiles[0].getBoundingClientRect()
        check('A the tile is 32px', Math.round(box.width) === 32 && Math.round(box.height) === 32,
          `${Math.round(box.width)}x${Math.round(box.height)}`)
        check('A each tile carries a drawn glyph, never text',
          tiles.every((t) => t.querySelector('svg')), 'svg in every tile')

        // The colour has to identify the attribute, which is the whole point.
        const tinted = new Set(tiles.map((t) => getComputedStyle(t).backgroundColor))
        check('A tiles are coloured by attribute, not all alike', tinted.size >= 2,
          `${tinted.size} distinct tile colours on screen`)
        const trainTile = q('[data-task] .tile')
        check('A a training slot wears Might', trainTile?.dataset.attribute === 'might',
          trainTile?.dataset.attribute)

        // ===================================================================
        // B — named sections, each carrying a count
        // ===================================================================
        const sections = qa('.sect')
        check('B Today is divided into named sections', sections.length >= 2,
          sections.map((s) => s.dataset.section).join(', '))
        const titles = qa('.sect__title').map((t) => t.textContent)
        check('B the sections are TRAIN, RECOVER and SHARPEN',
          titles.every((t) => /TRAIN|RECOVER|SHARPEN/.test(t)), titles.join(' | '))
        check('B each heading carries a completion count',
          qa('.sect__count').every((c) => /^\d+ of \d+$/.test(c.textContent.trim())),
          qa('.sect__count').map((c) => c.textContent.trim()).join(', '))

        // ===================================================================
        // D — progress is visible before the list
        // ===================================================================
        const strip = q('.strip')
        check('D a summary strip is on screen', strip !== null)
        check('D it sits above the first section',
          strip.getBoundingClientRect().top < q('.sect').getBoundingClientRect().top)
        check('D it shows a bar for each of the five attributes',
          qa('.strip__bar').length === 5, `${qa('.strip__bar').length} bars`)

        const movedBefore = qa('.strip__bar[data-moved="true"]').length

        // ===================================================================
        // C — something happens when you log
        // ===================================================================
        const rest = await waitFor('[data-log="rest_day"]')
        const restRow = rest.closest('.row')
        rest.click()
        await settle(); await settle()
        await new Promise((r) => setTimeout(r, 30))

        const float = q('.float')
        check('C the XP floats up beside the row that earned it', float !== null,
          float?.textContent ?? 'no float')
        check('C the float is in the attribute’s colour',
          float?.dataset.attribute === 'vitality', float?.dataset.attribute)
        const floatColour = float ? getComputedStyle(float).color : ''
        check('C and that colour is legible where it floats',
          float ? ratio(floatColour, surface) >= 4.5 : false,
          float ? `${ratio(floatColour, surface).toFixed(2)}:1` : '')

        const loggedRow = q('[data-worked="rest_day"], [data-activity="rest_day"]')
        const fill = loggedRow?.querySelector('.ring__fill')
        check('C the ring completes on the logged row',
          fill ? Number(fill.getAttribute('stroke-dashoffset')) < 0.5 : false,
          fill?.getAttribute('stroke-dashoffset'))

        check('D the strip moves once something is logged',
          qa('.strip__bar[data-moved="true"]').length > movedBefore,
          `${movedBefore} -> ${qa('.strip__bar[data-moved="true"]').length} attributes moved`)

        // No punishment, ever — including in the celebration.
        const beat = q('.daybeat')
        check('C the day-complete beat is not a modal to dismiss',
          beat === null || beat.querySelector('button') === null, 'no button in the beat')

        // ===================================================================
        // F3 — water arrives in pieces
        // ===================================================================
        const quick = qa('[data-quickadd^="water:"]')
        check('F3 water offers quick-add amounts', quick.length === 3,
          quick.map((b) => b.textContent).join(' '))
        quick[0].click(); await settle(); await settle()
        await new Promise((r) => setTimeout(r, 20))
        const afterOne = (await tempered.daily.dayLog(tempered.clock.today())).waterOz
        // The buttons must still be reachable after the first add — that is the
        // whole point of an activity that arrives in pieces.
        const again = qa('[data-quickadd^="water:"]')
        check('F3 quick-add is still there after the first glass', again.length === 3,
          `${again.length} buttons after logging`)
        again[0].click(); await settle(); await settle()
        await new Promise((r) => setTimeout(r, 20))
        const afterTwo = (await tempered.daily.dayLog(tempered.clock.today())).waterOz
        check('F3 quick-adds accumulate rather than replace',
          afterTwo === afterOne * 2 && afterOne === 8, `${afterOne} then ${afterTwo} oz`)
        check('F3 a manual field is still there for correction',
          q('[data-entry="water"]') !== null)

        // ===================================================================
        // F2 — editing the first set cascades
        // ===================================================================
        await tempered.app.show('train')
        await waitFor('[data-programday]')
        q('[data-programday="monday"]').click()
        await waitFor('.setrow__check')

        const weights = () => qa('input.setrow__num[data-field="weight"]')
        const firstCard = q('[data-exercise]')
        const inCard = () => [...firstCard.querySelectorAll('input.setrow__num[data-field="weight"]')]

        // Log set 1 at one weight, so there is a logged set to protect.
        const w = inCard()
        w[0].value = '95'; w[0].dispatchEvent(new Event('change'))
        await settle()
        q('.setrow__check').click()
        await settle(); await new Promise((r) => setTimeout(r, 20))

        // Now change set 1 again — it is logged, so nothing should cascade from
        // it; then change the first UNLOGGED set and watch the rest follow.
        const after = [...q('[data-exercise]').querySelectorAll('input.setrow__num[data-field="weight"]')]
        check('F2 the logged set keeps what was logged', after[0].value === '95', after[0].value)

        await tempered.app.show('train')
        await waitFor('[data-programday]')
        q('[data-programday="tuesday"]')?.click() ?? q('[data-programday]').click()
        await waitFor('.setrow__check')
        const fresh = [...q('[data-exercise]').querySelectorAll('input.setrow__num[data-field="weight"]')]
        check('F2 there are several sets to cascade into', fresh.length >= 3, `${fresh.length} sets`)
        fresh[0].value = '135'
        fresh[0].dispatchEvent(new Event('change'))
        await settle(); await new Promise((r) => setTimeout(r, 20))
        const cascaded = [...q('[data-exercise]').querySelectorAll('input.setrow__num[data-field="weight"]')]
        check('F2 editing set 1 fills the remaining sets',
          cascaded.slice(1).every((i) => i.value === '135'),
          cascaded.map((i) => i.value || '-').join(', '))
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 400))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'structure-and-feel', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
