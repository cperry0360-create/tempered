<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — uplifted surface acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/uplift.css" />
    <link rel="stylesheet" href="../../src/calm.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /** Browser-painted surface checks for the brighter planner tracker. */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s, root = document) => root?.querySelector(s) ?? null
      const qa = (s, root = document) => root ? [...root.querySelectorAll(s)] : []

      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      const parse = (css) => (String(css).match(/[\d.]+/g) ?? []).map(Number)
      const opaque = (css) => Boolean(css) && css !== 'transparent' && (parse(css)[3] ?? 1) !== 0

      try {
        const tempered = await bootstrap({ storage: createMemoryStorage(), mount: document.getElementById('app') })
        await tempered.app.show('today')
        await waitFor('.screen--today-calm')

        const bar = q('.tabbar')
        const barBox = bar.getBoundingClientRect()
        check('bottom navigation is a full-width solid bar',
          Math.round(barBox.left) === 0 && Math.round(document.documentElement.clientWidth - barBox.right) === 0,
          `${Math.round(barBox.left)} / ${Math.round(document.documentElement.clientWidth - barBox.right)}px`)
        const barStyle = getComputedStyle(bar)
        check('bottom navigation is opaque and unblurred',
          !(barStyle.backdropFilter || barStyle.webkitBackdropFilter || '').includes('blur')
          && (parse(barStyle.backgroundColor)[3] ?? 1) === 1,
          barStyle.backgroundColor)

        check('Today has no persistent global FAB competing with the tracker', q('.fab') === null)
        check('Today follows the approved dashboard order',
          qa('.screen--today > .today-card').map((node) => node.dataset.section).join('|') === 'next-session|readiness|week|fuel|daily')
        check('Today has no legacy summary, calendar, planner, or workout-control section',
          !q('[data-summary="daily"]') && !q('.today-calendar') && !q('[data-section="planner"]') && !q('[data-section="training"]'))
        check('Today exposes companion and Settings in its own header',
          Boolean(q('.today-companion')) && Boolean(q('.today-settings')))
        check('Today has one compact calendar-week signal',
          qa('[data-section="week"] .today-week__day').length === 7)
        check('Fuel has exactly two progress bars and one meal action',
          qa('[data-section="fuel"] [role="progressbar"]').length === 2 && Boolean(q('.today-fuel-card__add')))
        check('Daily log is one shared surface instead of one card per task',
          qa('[data-section="daily"] .today-list').length === 1)
        check('Log something else is inside Daily log',
          Boolean(q('[data-section="daily"] [data-other="toggle"]')))

        const todayTargets = qa('.screen--today-calm .today-item, .screen--today-calm .today-item__quick, .tabbar__tab')
          .filter((node) => node.getBoundingClientRect().height > 0)
        const smallToday = todayTargets.filter((node) => node.getBoundingClientRect().height < 44)
        check('primary Today rows, quick actions, and navigation remain thumb sized', smallToday.length === 0,
          `${todayTargets.length - smallToday.length}/${todayTargets.length} are at least 44px`)

        const dailyCard = q('[data-section="daily"]')
        const dailyStyle = getComputedStyle(dailyCard)
        check('Daily log is one rounded opaque card',
          Number.parseFloat(dailyStyle.borderRadius) === 16 && opaque(dailyStyle.backgroundColor),
          `${dailyStyle.borderRadius} radius`)

        const rowBackgrounds = new Set(qa('[data-section="daily"] .today-item')
          .map((node) => getComputedStyle(node).backgroundColor))
        check('habit rows do not each become a loud colored card', rowBackgrounds.size === 1,
          `${rowBackgrounds.size} row background color`)

        check('the page does not scroll sideways', document.documentElement.scrollWidth <= innerWidth,
          `${document.documentElement.scrollWidth}px content in ${innerWidth}px viewport`)

        // Train and session retain the denser, action-oriented treatment.
        await tempered.app.show('train')
        await waitFor('[data-programday="monday"]')
        check('Train still exposes program days directly', qa('[data-programday]').length >= 3)
        q('[data-programday="monday"]')?.click()
        await waitFor('.setrow__check')

        const setTargets = qa('.setrow__check, .actionpill, .addset')
          .filter((node) => node.getBoundingClientRect().height > 0)
        const smallSetTargets = setTargets.filter((node) => node.getBoundingClientRect().height < 44)
        check('workout actions remain thumb sized', smallSetTargets.length === 0,
          `${setTargets.length - smallSetTargets.length}/${setTargets.length} at least 44px`)

        const fields = qa('.setrow:not(.setrow--head) .setrow__num')
        const unrounded = fields.filter((field) => Number.parseFloat(getComputedStyle(field).borderRadius) < 4)
        check('workout number fields remain distinct rounded cells', fields.length > 0 && unrounded.length === 0,
          `${fields.length - unrounded.length}/${fields.length} rounded`)

        const activeRow = q('.setrow[data-active="true"]')
        const edge = q('.setrow__edge', activeRow)
        check('the active set still has its focused edge treatment',
          edge !== null && Math.round(edge.getBoundingClientRect().width) === 4)

        const pills = qa('.exercise .actionpill')
        check('exercise actions remain visible rather than hidden in a menu',
          pills.length >= 4 && pills.every((pill) => q('svg.icon', pill) !== null),
          `${pills.length} visible actions`)

        q('[data-action="finish"]')?.click()
        await waitFor('[data-action="confirm-finish"]')
        check('finishing a workout still requires an explicit confirmation', q('[data-action="confirm-finish"]') !== null)
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 400))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'surface', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
