<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — flexible task model acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/calm.css" />
    <link rel="stylesheet" href="../../src/uplift.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * Today is a daily workout checklist backed by the exact same program-slot
       * records as Train. Today's slots are shown directly; unfinished earlier
       * slots roll forward through the workout week and partial sets stay visible.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
      import { fixedClock } from '../../src/adapters/clock/clock.js'
      import { VERSION, BUILD_DATE } from '../../src/version.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s) => document.querySelector(s)
      const qa = (s) => [...document.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 55))

      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      async function openWorkout() {
        await waitFor('[data-section="training"][data-daily-workout-fingerprint]')
        const fold = q('[data-fold="training"] .today-section__fold')
        if (fold?.getAttribute('aria-expanded') !== 'true') { fold?.click(); await settle() }
        return waitFor('[data-daily-workout-task]')
      }

      try {
        const storage = createMemoryStorage()
        const clock = fixedClock(new Date(2026, 8, 7, 9, 0, 0)) // Monday
        const tempered = await bootstrap({ storage, clock, mount: document.getElementById('app') })

        await tempered.app.show('today')
        await waitFor('[data-section="training"][data-daily-workout-fingerprint]')
        const trainingFold = q('[data-fold="training"] .today-section__fold')
        check('Today has a dedicated collapsible Workout surface',
          trainingFold !== null
          && trainingFold.getAttribute('aria-expanded') === 'false'
          && q('[data-section="training"] .today-section__title')?.textContent === 'Workout')
        check('the full workout remains available as one action',
          /start full session/i.test(q('[data-section="training"] .today-section__start')?.textContent ?? ''))

        await openWorkout()
        let workoutRows = qa('[data-daily-workout-task]')
        check('opening Workout exposes Monday\'s actual prescribed movements',
          workoutRows.length > 1 && workoutRows.every((row) => row.dataset.rollover === 'false'),
          `${workoutRows.length} Monday movements`)
        check('each movement shows set-level progress, not a weekly frequency score',
          workoutRows.every((row) => /\d+ \/ \d+ sets/.test(row.textContent) && !/this week/.test(row.textContent)),
          workoutRows[0]?.textContent?.trim())

        await tempered.app.show('train')
        await waitFor('[data-programday]')
        check('detailed program days remain available in Train', qa('[data-programday]').length >= 3,
          `${qa('[data-programday]').length} program days`)

        // Prove the independent path uses the same canonical task/session data.
        const before = await storage.count('sessions')
        const tuesdayTask = { dayId: 'tuesday', slotIndex: 0, exerciseId: 'front_squat' }
        await tempered.workout.completeSlot(tuesdayTask, [
          { weight: 95, reps: 8 },
          { weight: 95, reps: 8 },
          { weight: 95, reps: 8 },
        ])
        check('a slot can be logged independently through the task model',
          (await storage.count('sessions')) >= before,
          `${await storage.count('sessions')} stored sessions`)

        const gritRow = [...(await storage.getAll('attributeState'))].find((row) => row.attribute === 'grit')
        check('independent training work still accrues Grit', (gritRow?.xp ?? 0) > 0,
          `grit ${gritRow?.xp ?? 0} xp`)

        // Leave Monday's first slot partially complete, then move the clock to Thursday.
        const mondayTask = { dayId: 'monday', slotIndex: 0, exerciseId: 'incline_bench_bb' }
        await tempered.workout.completeSlot(mondayTask, [{ weight: 135, reps: 8 }, { weight: 135, reps: 8 }])
        clock.advanceDays(3)
        let status = await tempered.workout.weekStatus()
        let mondaySlot = status.week.days.find((day) => day.day.id === 'monday').tasks[0]
        check('an unfinished Monday slot is still canonically open on Thursday',
          mondaySlot.done === false && mondaySlot.started === true,
          `${mondaySlot.logged} of ${mondaySlot.prescribed} logged`)

        await tempered.app.show('today')
        await openWorkout()
        workoutRows = qa('[data-daily-workout-task]')
        const rolled = workoutRows.find((row) => row.dataset.rollover === 'true' && row.dataset.dailyWorkoutTask === 'monday#0')
        check('Thursday Today visibly rolls the unfinished Monday movement forward',
          rolled !== undefined && /Rolled from/i.test(rolled.textContent), rolled?.textContent?.trim())
        check('the rollover row preserves partial set progress',
          rolled?.dataset.logged === '2' && Number(rolled?.dataset.prescribed) > 2,
          `${rolled?.dataset.logged ?? '?'} / ${rolled?.dataset.prescribed ?? '?'} sets`)
        check('Thursday\'s own workout tasks appear beside rollover work',
          workoutRows.some((row) => row.dataset.rollover === 'false'),
          `${workoutRows.filter((row) => row.dataset.rollover === 'false').length} current-day rows`)

        await tempered.workout.completeSlot(mondayTask, [{ weight: 135, reps: 8 }, { weight: 135, reps: 8 }])
        status = await tempered.workout.weekStatus()
        check('the carried slot remains completable later in the same week',
          status.week.days.find((day) => day.day.id === 'monday').tasks[0].done === true)
        await tempered.app.show('today'); await openWorkout()
        check('finishing the rolled slot removes it from the active daily workout queue',
          qa('[data-daily-workout-task][data-rollover="true"][data-daily-workout-task="monday#0"]').length === 0)

        clock.advanceDays(7)
        status = await tempered.workout.weekStatus()
        check('outstanding slots clear at the workout week boundary',
          status.week.done === 0 && status.week.total === 30,
          `${status.week.done} of ${status.week.total} done in the new week`)

        await tempered.app.show('train')
        await waitFor('[data-weekday]')
        check('Train still shows the week\'s detailed work', qa('[data-weekday]').length === 5)
        q('[data-guide]')?.click(); await settle()
        const chest = qa('.guide__row').find((row) => row.dataset.group === 'chest')
        check('hard sets remain shown against target per muscle group',
          /\d+ \/ 12–16/.test(chest?.textContent ?? ''), chest?.textContent?.trim())

        const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
        const screens = []
        for (const tab of ['today', 'train', 'history']) {
          await tempered.app.show(tab)
          await settle()
          screens.push([tab, document.body.innerText])
        }
        const offenders = screens.filter(([, text]) => forbidden.test(text))
          .map(([tab, text]) => `${tab}: "${text.match(forbidden)[0]}"`)
        check('nothing rendered calls outstanding work overdue, late, missed or failed',
          offenders.length === 0, offenders.join('; ') || 'checked today, train, progress')

        await tempered.app.show('today'); await settle()
        const outstanding = qa('[data-section="daily"] [data-complete="false"], [data-section="weekly"] [data-complete="false"]')
        const alarming = (css) => {
          const [r, g, b] = (String(css).match(/\d+/g) ?? []).map(Number)
          if ([r, g, b].some((n) => n === undefined)) return false
          return r - g > 60 && r - b > 60
        }
        const reds = outstanding.filter((node) =>
          [node, ...node.querySelectorAll('*')].some((child) => {
            const style = getComputedStyle(child)
            return [style.color, style.backgroundColor, style.borderTopColor, style.fill, style.stroke].some(alarming)
          }))
        check('outstanding Today work is not rendered as a red problem state', reds.length === 0,
          `${outstanding.length} outstanding elements checked`)

        await tempered.app.show('settings')
        await waitFor('[data-version]')
        check('the version is displayed in Settings', q('[data-version]')?.textContent === VERSION,
          q('[data-version]')?.textContent)
        check('the last-updated date is shown beside it', (q('[data-builddate]')?.textContent ?? '').length > 5,
          q('[data-builddate]')?.textContent)

        const phase = VERSION.match(/\((\d+(?:\.\d+)?)\)$/)?.[1] ?? null
        const buildPlan = await fetch('../../docs/07-build-plan.md').then((response) => response.text())
        const phaseHeading = phase ? new RegExp(`^## Phase ${phase.replace('.', '\\.')}\\b`, 'm') : null
        check('the version names a phase that exists in docs/07',
          Boolean(phase && phaseHeading?.test(buildPlan)), phase ? `${VERSION} -> Phase ${phase}` : VERSION)
        check('the service worker cache identity remains versioned',
          typeof VERSION === 'string' && VERSION.length > 0 && BUILD_DATE.length > 0,
          `VERSION ${VERSION}, built ${BUILD_DATE}`)
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 500))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'task-model', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
