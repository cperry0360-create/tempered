<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — task model acceptance</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { VERSION, BUILD_DATE } from '../../src/version.js'

    const checks=[]
    const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail??'')})
    const q=(s)=>document.querySelector(s)
    const qa=(s)=>[...document.querySelectorAll(s)]
    const settle=(ms=70)=>new Promise((resolve)=>setTimeout(resolve,ms))
    async function waitFor(selector, timeout=5000){
      const end=Date.now()+timeout
      while(Date.now()<end){const node=q(selector);if(node)return node;await settle(20)}
      return null
    }
    const payload=(entry,task)=>({dayId:entry.day.id,slotIndex:task.index,exerciseId:task.slot.exerciseId})
    const sets=(count,weight=95)=>Array.from({length:count},()=>({weight,reps:8}))

    try{
      const storage=createMemoryStorage()
      const clock=fixedClock(new Date(2026,8,10,9,0,0))
      const tempered=await bootstrap({storage,clock,mount:q('#app')})

      await tempered.app.show('today')
      await waitFor('[data-section="next-session"]')
      check('R2 Today shows one next-session card instead of a workout task queue',
        /Upper Specialization/i.test(q('[data-section="next-session"]')?.textContent??'')
        && q('[data-section="training"]')===null)
      check('Today preserves a full-session route', q('[data-startday="thursday"]')!==null)

      let status=await tempered.workout.weekStatus()
      const monday=status.week.days.find((entry)=>entry.day.id==='monday')
      const thursday=status.week.days.find((entry)=>entry.day.id==='thursday')
      check('program task data remains available for Monday and Thursday', Boolean(monday?.tasks?.length&&thursday?.tasks?.length))

      const mondayFirst=monday.tasks[0]
      const mondayPartial=Math.min(2,Math.max(1,mondayFirst.prescribed-1))
      await tempered.workout.completeSlot(payload(monday,mondayFirst),sets(mondayPartial,135))
      status=await tempered.workout.weekStatus()
      const carried=status.week.days.find((entry)=>entry.day.id==='monday').tasks[mondayFirst.index]
      check('unfinished earlier-week work retains partial canonical progress',
        carried.logged===mondayPartial && carried.done===false,
        `${carried.logged}/${carried.prescribed}`)
      const grit=[...(await storage.getAll('attributeState'))].find((row)=>row.attribute==='grit')
      check('between-call training still earns Grit', (grit?.xp??0)>0, grit?.xp??0)

      status=await tempered.workout.weekStatus()
      const thursdayNow=status.week.days.find((entry)=>entry.day.id==='thursday')
      const todayFirst=thursdayNow.tasks[0]
      const todaySecond=thursdayNow.tasks[1]
      await tempered.workout.completeSlot(payload(thursdayNow,todayFirst),sets(1,115))
      if(todaySecond) await tempered.workout.completeSlot(payload(thursdayNow,todaySecond),sets(todaySecond.prescribed,35))

      await tempered.app.show('today')
      q('[data-startday="thursday"]')?.click()
      await waitFor(`[data-exercise="${todayFirst.slot.exerciseId}"]`)
      const remainingChecks=qa(`[data-exercise="${todayFirst.slot.exerciseId}"] .setrow__check`).length
      check('Today Start session respects already-logged sets',
        remainingChecks===todayFirst.prescribed-1,
        `${remainingChecks} remaining of ${todayFirst.prescribed}`)
      if(todaySecond){
        check('Today Start session omits an already-completed movement',
          q(`[data-exercise="${todaySecond.slot.exerciseId}"]`)===null)
      }

      q('[data-action="finish"]')?.click()
      await waitFor('[data-action="confirm-finish"]')
      q('[data-action="confirm-finish"]')?.click(); await settle()
      if(q('[data-action="done"]')){q('[data-action="done"]')?.click();await settle()}

      status=await tempered.workout.weekStatus()
      const mondayLater=status.week.days.find((entry)=>entry.day.id==='monday')
      const old=mondayLater.tasks[mondayFirst.index]
      const remain=Math.max(0,old.prescribed-old.logged)
      if(remain>0) await tempered.workout.completeSlot(payload(mondayLater,old),sets(remain,135))
      status=await tempered.workout.weekStatus()
      check('rolled work remains completable later in the same workout week',
        status.week.days.find((entry)=>entry.day.id==='monday').tasks[mondayFirst.index].done===true)

      await tempered.app.show('train')
      await waitFor('[data-programday]')
      check('the detailed program remains available in Train', qa('[data-programday]').length>=3, qa('[data-programday]').length)

      const forbidden=/\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
      const screens=[]
      for(const tab of ['today','train','history']){
        await tempered.app.show(tab);await settle()
        screens.push(document.body.innerText)
      }
      check('outstanding work is never described as debt or failure', screens.every((text)=>!forbidden.test(text)))

      await tempered.app.show('settings')
      await waitFor('[data-version]')
      check('Settings shows the current version', q('[data-version]')?.textContent===VERSION, q('[data-version]')?.textContent)
      check('the service-worker identity remains versioned', VERSION.length>0&&BUILD_DATE.length>0, `${VERSION} / ${BUILD_DATE}`)

      clock.advanceDays(11)
      status=await tempered.workout.weekStatus()
      check('the next workout week starts clean', status.week.done===0&&status.week.total===31, `${status.week.done} of ${status.week.total}`)
    }catch(error){
      check('harness threw',false,String(error?.stack??error).slice(0,700))
    }

    await fetch('/__report',{
      method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({label:'task-model',passed:checks.every((item)=>item.ok),checks}),
    })
  </script>
</body>
</html>
