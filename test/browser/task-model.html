<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — flexible task model acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="../../src/calm.css" />
    <link rel="stylesheet" href="../../src/uplift.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * Today is a daily workout checklist backed by the exact same program-slot
       * records as Train. Today's slots are shown directly; unfinished earlier
       * slots roll forward through the workout week and partial sets stay visible.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
      import { fixedClock } from '../../src/adapters/clock/clock.js'
      import { VERSION, BUILD_DATE } from '../../src/version.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s) => document.querySelector(s)
      const qa = (s) => [...document.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 60))

      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      async function openWorkout() {
        await waitFor('[data-section="training"][data-daily-workout-fingerprint]')
        const fold = q('[data-fold="training"] .today-section__fold')
        if (fold?.getAttribute('aria-expanded') !== 'true') fold?.click()
        return waitFor('[data-daily-workout-task]')
      }

      const taskPayload = (dayEntry, task) => ({
        dayId: dayEntry.day.id,
        slotIndex: task.index,
        exerciseId: task.slot.exerciseId,
      })
      const fakeSets = (count, weight = 95) => Array.from({ length: count }, () => ({ weight, reps: 8 }))

      try {
        const storage = createMemoryStorage()
        const clock = fixedClock(new Date(2026, 8, 10, 9, 0, 0)) // Thursday
        const tempered = await bootstrap({ storage, clock, mount: document.getElementById('app') })

        await tempered.app.show('today')
        await waitFor('[data-section="training"][data-daily-workout-fingerprint]')
        const trainingFold = q('[data-fold="training"] .today-section__fold')
        check('Today has a dedicated collapsible Workout surface',
          trainingFold !== null
          && trainingFold.getAttribute('aria-expanded') === 'false'
          && q('[data-section="training"] .today-section__title')?.textContent === 'Workout')
        check('the full workout remains available as one action',
          /start full session/i.test(q('[data-section="training"] .today-section__start')?.textContent ?? ''))

        await openWorkout()
        let workoutRows = qa('[data-daily-workout-task]')
        check('Thursday shows current-day workout work plus earlier unfinished rollover work',
          workoutRows.some((row) => row.dataset.rollover === 'false')
          && workoutRows.some((row) => row.dataset.rollover === 'true'),
          `${workoutRows.filter((row) => row.dataset.rollover === 'false').length} today + ${workoutRows.filter((row) => row.dataset.rollover === 'true').length} rollover`)
        check('each movement shows set-level progress, not a weekly frequency score',
          workoutRows.every((row) => /\d+ \/ \d+ sets/.test(row.textContent) && !/this week/.test(row.textContent)),
          workoutRows[0]?.textContent?.trim())

        let status = await tempered.workout.weekStatus()
        const monday = status.week.days.find((entry) => entry.day.id === 'monday')
        const thursday = status.week.days.find((entry) => entry.day.id === 'thursday')
        check('the active program exposes Monday and Thursday slot tasks', Boolean(monday?.tasks?.length && thursday?.tasks?.length))

        // The between-calls path: do only part of a Monday movement on Thursday.
        const mondayFirst = monday.tasks[0]
        const mondayPartial = Math.min(2, Math.max(1, mondayFirst.prescribed - 1))
        await tempered.workout.completeSlot(taskPayload(monday, mondayFirst), fakeSets(mondayPartial, 135))
        const gritRow = [...(await storage.getAll('attributeState'))].find((row) => row.attribute === 'grit')
        check('independent between-call training still accrues Grit', (gritRow?.xp ?? 0) > 0,
          `grit ${gritRow?.xp ?? 0} xp`)

        await tempered.app.show('today')
        await openWorkout()
        workoutRows = qa('[data-daily-workout-task]')
        let rolled = workoutRows.find((row) => row.dataset.dailyWorkoutTask === `monday#${mondayFirst.index}`)
        check('the unfinished Monday movement visibly rolls into Thursday',
          rolled?.dataset.rollover === 'true' && /Rolled from/i.test(rolled.textContent), rolled?.textContent?.trim())
        check('the rollover row preserves partial set progress',
          Number(rolled?.dataset.logged) === mondayPartial
          && Number(rolled?.dataset.prescribed) === mondayFirst.prescribed,
          `${rolled?.dataset.logged ?? '?'} / ${rolled?.dataset.prescribed ?? '?'} sets`)

        // Now do one set of today's first movement and fully complete today's second.
        status = await tempered.workout.weekStatus()
        const thursdayNow = status.week.days.find((entry) => entry.day.id === 'thursday')
        const todayFirst = thursdayNow.tasks[0]
        const todaySecond = thursdayNow.tasks[1]
        await tempered.workout.completeSlot(taskPayload(thursdayNow, todayFirst), fakeSets(1, 115))
        if (todaySecond) {
          await tempered.workout.completeSlot(taskPayload(thursdayNow, todaySecond), fakeSets(todaySecond.prescribed, 35))
        }

        await tempered.app.show('today')
        await openWorkout()
        const partialTodayRow = q(`[data-daily-workout-task="thursday#${todayFirst.index}"]`)
        check('today row immediately reflects one set chipped away outside the full session',
          partialTodayRow?.dataset.logged === '1'
          && Number(partialTodayRow?.dataset.prescribed) === todayFirst.prescribed,
          `${partialTodayRow?.dataset.logged ?? '?'} / ${partialTodayRow?.dataset.prescribed ?? '?'} sets`)
        if (todaySecond) {
          const completedTodayRow = q(`[data-daily-workout-task="thursday#${todaySecond.index}"]`)
          check('a movement completed outside the full session stays visibly complete on Today',
            completedTodayRow?.dataset.done === 'true', completedTodayRow?.textContent?.trim())
        }

        // The full-session route must consume that exact same progress: the
        // partial movement offers only remaining sets and the completed movement
        // is omitted entirely.
        q('[data-section="training"] .today-section__start')?.click()
        await waitFor(`[data-exercise="${todayFirst.slot.exerciseId}"]`)
        const remainingChecks = qa(`[data-exercise="${todayFirst.slot.exerciseId}"] .setrow__check`).length
        check('full session only offers the remaining sets of a partially completed movement',
          remainingChecks === todayFirst.prescribed - 1,
          `${remainingChecks} remaining of ${todayFirst.prescribed}`)
        if (todaySecond) {
          check('full session skips a movement already completed through the daily checklist',
            q(`[data-exercise="${todaySecond.slot.exerciseId}"]`) === null)
        }
        q('[data-action="finish"]')?.click()
        await waitFor('[data-action="confirm-finish"]')
        q('[data-action="confirm-finish"]')?.click()
        await waitFor('[data-section="training"]')

        // Finish Monday's rolled slot and prove it leaves the active queue.
        status = await tempered.workout.weekStatus()
        const mondayNow = status.week.days.find((entry) => entry.day.id === 'monday')
        const carried = mondayNow.tasks[mondayFirst.index]
        const remainingMonday = Math.max(0, carried.prescribed - carried.logged)
        if (remainingMonday > 0) {
          await tempered.workout.completeSlot(taskPayload(mondayNow, carried), fakeSets(remainingMonday, 135))
        }
        status = await tempered.workout.weekStatus()
        check('the carried slot remains completable later in the same workout week',
          status.week.days.find((entry) => entry.day.id === 'monday').tasks[mondayFirst.index].done === true)
        await tempered.app.show('today'); await openWorkout()
        rolled = q(`[data-daily-workout-task="monday#${mondayFirst.index}"][data-rollover="true"]`)
        check('finishing the rolled slot removes it from the active daily workout queue', rolled === null)

        await tempered.app.show('train')
        await waitFor('[data-programday]')
        check('detailed program days remain available in Train', qa('[data-programday]').length >= 3,
          `${qa('[data-programday]').length} program days`)
        await waitFor('[data-weekday]')
        q('[data-guide]')?.click(); await settle()
        const chest = qa('.guide__row').find((row) => row.dataset.group === 'chest')
        check('hard sets remain shown against target per muscle group',
          /\d+ \/ 12–16/.test(chest?.textContent ?? ''), chest?.textContent?.trim())

        const forbidden = /\b(overdue|late|missed|missing|failed|failure|behind|skipped|expired|penalty|debt)\b/i
        const screens = []
        for (const tab of ['today', 'train', 'history']) {
          await tempered.app.show(tab)
          await settle()
          screens.push([tab, document.body.innerText])
        }
        const offenders = screens.filter(([, text]) => forbidden.test(text))
          .map(([tab, text]) => `${tab}: "${text.match(forbidden)[0]}"`)
        check('nothing rendered calls outstanding work overdue, late, missed or failed',
          offenders.length === 0, offenders.join('; ') || 'checked today, train, progress')

        await tempered.app.show('today'); await settle()
        const outstanding = qa('[data-section="daily"] [data-complete="false"], [data-section="weekly"] [data-complete="false"]')
        const alarming = (css) => {
          const [r, g, b] = (String(css).match(/\d+/g) ?? []).map(Number)
          if ([r, g, b].some((n) => n === undefined)) return false
          return r - g > 60 && r - b > 60
        }
        const reds = outstanding.filter((node) =>
          [node, ...node.querySelectorAll('*')].some((child) => {
            const style = getComputedStyle(child)
            return [style.color, style.backgroundColor, style.borderTopColor, style.fill, style.stroke].some(alarming)
          }))
        check('outstanding Today work is not rendered as a red problem state', reds.length === 0,
          `${outstanding.length} outstanding elements checked`)

        await tempered.app.show('settings')
        await waitFor('[data-version]')
        check('the version is displayed in Settings', q('[data-version]')?.textContent === VERSION,
          q('[data-version]')?.textContent)
        check('the last-updated date is shown beside it', (q('[data-builddate]')?.textContent ?? '').length > 5,
          q('[data-builddate]')?.textContent)

        const phase = VERSION.match(/\((\d+(?:\.\d+)?)\)$/)?.[1] ?? null
        const buildPlan = await fetch('../../docs/07-build-plan.md').then((response) => response.text())
        const phaseHeading = phase ? new RegExp(`^## Phase ${phase.replace('.', '\\.')}\\b`, 'm') : null
        check('the version names a phase that exists in docs/07',
          Boolean(phase && phaseHeading?.test(buildPlan)), phase ? `${VERSION} -> Phase ${phase}` : VERSION)
        check('the service worker cache identity remains versioned',
          typeof VERSION === 'string' && VERSION.length > 0 && BUILD_DATE.length > 0,
          `VERSION ${VERSION}, built ${BUILD_DATE}`)

        // Week-boundary reset is domain behavior; test it after all Today UI
        // assertions so the fixed-date screen is not asked to time travel.
        clock.advanceDays(7)
        status = await tempered.workout.weekStatus()
        check('outstanding slots clear at the workout week boundary',
          status.week.done === 0 && status.week.total === 30,
          `${status.week.done} of ${status.week.total} done in the new week`)
      } catch (error) {
        check('harness threw', false, String(error?.stack ?? error).slice(0, 500))
      }

      await fetch('/__report', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ label: 'task-model', passed: checks.every((c) => c.ok), checks }),
      })
    </script>
  </body>
</html>
