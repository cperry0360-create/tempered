<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempered — tracker v2 acceptance</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module">
      /**
       * The acceptance criteria at the end of docs/09-tracker-v2.md, driven
       * against the real app. Contrast and hit-target separation are computed,
       * not eyeballed, because the spec says so.
       */
      import { bootstrapHarness as bootstrap } from './harness.js'
      import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'

      const checks = []
      const check = (name, ok, detail = '') => { checks.push({ name, ok: Boolean(ok), detail }); return Boolean(ok) }
      const q = (s) => document.querySelector(s)
      const qa = (s) => [...document.querySelectorAll(s)]
      const settle = () => new Promise((r) => setTimeout(r, 0))
      async function waitFor(selector, timeout = 5000) {
        const deadline = Date.now() + timeout
        while (Date.now() < deadline) {
          const found = q(selector)
          if (found) return found
          await new Promise((r) => setTimeout(r, 10))
        }
        throw new Error(`timed out waiting for ${selector}`)
      }

      // --- WCAG contrast -----------------------------------------------------
      const channel = (v) => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4 }
      const parse = (css) => (css.match(/[\d.]+/g) ?? []).map(Number)
      const luminance = ([r, g, b]) => 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b)
      function over(fg, bg) {
        const [fr, fg2, fb, fa = 1] = parse(fg)
        const [br, bg2, bb] = parse(bg)
        return [fr * fa + br * (1 - fa), fg2 * fa + bg2 * (1 - fa), fb * fa + bb * (1 - fa)]
      }
      function paintedBackground(node) {
        let current = node
        while (current && current !== document.documentElement) {
          const bg = getComputedStyle(current).backgroundColor
          const alpha = parse(bg)[3]
          if (bg && bg !== 'transparent' && alpha !== 0) return bg
          current = current.parentElement
        }
        return getComputedStyle(document.body).backgroundColor
      }
      function contrast(node) {
        const style = getComputedStyle(node)
        const bg = paintedBackground(node)
        const l1 = luminance(over(style.color, bg))
        const l2 = luminance(parse(bg))
        const [hi, lo] = l1 > l2 ? [l1, l2] : [l2, l1]
        return (hi + 0.05) / (lo + 0.05)
      }

      try {
        const storage = createMemoryStorage()
        const tempered = await bootstrap({ storage, mount: document.getElementById('app') })

        const active = await tempered.workout.activeProgram()
        check('the November Physique program is active', active?.program.id === 'november-physique',
          active ? `week ${active.week} of ${active.program.weeks}` : 'none')
        check('the program has five days and thirty-one slots',
          active.program.days.length === 5 &&
          active.program.days.reduce((n, d) => n + d.exercises.length, 0) === 31)

        await waitFor('[data-programday]')
        check('program days are startable from Train', qa('[data-programday]').length === 5)

        q('[data-programday="monday"]').click()
        await waitFor('.setrow__check')

        check('R3 sticky header shows the session title and elapsed time',
          q('.sessionbar__title')?.textContent?.length > 0
          && /^\d+:\d{2}$/.test(q('[data-session-elapsed]')?.textContent ?? ''),
          `${q('.sessionbar__title')?.textContent} / ${q('[data-session-elapsed]')?.textContent}`)
        check('rep RANGES are shown, not fixed reps',
          /6–10/.test(q('.exercise__range')?.textContent ?? ''), q('.exercise__range')?.textContent)
        check('one-line coaching guidance is shown when available',
          (q('.exercise__proposal')?.textContent ?? '').length > 10,
          q('.exercise__proposal')?.textContent?.slice(0, 60))

        const numberFields = qa('input.setrow__num')
        const worstPending = Math.min(...numberFields.map(contrast))
        check('set-row numbers meet WCAG AA (4.5:1)', worstPending >= 4.5,
          `worst is ${worstPending.toFixed(2)}:1 across ${numberFields.length} fields`)

        const labels = qa('.setrow--head span, .setrow__record, .setrow__index')
        const worstLabel = Math.min(...labels.map(contrast))
        check('R3 secondary set labels retain readable contrast', worstLabel >= 3,
          `worst is ${worstLabel.toFixed(2)}:1 across ${labels.length} nodes`)

        await tempered.app.show('train')
        await waitFor('.tabbar')
        const bar = q('.tabbar')
        const barBox = bar.getBoundingClientRect()
        const barStyle = getComputedStyle(bar)
        const gapBelow = window.innerHeight - barBox.bottom
        check('the tab bar sits flush to the bottom edge', Math.abs(gapBelow) <= 1, `${Math.round(gapBelow)}px below`)
        check('the tab bar spans the viewport width', Math.abs(barBox.left) <= 1 && Math.abs(document.documentElement.clientWidth - barBox.right) <= 1,
          `${Math.round(barBox.left)}px / ${Math.round(document.documentElement.clientWidth - barBox.right)}px`)
        check('the tab bar reserves safe-area padding',
          Number.parseFloat(barStyle.paddingBottom) >= 8,
          `padding-bottom: ${barStyle.paddingBottom}`)
        check('the tab bar is solid and unblurred',
          !(barStyle.backdropFilter || barStyle.webkitBackdropFilter || '').includes('blur'),
          barStyle.backgroundColor)

        q('[data-programday="monday"]').click()
        await waitFor('.setrow__check')
        const finish = q('[data-action="finish"]')
        const checkButtons = qa('.setrow__check')
        const finishBox = finish.getBoundingClientRect()
        const nearest = Math.min(...checkButtons.map((node) => {
          const box = node.getBoundingClientRect()
          const dx = Math.max(box.left - finishBox.right, finishBox.left - box.right, 0)
          const dy = Math.max(box.top - finishBox.bottom, finishBox.top - box.bottom, 0)
          return Math.hypot(dx, dy)
        }))
        check('FINISH is separated from every set control', nearest >= 44,
          `nearest set control is ${Math.round(nearest)}px away (44px = one thumb)`)

        finish.click()
        await settle()
        check('FINISH asks before ending the session', q('[data-action="confirm-finish"]') !== null)
        q('[data-action="cancel-finish"]').click()
        await settle()
        check('the session survives declining the confirm', q('.setrow__check') !== null)

        const firstCard = q('[data-exercise]')
        const openMenu = async () => {
          q('.exercise-menu__trigger', q('[data-exercise]'))?.click()
          await settle()
        }
        const chooseMenu = async (prefix) => {
          await openMenu()
          const card = q('[data-exercise]')
          const button = qa('.exercise-menu__item', card).find((node) => node.textContent.trim().startsWith(prefix))
          button?.click()
          await settle()
          return button
        }

        await chooseMenu('Rest timer')
        const restOption = q('[data-restset="90"]')
        check('B1 rest time is editable in-session from the menu', restOption !== null)
        restOption?.click(); await settle()
        check('B1 the edited rest time is kept', /1:30/.test(q('.exercise__range')?.textContent ?? ''),
          q('.exercise__range')?.textContent)

        await chooseMenu('History')
        check('B2 history opens without leaving the workout',
          q('.panel') !== null && q('.setrow__check') !== null)
        await chooseMenu('History')

        const beforeSwap = qa('.setrow:not(.setrow--head)', q('[data-exercise]')).length
        await chooseMenu('Swap')
        const swapTarget = q('[data-swapto]')
        check('B3 a swap picker is available from the menu', swapTarget !== null)
        swapTarget?.click(); await settle()
        check('B3 swapping preserves the set structure',
          qa('.setrow:not(.setrow--head)', q('[data-exercise]')).length === beforeSwap)

        const firstName = q('.exercise__name')?.textContent
        await chooseMenu('Move down')
        check('B4 exercises can be reordered from the menu', q('.exercise__name')?.textContent !== firstName,
          `${firstName} -> ${q('.exercise__name')?.textContent}`)

        await chooseMenu('Notes')
        const notes = q('.exercise-notes')
        if (notes) {
          notes.value = 'Keep shoulder packed'
          notes.dispatchEvent(new Event('input', { bubbles: true }))
        }
        check('B5 notes remain editable from the menu', notes?.value === 'Keep shoulder packed')

        const currentCard = q('[data-exercise]')
        q('.addset', currentCard)?.click(); await settle()
        check('B6 a set can still be added',
          qa('.setrow:not(.setrow--head)', q('[data-exercise]')).length === beforeSwap + 1)

        check('C the legacy inline plate calculator is removed from R3', q('.plates') === null)
        check('D exercise art is removed from the active-workout block', q('.exercise__art') === null)

        await tempered.app.show('train')
        await waitFor('[data-guide]')
        q('[data-guide]').click(); await settle()
        check('E the guide shows weekly hard sets per muscle group',
          qa('.guide__row').length > 4, `${qa('.guide__row').length} groups`)

        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'tracker-v2', passed: checks.every((c) => c.ok), checks }),
        })
      } catch (error) {
        checks.push({ name: 'harness threw', ok: false, detail: String(error?.stack ?? error).slice(0, 300) })
        await fetch('/__report', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ label: 'tracker-v2', passed: false, checks }),
        })
      }
    </script>
  </body>
</html>
