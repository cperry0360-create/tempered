<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>R11 / R11.1 Training score</title><link rel="stylesheet" href="../../src/tokens.css"><link rel="stylesheet" href="../../src/style.css"><link rel="stylesheet" href="../../src/progress.css"></head><body><div id="app"></div><script type="module">
import { createHistoryScreen } from '../../src/ui/screens/history.js'
import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
import { fixedClock } from '../../src/adapters/clock/clock.js'
const checks=[],check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail)})
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)]
const errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)))
try{
 const storage=createMemoryStorage(), clock=fixedClock(new Date(2026,8,27,12))
 const exerciseMap=new Map([['lift',{id:'lift',name:'Front squat'}]])
 const program={id:'p',weeks:16,days:[0,1].map(i=>({id:'d'+i,exercises:[{exerciseId:'lift',sets:2,repMin:6,repMax:10}]}))}
 await storage.put('programs',program);await storage.put('programState',{id:'p',programId:'p',startedOn:'2026-06-29',active:true})
 const shift=(date,n)=>new Date(Date.parse(date+'T12:00:00Z')+n*86400000).toISOString().slice(0,10)
 for(let w=0;w<13;w++)for(let d=0;d<2;d++){
  const date=shift('2026-06-29',w*7+d*2),id=`s${w}${d}`
  await storage.put('sessions',{id,date,programId:'p',endedAt:date+'T10:00:00Z',durationMinutes:30})
  for(let n=0;n<2;n++)await storage.put('setLogs',{id:id+n,sessionId:id,exerciseId:'lift',programId:'p',programDayId:'d'+d,slotIndex:0,weight:100+w*5,reps:6})
 }
 for(let n=0;n<12;n++)await storage.put('dayLogs',{date:shift('2026-09-16',n),healthMetrics:{spo2:n===11?93:96+(n%2)}})
 let copied='';Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text}}})
 let away=[];const workout={exerciseMap:async()=>exerciseMap,awayPeriods:async()=>away,addAwayPeriod:async(start,end)=>{away=[...away,{id:`away_${start}_${end}`,start,end}];return away},removeAwayPeriod:async id=>{away=away.filter(p=>p.id!==id);return away}}
 const screen=createHistoryScreen({storage,clock,workout,daily:{activities:[],activitySchedule:async()=>({})}})
 q('#app').append(screen.root);await screen.refresh()
 for(const theme of ['light','dark']){
  document.documentElement.dataset.theme=theme
  check(theme+' headline is the last completed week, with this week shown as progress and four reasons',!!q('.progress-content .progress-score')&&q('.progress-score__number')?.textContent==='100 · A'&&/Week of Sep 14/.test(q('.progress-score')?.textContent)&&/This week: \d+ of \d+ sets due so far/.test(q('.progress-score__week')?.textContent)&&!/so far:/.test(q('.progress-score__number')?.textContent)&&qa('[data-score-component]').length===5&&qa('.progress-score__reason').every(n=>n.textContent.length>10),q('.progress-score')?.textContent)
  check(theme+' trend has 12 completed weekly points and leaves out the unfinished week',qa('.progress-score__trend circle').length===12&&q('.progress-score__trend')?.getAttribute('aria-label').includes('2026-09-14: 100')&&!q('.progress-score__trend')?.getAttribute('aria-label').includes('2026-09-21'))
  for(const id of ['progression','adherence','consistency','volume']){
   q(`[data-score-component="${id}"]`)?.click()
   check(theme+' '+id+' drill-down traces the reason',qa('.progress-score-detail__row').length>0&&/Front squat|2026-09|Week of/.test(q('.progress-score-detail')?.textContent))
   q('.progress-back')?.click()
   check(theme+' '+id+' back retains score',q('.progress-score__number')?.textContent==='100 · A')
  }
  q('[data-score-info]')?.click()
  const sheet=q('.score-explain')
  check(theme+' i button opens a short explanation naming the score',sheet&&/scored 100, an A/.test(sheet.textContent)&&/How it works/.test(sheet.textContent)&&qa('.score-explain__method').length>=4&&!/fail|missed|crushed/i.test(sheet.textContent),sheet?.textContent)
  q('.score-explain__done')?.click()
  check(theme+' Done closes the explanation',!q('.score-explain'))
 }
 q('[data-score-component="weeks"]')?.click()
 q('[data-away-toggle="2026-09-14"]')?.click();await new Promise(r=>setTimeout(r,50))
 check('Mark away stores the week through the workout service',away.some(p=>p.start==='2026-09-14'&&p.end==='2026-09-20'))
 q('.progress-back')?.click()
 check('the card says why its graded week is older than last week',/Sep 14 away/.test(q('.progress-score')?.textContent),q('.progress-score')?.textContent)
 q('.progress-report__button--copy')?.click();await new Promise(r=>setTimeout(r,50))
 const copiedData=()=>JSON.parse(copied.slice(copied.lastIndexOf('\n')+1))
 let scoreReport=copiedData().trainingScore
 check('AI report includes the last graded week and reason a newer week was excluded',
   scoreReport.latestGradedWeek.week==='2026-09-07'
   &&scoreReport.skippedWeeks.some(w=>w.week==='2026-09-14'&&w.reason==='away')
   &&scoreReport.explanation.some(s=>s.includes('marked away')),
   JSON.stringify(scoreReport).slice(0,1200))
 check('an away week drops out: headline moves to the prior week and the trend shows a gap',/Week of Sep 7/.test(q('.progress-score')?.textContent)&&qa('.progress-score__trend circle').length===11,q('.progress-score')?.textContent)
 q('[data-score-component="weeks"]')?.click();q('[data-away-toggle="2026-09-14"]')?.click();await new Promise(r=>setTimeout(r,50));q('.progress-back')?.click()
 check('Not away restores the week',away.length===0&&/Week of Sep 14/.test(q('.progress-score')?.textContent))
 q('.progress-report__button--copy')?.click();await new Promise(r=>setTimeout(r,50))
 scoreReport=copiedData().trainingScore
 check('AI report includes training score, grade, this week, four components and prior-week comparison',
   scoreReport.latestGradedWeek.score===100
   &&scoreReport.latestGradedWeek.grade==='A'
   &&scoreReport.currentWeek
   &&scoreReport.changeVsPriorFourWeeks!==null
   &&['progression','adherence','consistency','volume'].every(id=>
      scoreReport.latestGradedWeek.components.some(c=>c.id===id&&c.reason)),
   JSON.stringify(scoreReport).slice(0,1600))
 const adherence=scoreReport.latestGradedWeek.components.find(c=>c.id==='adherence')
 const consistency=scoreReport.latestGradedWeek.components.find(c=>c.id==='consistency')
 check('AI report retains arithmetic for plan adherence and consistency',
   adherence?.formula?.includes('70% ×')
   &&adherence?.formula?.includes('planned sets finished')
   &&consistency?.formula?.includes('70% ×')
   &&consistency?.formula?.includes('planned training days'),
   JSON.stringify({adherence,consistency}))
 check('AI report preserves scoring methodology without prose padding',
   scoreReport.methodology.some(s=>s.includes('70% planned sets finished, 30% sets that reached the rep minimum'))
   &&!copied.includes('\n\n'))
 const report=copiedData()
 check('recovery readings are included as observed records, not fabricated trends',
   report.dailyHistory.find(d=>d.date==='2026-09-27')?.healthMetrics?.spo2===93
   &&report.periods['14'].health.spo2.sampleDays===12,
   JSON.stringify(report.periods['14'].health.spo2))
 q('[data-view="log"]')?.click();check('existing Log remains available',qa('.progress-log-row').length>0)
 check('no runtime errors',errors.length===0,errors.join('\n'))
 const empty=createHistoryScreen({storage:createMemoryStorage(),clock,workout:{exerciseMap:async()=>new Map(),awayPeriods:async()=>[]},daily:{activities:[],activitySchedule:async()=>({})}})
 q('#app').replaceChildren(empty.root);await empty.refresh()
 check('empty state shows Building history and no fabricated trend points',q('.progress-score__number')?.textContent==='Building history'&&qa('.progress-score__trend circle').length===0&&qa('[data-score-component]').length===1)
 const cutId='beach-cut-2026'
 await storage.put('programState',{id:'p',programId:'p',startedOn:'2026-06-29',active:false})
 await storage.put('programState',{id:cutId,programId:cutId,startedOn:'2026-09-14',active:true})
 await storage.put('programs',{...program,id:cutId,days:[
  {id:'d0',name:'First day',exercises:[{exerciseId:'lift',sets:1,repMin:6}]},
  {id:'d1',name:'Second day',exercises:[{exerciseId:'lift',sets:2,repMin:6},{exerciseId:'other',sets:1,repMin:6}]},
 ]})
 for(const session of (await storage.getAll('sessions')).filter(row=>row.date>='2026-09-14')){
  await storage.put('sessions',{...session,programId:cutId})
  for(const log of (await storage.getAllByIndex('setLogs','sessionId',session.id))){
   await storage.put('setLogs',{...log,programId:cutId})
  }
 }
 q('#app').replaceChildren(screen.root);await screen.refresh()
 q('[data-view="overview"]')?.click()
 check('Cut score grades this week only and labels strength and volume as trends',
  q('.progress-score h2')?.textContent==='Cut plan score'&&q('.progress-score__number')?.textContent==='90 · A'
  &&['progression','volume'].every(id=>{
   const row=q(`[data-score-component="${id}"]`)
   return row?.textContent.includes('Trend only')&&!row.querySelector('.progress-score__bar')
  })&&!q('.progress-score__change'),q('.progress-score')?.textContent)
 q('[data-score-component="adherence"]')?.click()
 check('Cut adherence shows the unfilled lift first and distinguishes extra logged sets',
  q('.progress-score-detail__row')?.textContent.includes('other · Second day: 0 of 1')
  &&q('.progress-score-detail')?.textContent.includes('1 logged working set was outside the matched plan totals'))
 q('.progress-back')?.click()
 q('[data-score-info]')?.click()
 check('Cut score explains the plan and the weighting',/maintain strength at lower volume/.test(q('.score-explain')?.textContent)
  &&/Consistency \(45%\)/.test(q('.score-explain')?.textContent))
 q('.score-explain__done')?.click()
 check('no runtime errors after cut score drill-down',errors.length===0,errors.join('\n'))
}catch(e){check('harness completed',false,e.stack)}
await fetch('/__report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({label:'training-score-r11',passed:checks.every(c=>c.ok),checks})})
</script></body></html>
