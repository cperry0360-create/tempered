<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — Water stress</title>
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/uplift.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'

    const checks = []
    const errors = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s) => document.querySelector(s)
    const settle = (ms = 35) => new Promise((resolve) => setTimeout(resolve, ms))
    window.addEventListener('error', (event) => errors.push(event.message || 'runtime error'))
    window.addEventListener('unhandledrejection', (event) => errors.push(String(event.reason || 'rejection')))

    function waterValue() {
      const text = q('[data-activity="water"] .today-item__meta')?.textContent ?? ''
      const match = text.match(/([0-9.]+)\s*\/\s*[0-9.]+\s*oz/i)
      return match ? Number(match[1]) : NaN
    }

    async function tapQuick(amount, index) {
      const before = waterValue()
      const button = q(`[data-activity="water"] [data-quickadd="${amount}"]`)
      if (!button) throw new Error(`Water +${amount} button missing at tap ${index}`)
      button.click()
      for (let wait = 0; wait < 50 && waterValue() !== before + amount; wait += 1) await settle(20)
      check(`tap ${index}: +${amount} advances exactly once`, waterValue() === before + amount, `${before} -> ${waterValue()}`)
      check(`tap ${index}: exactly one quick action remains`,
        document.querySelectorAll('[data-activity="water"] .today-item__quick').length === 1)
    }

    try {
      const clock = fixedClock(new Date(2026, 8, 9, 9, 0, 0))
      const tempered = await bootstrap({ storage: createMemoryStorage(), clock, mount: q('#app') })
      await tempered.daily.setCadence('water', 'daily', 1)
      await tempered.app.show('today')
      await settle(80)

      check('R2 Water renders one default quick action', q('[data-activity="water"] [data-quickadd="20"]') !== null)
      for (let i = 1; i <= 10; i += 1) await tapQuick(20, i)
      check('ten sequential quick taps all persist', (await tempered.daily.dayLog(clock.today())).waterOz === 200)

      q('[data-activity="water"] .today-item__body')?.click(); await settle()
      const field = q('[data-editor="water"] .today-editor__preset-input')
      field.value = '24'
      q('[data-editor="water"] .today-editor__preset-save')?.click(); await settle()
      check('custom amount replaces the one quick action', q('[data-activity="water"] [data-quickadd="24"]') !== null)
      await tapQuick(24, 11)
      check('custom quick amount persists additively', (await tempered.daily.dayLog(clock.today())).waterOz === 224)
      check('no uncaught error or rejection during Water stress', errors.length === 0, errors.join(' | ') || 'none')
    } catch (error) {
      check('Water stress harness threw', false, String(error?.stack ?? error).slice(0, 900))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'water-stress', passed: checks.every((item) => item.ok), checks }),
    })
  </script>
</body>
</html>
