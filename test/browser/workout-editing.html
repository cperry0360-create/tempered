<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tempered — workout editing ergonomics</title>
  <link rel="stylesheet" href="../../src/tokens.css" />
  <link rel="stylesheet" href="../../src/style.css" />
  <link rel="stylesheet" href="../../src/calm.css" />
  <link rel="stylesheet" href="../../src/progress.css" />
  <link rel="stylesheet" href="../../src/lfms-subscreen.css" />
  <link rel="stylesheet" href="../../src/workout-r5.css" />
  <link rel="stylesheet" href="../../src/polish.css" />
  <link rel="stylesheet" href="../../src/mobile-fixes.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    import { bootstrapHarness as bootstrap } from './harness.js'
    import { createMemoryStorage } from '../../src/adapters/storage/memory-storage.js'
    import { createIndexedDbStorage } from '../../src/adapters/storage/indexeddb-storage.js'
    import { fixedClock } from '../../src/adapters/clock/clock.js'
    import { installMobileInteractions } from '../../src/ui/mobile-interactions.js'

    const checks = []
    const check = (name, ok, detail = '') => checks.push({ name, ok: Boolean(ok), detail: String(detail ?? '') })
    const q = (s, root = document) => root?.querySelector?.(s) ?? null
    const qa = (s, root = document) => root?.querySelectorAll ? [...root.querySelectorAll(s)] : []
    const settle = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms))

    async function waitFor(selector, timeout = 4000) {
      const end = Date.now() + timeout
      while (Date.now() < end) {
        const node = q(selector)
        if (node) return node
        await settle(20)
      }
      throw new Error(`timed out waiting for ${selector}`)
    }

    try {
      installMobileInteractions()
      const clock = fixedClock(new Date(2026, 8, 7, 9, 0, 0))
      const tempered = await bootstrap({ storage: createMemoryStorage(), clock, mount: q('#app') })
      await tempered.app.show('train')
      await waitFor('[data-programday="monday"]')
      q('[data-programday="monday"]')?.click()
        q('[data-start-preview]')?.click()
      await waitFor('.screen--session .setrow__num[data-field="weight"]')

      let card = q('.screen--session [data-exercise]')
      let weights = qa('.setrow__num[data-field="weight"]', card)
      let reps = qa('.setrow__num[data-field="reps"]', card)
      check('test exercise has at least four editable sets', weights.length >= 4 && reps.length >= 4,
        `${weights.length} weights / ${reps.length} reps`)

      // Establish set 1, then log it so the following edit is a real mid-exercise adjustment.
      weights[0].value = '12'
      weights[0].dispatchEvent(new Event('input', { bubbles: true }))
      reps[0].value = '16'
      reps[0].dispatchEvent(new Event('input', { bubbles: true }))
      q('.setrow__check', card)?.click()
      await settle(120)

      card = q('.screen--session [data-exercise]')
      weights = qa('.setrow__num[data-field="weight"]', card)
      reps = qa('.setrow__num[data-field="reps"]', card)
      check('set 1 is now historical/read-only', weights[0]?.readOnly === true)

      // Give set 2 a real previous value exactly like the user's screenshot.
      // The selection check is intentionally meaningless if the input is blank.
      weights[1].value = '12'
      weights[1].dispatchEvent(new Event('input', { bubbles: true }))
      reps[1].value = '16'
      reps[1].dispatchEvent(new Event('input', { bubbles: true }))
      check('second set has an existing value to replace', weights[1].value === '12', weights[1].value)

      weights[1].focus()
      await settle(90)
      check('existing weight is fully selected for replacement',
        weights[1]?.selectionStart === 0
          && weights[1]?.selectionEnd === weights[1]?.value.length
          && weights[1]?.value.length > 0,
        `${weights[1]?.selectionStart}..${weights[1]?.selectionEnd} of ${weights[1]?.value.length}`)

      // Change set 2. Reps are part of the new prescription and should travel with the weight.
      weights[1].value = '15.5'
      weights[1].dispatchEvent(new Event('input', { bubbles: true }))
      weights[1].dispatchEvent(new Event('change', { bubbles: true }))
      await settle(140)

      card = q('.screen--session [data-exercise]')
      weights = qa('.setrow__num[data-field="weight"]', card)
      reps = qa('.setrow__num[data-field="reps"]', card)

      check('editing set 2 carries its weight into every later unlogged set',
        weights.slice(2).every((input) => input.value === '15.5'),
        weights.map((input) => input.value || '-').join(', '))
      check('editing set 2 carries its reps into every later unlogged set',
        reps.slice(2).every((input) => input.value === '16'),
        reps.map((input) => input.value || '-').join(', '))
      check('the already logged set is never rewritten by a cascade',
        weights[0]?.value === '12' && reps[0]?.value === '16',
        `${weights[0]?.value} × ${reps[0]?.value}`)

      // Use the production storage adapter for the edit and PR rollback.
      await tempered.app.show('train')
      const storage = createIndexedDbStorage({ name: 'workout-editing-harness' })
      const app = await bootstrap({ storage, clock, mount: q('#app') })
      await storage.put('sessions', { id: 'prior', date: '2026-09-05', endedAt: '2026-09-05T09:30:00' })
      await storage.put('setLogs', { id: 'previous', sessionId: 'prior', exerciseId: 'squat_bb', weight: 200, reps: 8 })
      await storage.put('records', { exerciseId: 'squat_bb', bestWeight: { weight: 200, reps: 8, date: '2026-09-05' } })
      await app.app.startSession({ exerciseId: 'squat_bb' })
      const enterSet = (weight, repCount) => {
        const row = q('.screen--session .setrow[data-done="false"]')
        for (const [field, value] of [['weight', weight], ['reps', repCount]]) {
          const input = q(`[data-field="${field}"]`, row)
          input.value = value
          input.dispatchEvent(new Event('input', { bubbles: true }))
        }
        q('.setrow__check', row).click()
      }
      enterSet('928', '5')
      let warning = await waitFor('[data-weight-pr-warning][open]')
      check('warning compares 928 lb with the 200 lb weight PR', warning.textContent.includes('928 lb') && warning.textContent.includes('200 lb'))
      check('warning opens before writing the set', (await storage.count('setLogs')) === 1)
      q('button', warning).click()
      await settle()
      check('Edit weight returns to the field without saving', document.activeElement?.dataset.field === 'weight' && (await storage.count('setLogs')) === 1)

      enterSet('928', '5')
      warning = await waitFor('[data-weight-pr-warning][open]')
      qa('button', warning)[1].click()
      await waitFor('.setrow[data-done="true"]')
      check('Log anyway saves a confirmed set', (await storage.count('setLogs')) === 2)
      q('[aria-label="Finish"]')?.click()
      ;(await waitFor('[data-action="confirm-finish"]')).click()
      ;(await waitFor('[data-completion-intro]')).click()
      ;(await waitFor('[data-action="edit-workout"]')).click()
      ;(await waitFor('[data-edit-logged-set]')).click()
      let form = await waitFor('[data-edit-set-form]')
      q('[name="weight"]', form).value = '185'
      q('[name="reps"]', form).value = '6'
      q('button[type="submit"]', form).click()
      await settle(200)
      check('correction updates workout totals and the persisted PR',
        q('.progress-session-detail__summary')?.textContent.includes('1,110 lb volume') &&
        (await storage.get('records', 'squat_bb'))?.bestWeight?.weight === 200)
      check('duration editing stays available', q('.progress-session-detail__duration button')?.textContent === 'Adjust minutes')
      ;(await waitFor('[data-edit-logged-set]')).click()
      form = await waitFor('[data-edit-set-form]')
      q('[name="weight"]', form).value = '555'
      q('button[type="button"]', form).click()
      check('Cancel leaves the saved set alone', (await storage.getAll('setLogs')).find((row) => row.id !== 'previous')?.weight === 185)
    } catch (error) {
      check('workout editing harness threw', false, String(error?.stack ?? error).slice(0, 700))
    }

    await fetch('/__report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'workout-editing', passed: checks.every((c) => c.ok), checks }),
    })
  </script>
</body>
</html>
